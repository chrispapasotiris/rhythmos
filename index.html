<script>
/* ===== ΠΡΟΓΡΑΜΜΑ v8: ΑΝΑΒΟΛΗ + ΚΛΕΙΣΙΜΟ + ΥΠΕΡΒΑΣΗ ===== */
state.slotStatus=state.slotStatus||{};
state.slotRunning=state.slotRunning||null;

function slotDateKey(){return getDailyPlanKey();}
function slotStatusGet(id){
  var k=slotDateKey();
  return (state.slotStatus[k]&&state.slotStatus[k][id])||null;
}
function slotStatusSet(id,patch){
  var k=slotDateKey();
  if(!state.slotStatus[k])state.slotStatus[k]={};
  var cur=state.slotStatus[k][id]||{};
  for(var key in patch){
    if(patch.hasOwnProperty(key))cur[key]=patch[key];
  }
  state.slotStatus[k][id]=cur;
  saveState();
}
function slotParseHM(v){
  var p=String(v||'0:0').split(':');
  var h=parseInt(p[0],10)||0;
  var m=parseInt(p[1],10)||0;
  return h*60+m;
}
function slotFmtHM(min){
  min=Math.max(0,Math.min(1439,Math.round(min)));
  var h=Math.floor(min/60),m=min%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function slotNowMin(){
  var d=new Date();
  return d.getHours()*60+d.getMinutes();
}
function slotEff(s){
  var st=slotStatusGet(s.id)||{};
  return {
    start:st.start||s.start,
    end:st.end||s.end,
    count:st.postponeCount||0,
    status:st.status||'pending',
    overtime:!!st.overtime,
    startedAt:st.startedAt||0,
    lastAsk:st.lastAsk||0
  };
}
function slotName(s){return scheduleActivityName(s.activityId);}
function slotActivityParts(s){
  var p=String(s.activityId).split(':');
  return {type:p[0],id:p.slice(1).join(':')};
}
function slotRunningInfo(){
  if(!state.slotRunning)return null;
  var s=scheduleFind(state.slotRunning.slotId);
  if(!s){state.slotRunning=null;return null;}
  var st=slotStatusGet(s.id);
  if(!st||(st.status!=='accepted'&&st.status!=='late')){
    state.slotRunning=null;
    return null;
  }
  return {s:s,st:st,eff:slotEff(s)};
}
function slotMarkDone(slotId,source){
  var s=scheduleFind(slotId);
  if(!s)return;
  var st=slotStatusGet(slotId);
  if(!st||st.status==='done'||st.status==='skipped')return;

  var running=state.slotRunning&&state.slotRunning.slotId===slotId?state.slotRunning:null;
  var end=Date.now();
  var start=running?running.start:(st.startedAt||end);
  var dur=0;

  try{
    if(running&&typeof totalMin==='function'){
      dur=totalMin(running.type,running.id,start,end);
    }else{
      dur=Math.max(0,Math.round((end-start)/60000));
    }
  }catch(e){
    dur=Math.max(0,Math.round((end-start)/60000));
  }

  slotStatusSet(slotId,{
    status:'done',
    endedAt:end,
    actualDurMin:Math.round(dur),
    overtime:false,
    lastAsk:0
  });

  if(state.slotRunning&&state.slotRunning.slotId===slotId)state.slotRunning=null;
  saveState();
  if(source!=='silent')render();
}
function slotAccept(s){
  if(state.slotRunning){
    showToast('Τρέχει ήδη θέση. Ολοκλήρωσέ την πρώτα.');
    return;
  }

  var now=slotNowMin();
  var eff=slotEff(s);
  var late=now>slotParseHM(eff.start);
  var parts=slotActivityParts(s);

  slotStatusSet(s.id,{
    status:late?'late':'accepted',
    startedAt:Date.now(),
    endedAt:0,
    actualDurMin:0,
    overtime:false,
    lastAsk:0
  });

  state.slotRunning={
    slotId:s.id,
    type:parts.type,
    id:parts.id,
    start:Date.now()
  };

  closeModal();

  if(parts.type==='course'){
    if(typeof pomoSel!=='undefined')pomoSel={type:'course',id:parts.id};
    if(typeof startPomodoro==='function')startPomodoro();
    else if(typeof openPomodoroSetup==='function')openPomodoroSetup();
  }else if(parts.type==='fixed'){
    if(typeof doStart==='function')doStart('fixed',parts.id);
  }

  saveState();
  render();
}
function slotDecline(s){
  slotStatusSet(s.id,{status:'skipped',lastAsk:0});
  if(state.slotRunning&&state.slotRunning.slotId===s.id)state.slotRunning=null;
  closeModal();
  showToast('Απορρίφθηκε: '+slotName(s));
  render();
}
function slotPostpone15(s){
  var st=slotStatusGet(s.id)||{};
  var count=st.postponeCount||0;
  if(count>=7){
    showToast('Όριο αναβολών +15λ εξαντλήθηκε.');
    return;
  }

  var eff=slotEff(s);
  var sm=slotParseHM(eff.start);
  var em=slotParseHM(eff.end);

   if(st.status==='accepted'||st.status==='late'){
    var newEnd=Math.min(1439,em+15);
    if(scheduleSleepBlocked(scheduleCurDay,eff.start,slotFmtHM(newEnd))){
      showToast('Η αναβολή θα έπεφτε μέσα στο πρότυπο ύπνου.');
      return;
    }
    slotStatusSet(s.id,{
      end:slotFmtHM(newEnd),
      postponeCount:count+1,
      overtime:false,
      lastAsk:Date.now()
    });
    showToast('Νέα λήξη: '+slotFmtHM(newEnd)+'.');
  }else{
    var newStart=Math.min(1438,sm+15);
    var newEnd=Math.min(1439,Math.max(newStart+1,em+15));
    if(scheduleSleepBlocked(scheduleCurDay,slotFmtHM(newStart),slotFmtHM(newEnd))){
      showToast('Η αναβολή θα έπεφτε μέσα στο πρότυπο ύπνου.');
      return;
    }
    slotStatusSet(s.id,{
      status:'pending',
      start:slotFmtHM(newStart),
      end:slotFmtHM(newEnd),
      postponeCount:count+1,
      lastAsk:0
    });
    showToast('Αναβολή: '+slotFmtHM(newStart)+' – '+slotFmtHM(newEnd)+'.');
  }

  closeModal();
  saveState();
  render();
}
function slotContinueOvertime(s){
  slotStatusSet(s.id,{overtime:true,lastAsk:Date.now()});
  closeModal();
  showToast('Συνέχεια με υπέρβαση.');
  render();
}
function slotFinishById(id){
  var info=slotRunningInfo();
  if(!info||info.s.id!==id){
    var st=slotStatusGet(id);
    if(st&&(st.status==='accepted'||st.status==='late'))slotMarkDone(id);
    return;
  }

  try{
    if(state.active)stopActive(false);
  }catch(e){}

  try{
    if(typeof P==='function'&&P().phase)abortPomodoro(true);
  }catch(e){}

  slotMarkDone(id);
  showToast('Ολοκληρώθηκε: '+slotName(info.s));
}
function slotCustomTime(s,mode){
  var eff=slotEff(s);
  var st=slotStatusGet(s.id)||{};
  var body='<div class="field" style="display:flex;gap:8px">'
    +'<div style="flex:1"><label>Έναρξη</label>'
    +'<input type="time" id="slotCustomStart" value="'+eff.start+'"'+(mode==='end'?' disabled':'')+'></div>'
    +'<div style="flex:1"><label>Λήξη</label>'
    +'<input type="time" id="slotCustomEnd" value="'+eff.end+'"></div>'
    +'</div>';

  openModal({
    title:mode==='end'?'Νέα λήξη':'Νέα ώρα για σήμερα',
    body:body,
    buttons:[
      {text:'Άκυρο',class:'btn-ghost'},
      {
        text:'Αποθήκευση',
        class:'btn-primary',
        close:false,
        onClick:function(){
          var startEl=document.getElementById('slotCustomStart');
          var endEl=document.getElementById('slotCustomEnd');
          var sv=startEl&&!startEl.disabled?startEl.value:eff.start;
          var ev=endEl?endEl.value:'';

          if(!sv||!ev){
            showToast('Συμπλήρωσε ώρες.');
            return false;
          }

          var sm=slotParseHM(sv);
          var em=slotParseHM(ev);
          var now=slotNowMin();

          if(em<=sm){
            showToast('Η λήξη πρέπει να είναι μετά την έναρξη.');
            return false;
          }

          if(mode==='end'&&em<=now){
            showToast('Η νέα λήξη πρέπει να είναι μελλοντική.');
            return false;
          }

          if(scheduleSleepBlocked(scheduleCurDay,sv,ev)){showToast('Η νέα ώρα πέφτει μέσα στο πρότυπο ύπνου.');return false;}

          if(mode!=='end'&&em<=now){
            slotStatusSet(s.id,{
              status:'skipped',
              start:sv,
              end:ev,
              lastAsk:0
            });
            closeModal();
            showToast('Η νέα ώρα πέρασε: η θέση απορρίφθηκε.');
            render();
            return true;
          }

          slotStatusSet(s.id,{
            status:mode==='end'?(st.status||'accepted'):'pending',
            start:sv,
            end:ev,
            lastAsk:0
          });

          closeModal();
          showToast('Ενημερώθηκε: '+sv+' – '+ev);
          render();
          return true;
        }
      }
    ]
  });
}
function slotAcceptById(id){var s=scheduleFind(id);if(s)slotAccept(s);}
function slotDeclineById(id){var s=scheduleFind(id);if(s)slotDecline(s);}
function slotPostpone15ById(id){var s=scheduleFind(id);if(s)slotPostpone15(s);}
function slotCustomTimeById(id,mode){var s=scheduleFind(id);if(s)slotCustomTime(s,mode);}

function slotAskPending(s){
  var eff=slotEff(s);
  var now=slotNowMin();
  var sm=slotParseHM(eff.start);
  var late=now>sm;
  var title=late
    ?'Εκπρόθεσμη έναρξη: '+slotName(s)
    :'Σε '+Math.max(0,sm-now)+' λεπτά: '+slotName(s);
  var message=slotName(s)+' · '+eff.start+' – '+eff.end
    +(eff.count?' · αναβολές '+eff.count+'/7':'');

  var buttons=[
    {text:late?'Έναρξη τώρα':'Αποδοχή',class:'btn-primary',onClick:function(){slotAccept(s);}},
    {text:'Απόρριψη',class:'btn-ghost',onClick:function(){slotDecline(s);}}
  ];

  if(eff.count<7){
    buttons.push({text:'+15λ',class:'btn-warn',onClick:function(){slotPostpone15(s);}});
  }

  buttons.push({text:'Νέα ώρα',class:'btn-ghost',onClick:function(){slotCustomTime(s,'both');}});

  slotStatusSet(s.id,{lastAsk:Date.now()});
  openModal({title:title,message:message,buttons:buttons});
}
function slotAskCompletion(s){
  var eff=slotEff(s);
  var now=slotNowMin();
  var em=slotParseHM(eff.end);
  var extra=Math.max(0,now-em);
  var title=extra>0
    ?'Υπέρβαση '+extra+'λ: '+slotName(s)
    :'Λήξη σε '+Math.max(0,em-now)+' λεπτά: '+slotName(s);
  var message=slotName(s)+' · προγραμματισμένη λήξη '+eff.end
    +(eff.count?' · αναβολές '+eff.count+'/7':'');

  var buttons=[
    {text:'Ναι, ολοκληρώθηκε',class:'btn-success',onClick:function(){slotFinishById(s.id);}},
    {text:'Όχι, συνέχισε',class:'btn-ghost',onClick:function(){slotContinueOvertime(s);}}
  ];

  if(eff.count<7){
    buttons.push({text:'+15λ',class:'btn-warn',onClick:function(){slotPostpone15(s);}});
  }

  buttons.push({text:'Νέα λήξη',class:'btn-ghost',onClick:function(){slotCustomTime(s,'end');}});

  slotStatusSet(s.id,{lastAsk:Date.now()});
  openModal({title:title,message:message,buttons:buttons});
}

function slotNextPending(){
  var list=scheduleGetDay(mondayIndex());
  var now=slotNowMin();
  var best=null;
  var bestStart=999999;

  list.forEach(function(s){
    var st=slotStatusGet(s.id);
    if(st&&st.status!=='pending')return;
    var eff=slotEff(s);
    var sm=slotParseHM(eff.start);
    if(sm>now&&sm<bestStart){
      best=s;
      bestStart=sm;
    }
  });

  return best;
}
function slotLatePending(){
  var list=scheduleGetDay(mondayIndex());
  var now=slotNowMin();

  for(var i=0;i<list.length;i++){
    var s=list[i];
    var st=slotStatusGet(s.id);
    if(st&&st.status!=='pending')continue;
    var eff=slotEff(s);
    var sm=slotParseHM(eff.start);
    var em=slotParseHM(eff.end);
    if(sm<=now&&now<em)return s;
  }

  return null;
}

function slotPendingCardHTML(s,late){
  var eff=slotEff(s);
  var now=slotNowMin();
  var sm=slotParseHM(eff.start);
  var timeHtml=late
    ?'<strong class="text-warn">εκκρεμεί απάντηση</strong>'
    :'<strong class="text-success">σε '+Math.max(0,sm-now)+'λ</strong>';

  var actions='<div class="actions">'

  if(eff.count<7){

    +(eff.count?' · αναβολές '+eff.count+'/7':'')+'</p>'

    +actions;
}
function nextCardHTML(){
  var running=slotRunningCardHTML();
  if(running){
    return '<div class="card" id="next-slot-card">'+running+'</div>';
  }

  var late=slotLatePending();
  if(late){
    return '<div class="card" id="next-slot-card">'+slotPendingCardHTML(late,true)+'</div>';
  }

  var next=slotNextPending();
  if(!next){
    return '<div class="card" id="next-slot-card"><h3>Επόμενη θέση</h3><p class="muted">Καμία επόμενη θέση σήμερα.</p></div>';
  }

  return '<div class="card" id="next-slot-card">'+slotPendingCardHTML(next,false)+'</div>';
}

function slotUpdateOvertimeUI(){

          dockCard.appendChild(el);

        fo.appendChild(fel);
      }
      fel.textContent=badgeText;

}

function slotTick(){
  if(modalOpen)return;

  var ov=document.getElementById('focusOverlay');
  if(ov&&!ov.classList.contains('hidden'))return;

  if(state.sleep&&state.sleep.asleep)return;

  if(state.slotRunning&&!scheduleFind(state.slotRunning.slotId)){
    state.slotRunning=null;
  }

  if(state.slotRunning){
    var hasActive=!!state.active;
    var hasPomo=false;
    try{hasPomo=typeof P==='function'&&!!P().phase;}catch(e){}
    if(!hasActive&&!hasPomo&&Date.now()-state.slotRunning.start>5*60000){
      slotStatusSet(state.slotRunning.slotId,{status:'skipped',lastAsk:0});state.slotRunning=null;saveState();
    }
  }

  var now=slotNowMin();
  var list=scheduleGetDay(mondayIndex());
  var changed=false;

  for(var i=0;i<list.length;i++){
    var s=list[i];
    var st=slotStatusGet(s.id)||{};
    var eff=slotEff(s);
    var sm=slotParseHM(eff.start);
    var em=slotParseHM(eff.end);

    if(st.status==='done'||st.status==='skipped')continue;

    if(!st.status||st.status==='pending'){
      if(now>=em){
        slotStatusSet(s.id,{status:'skipped',lastAsk:0});
        changed=true;
        continue;
      }

      if(now>=sm-5){
        var lastPending=st.lastAsk||0;
        if(Date.now()-lastPending>5*60000){
          slotAskPending(s);
          return;
        }
      }
    }else if(st.status==='accepted'||st.status==='late'){
      if(now>=em-5){
        var lastDone=st.lastAsk||0;
        var interval=st.overtime?15*60000:5*60000;
        if(Date.now()-lastDone>interval){
          slotAskCompletion(s);
          return;
        }
      }
    }
  }

  if(changed)render();
  slotUpdateOvertimeUI();
}

function nextSlotMount(){
  var main=document.querySelector('main');
  if(!main)return;

  var active=document.querySelector('.nav-btn.active');
  var label=active?active.textContent:'';
  if(label.indexOf('Ημέρα')<0)return;

  var html=nextCardHTML();
  var el=document.getElementById('next-slot-card');

  if(el){
    el.outerHTML=html;
  }else{
    var sched=document.getElementById('schedule-card');
    if(sched){
      sched.insertAdjacentHTML('beforebegin',html);
    }else{
      main.insertAdjacentHTML('beforeend',html);
    }
  }

  slotUpdateOvertimeUI();
}

var _stopActive8=stopActive;
stopActive=function(auto){
  var run=state.slotRunning;
  _stopActive8(auto);
  if(run)slotMarkDone(run.slotId,'stop');
};

var _abortPomo8=abortPomodoro;
abortPomodoro=function(silent){
  var run=state.slotRunning;
  _abortPomo8(silent);
  if(run)slotMarkDone(run.slotId,'abort');
};

var _renderSlot8=render;
render=function(){
  _renderSlot8();
  setTimeout(nextSlotMount,0);
};

if(!window.__slotV8Timers){
  window.__slotV8Timers=true;
  setInterval(slotTick,15000);
  setInterval(nextSlotMount,30000);
  setInterval(slotUpdateOvertimeUI,5000);
}

saveState();
render();
/* ===== ΤΕΛΟΣ ΠΡΟΓΡΑΜΜΑΤΟΣ v8 ===== */
</script>  

<script>
/* ===== ΗΧΟΣ v4: ΑΝΘΕΚΤΙΚΟ SEEK + ΕΠΑΝΑΣΥΝΔΕΣΗ ΤΟΠΙΚΩΝ + ΜΟΝΙΜΗ ΑΠΟΘΗΚΕΥΣΗ ===== */
var audDragging=false;
var audIsSeeking=false;
var audSeekPending=null;
var audPlayToken=0;
var audStallTimer=0;
var audRecoverAttempts=0;
var audCurrentObjectURL=null;
var AUD_RELINK_INPUT=null;
var audPersistRequested=false;

function audFmtTime(s){
  s=Math.floor(Number(s)||0);
  if(s<0)s=0;
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function audHasDuration(){
  return AUD_EL.duration && !isNaN(AUD_EL.duration) && AUD_EL.duration>0;
}
function audPctToSec(pct){
  pct=parseFloat(pct);
  if(isNaN(pct)||!audHasDuration())return 0;
  return Math.max(0,Math.min(AUD_EL.duration,(pct/100)*AUD_EL.duration));
}
function audSecToPct(sec){
  if(!audHasDuration())return 0;
  return Math.max(0,Math.min(100,((Number(sec)||0)/AUD_EL.duration)*100));
}
function audSetSeekLabel(sec){
  var cur=document.getElementById('audCur');
  if(cur)cur.textContent=audFmtTime(sec);
}
function audSetDurLabel(){
  var dur=document.getElementById('audDur');
  if(dur)dur.textContent=audFmtTime(AUD_EL.duration||0);
}
function audUpdateSeek(){
  if(audDragging)return;
  var el=document.getElementById('audSeek');
  if(!el)return;
  if(!audHasDuration()){
    el.value=0;
    audSetSeekLabel(0);
    audSetDurLabel();
    return;
  }
  el.value=audSecToPct(AUD_EL.currentTime);
  audSetSeekLabel(AUD_EL.currentTime);
  audSetDurLabel();
}
function audClearStall(){
  clearTimeout(audStallTimer);
  audStallTimer=0;
}
function audArmStall(token){
  audClearStall();
  audStallTimer=setTimeout(function(){
    if(token!==audPlayToken)return;
    if(state.audio.playing && AUD_EL.paused){
      audRecover();
    }
  },2200);
}
function audRevokeCurrentObjectURL(){
  if(audCurrentObjectURL){
    try{URL.revokeObjectURL(audCurrentObjectURL);}catch(e){}
    audCurrentObjectURL=null;
  }
}
function audRequestPersist(){
  if(audPersistRequested)return;
  audPersistRequested=true;
  try{
    if(navigator.storage && navigator.storage.persisted && navigator.storage.persist){
      navigator.storage.persisted().then(function(p){
        if(!p){
          navigator.storage.persist().catch(function(){});
        }
      }).catch(function(){});
    }
  }catch(e){}
}
audRequestPersist();

function audRecover(){
  if(audRecoverAttempts>2){
    audRecoverAttempts=0;
    var tr0=audFindTrack();
    if(tr0){
      state.audio.playing=false;
      saveState();
      audPlayTrack(state.audio.curCat,tr0,false);
    }
    return;
  }
  audRecoverAttempts++;

  var token=++audPlayToken;
  var wasPlaying=state.audio.playing;
  var t=AUD_EL.currentTime;
  var url=AUD_EL.currentSrc || audCurrentObjectURL;

  audIsSeeking=false;
  audSeekPending=null;
  audClearStall();

  try{AUD_EL.pause();}catch(e){}

  if(!url){
    var tr=audFindTrack();
    if(tr){
      state.audio.playing=wasPlaying;
      audPlayTrack(state.audio.curCat,tr,true);
    }
    return;
  }

  AUD_EL.src=url;
  try{AUD_EL.load();}catch(e){}

  function restore(){
    if(token!==audPlayToken)return;
    if(state.audio.curTrack!==audFindTrack()?.id && audFindTrack()){
      // αποφυγή κατάστασης όπου το track άλλαξε κατά τη恢复
    }
    if(t>0 && audHasDuration() && t<AUD_EL.duration){
      try{AUD_EL.currentTime=t;}catch(e){}
    }
    if(wasPlaying){
      AUD_EL.play().then(function(){
        if(token===audPlayToken){
          state.audio.playing=true;
          saveState();
          audInject();
          audClearStall();
          audRecoverAttempts=0;
          if(typeof audSetPlayback==='function')audSetPlayback('playing');
        }
      }).catch(function(){
        if(token===audPlayToken){
          state.audio.playing=false;
          saveState();
          audInject();
          if(typeof audSetPlayback==='function')audSetPlayback('paused');
          var tr=audFindTrack();
          if(tr && tr.kind==='local')audOfferRelink(state.audio.curCat,tr.id);
        }
      });
      audArmStall(token);
    }
  }

  if(AUD_EL.readyState>=3)restore();
  else AUD_EL.addEventListener('canplay',restore,{once:true});
}

function audDoSeek(sec){
  if(!audHasDuration())return;
  sec=Math.max(0,Math.min(AUD_EL.duration-0.02,Number(sec)||0));

  if(audIsSeeking){
    audSeekPending=sec;
    audSetSeekLabel(sec);
    return;
  }

  audIsSeeking=true;
  var token=++audPlayToken;
  audSetSeekLabel(sec);

  try{AUD_EL.currentTime=sec;}catch(e){audIsSeeking=false;}

  function onSeeked(){
    audIsSeeking=false;

    if(audSeekPending!=null){
      var p=audSeekPending;
      audSeekPending=null;
      audDoSeek(p);
      return;
    }

    if(state.audio.playing){
      AUD_EL.play().then(function(){
        if(token===audPlayToken){
          audClearStall();
          audRecoverAttempts=0;
          if(typeof audSetPlayback==='function')audSetPlayback('playing');
        }
      }).catch(function(e){
        if(token!==audPlayToken)return;
        if(e && e.name==='AbortError'){
          setTimeout(function(){
            if(state.audio.playing){
              AUD_EL.play().then(function(){
                audClearStall();
                audRecoverAttempts=0;
                if(typeof audSetPlayback==='function')audSetPlayback('playing');
              }).catch(function(){
                audRecover();
              });
            }
          },120);
        }else{
          audRecover();
        }
      });
      audArmStall(token);
    }else{
      audClearStall();
      if(typeof audSetPlayback==='function')audSetPlayback('paused');
    }
  }

  if(AUD_EL.seeking){
    AUD_EL.addEventListener('seeked',onSeeked,{once:true});
  }else{
    setTimeout(onSeeked,0);
  }
}

function audSeekSeconds(sec){
  if(!audHasDuration()){
    var tr=audFindTrack();
    if(tr){
      state.audio.playing=true;
      saveState();
      audPlayTrack(state.audio.curCat,tr,true);
    }
    return;
  }
  audDoSeek(sec);
}

function audDragSeek(pct){
  audDragging=true;
  var sec=audPctToSec(pct);
  audSetSeekLabel(sec);
  var el=document.getElementById('audSeek');
  if(el)el.value=pct;
}

function audReleaseSeek(pct){
  audDragging=false;
  var sec=audPctToSec(pct);
  if(audHasDuration())audDoSeek(sec);
  else audSeekSeconds(sec);
}

function audStartUrl(url,tr,catId,prevTime){
  var a=state.audio;
  AUD_EL.src=url;
  AUD_EL.volume=a.volume;
  AUD_EL.loop=a.loop;

  var started=false;
  function start(){
    if(started)return;
    started=true;

    if(state.audio.curTrack!==tr.id || state.audio.curCat!==catId)return;

    if(prevTime>0 && audHasDuration() && prevTime<AUD_EL.duration){
      try{AUD_EL.currentTime=prevTime;}catch(e){}
    }

    if(!state.audio.playing){
      saveState();
      audInject();
      return;
    }

    var token=++audPlayToken;
    AUD_EL.play().then(function(){
      if(token===audPlayToken){
        state.audio.playing=true;
        saveState();
        audInject();
        audClearStall();
        audRecoverAttempts=0;
        if(typeof audSetPlayback==='function')audSetPlayback('playing');
      }
    }).catch(function(e){
      if(token!==audPlayToken)return;
      if(e && e.name==='AbortError'){
        setTimeout(function(){
          if(state.audio.playing){
            AUD_EL.play().then(function(){
              audClearStall();
              audRecoverAttempts=0;
              if(typeof audSetPlayback==='function')audSetPlayback('playing');
            }).catch(function(){
              audRecover();
            });
          }
        },120);
      }else{
        state.audio.playing=false;
        saveState();
        audInject();
        if(typeof audSetPlayback==='function')audSetPlayback('paused');
        if(tr && tr.kind==='local')audOfferRelink(catId,tr.id);
        else audRecover();
      }
    });
    audArmStall(token);
  }

  if(AUD_EL.readyState>=3)start();
  else AUD_EL.addEventListener('canplay',start,{once:true});

  saveState();
  audInject();
  audSetMedia(tr,catId);
}

function audOfferRelink(catId,trId){
  var c=state.audio.categories.find(function(x){return x.id===catId;});
  if(!c)return;
  var t=c.tracks.find(function(x){return x.id===trId;});
  if(!t)return;
  if(confirm('Το τοπικό αρχείο "'+t.name+'" δεν βρέθηκε στη συσκευή. Επανασύνδεση;')){
    audRelinkPrompt(catId,trId);
  }
}
function audRelinkPrompt(catId,trId){
  if(!AUD_RELINK_INPUT){
    AUD_RELINK_INPUT=document.createElement('input');
    AUD_RELINK_INPUT.type='file';
    AUD_RELINK_INPUT.accept='audio/*';
    AUD_RELINK_INPUT.style.display='none';
    document.body.appendChild(AUD_RELINK_INPUT);
    AUD_RELINK_INPUT.onchange=function(){
      var file=AUD_RELINK_INPUT.files && AUD_RELINK_INPUT.files[0];
      var cId=AUD_RELINK_INPUT.dataset.cat;
      var tId=AUD_RELINK_INPUT.dataset.track;
      AUD_RELINK_INPUT.value='';
      if(!file||!cId||!tId)return;

      var c=state.audio.categories.find(function(x){return x.id===cId;});
      if(!c)return;
      var t=c.tracks.find(function(x){return x.id===tId;});
      if(!t)return;
      if(!t.key){
        showToast('Το αρχείο δεν έχει έγκυρο κλειδί αποθήκευσης. Διαγραφή και επαναπροσθήκη είναι αναγκαία.');
        return;
      }

      audPut(t.key,file).then(function(){
        showToast('Επανασυνδέθηκε: '+t.name);
        audRequestPersist();
        if(state.audio.curTrack===t.id){
          if(state.audio.playing){
            audPlayTrack(cId,t,true);
          }else{
            audInject();
          }
        }
        if(typeof modalOpen!=='undefined' && modalOpen){
          audReopen(function(){openCategorySheet(cId);});
        }
      }).catch(function(){
        showToast('Αποτυχία επανασύνδεσης του αρχείου. Ίσως ο χώρος αποθήκευσης είναι πλήρης.');
      });
    };
  }
  AUD_RELINK_INPUT.dataset.cat=catId;
  AUD_RELINK_INPUT.dataset.track=trId;
  AUD_RELINK_INPUT.click();
}

var _apM7=audPlayTrack;
audPlayTrack=function(catId,tr,preserveTime){
  if(!tr){
    _apM7(catId,tr);
    return;
  }

  var a=state.audio;
  if(a.volume<=0)a.volume=0.7;
  a.curCat=catId;
  a.curTrack=tr.id;
  a.playing=true;

  try{AUD_EL.pause();}catch(e){}

  var prevTime=preserveTime?(AUD_EL.currentTime||0):0;
  audRevokeCurrentObjectURL();
  audRequestPersist();

  if(tr.kind==='local'){
    if(!tr.key){
      a.playing=false;
      saveState();
      audInject();
      showToast('Το τοπικό αρχείο δεν έχει έγκυρο κλειδί αποθήκευσης.');
      return;
    }
    audGet(tr.key).then(function(b){
      if(state.audio.curTrack!==tr.id || state.audio.curCat!==catId)return;
      if(!b){
        a.playing=false;
        saveState();
        audInject();
        audOfferRelink(catId,tr.id);
        return;
      }
      var u;
      try{u=URL.createObjectURL(b);}catch(e){
        a.playing=false;
        saveState();
        audInject();
        audOfferRelink(catId,tr.id);
        return;
      }
      audCurrentObjectURL=u;
      audStartUrl(u,tr,catId,prevTime);
    }).catch(function(){
      if(state.audio.curTrack!==tr.id || state.audio.curCat!==catId)return;
      a.playing=false;
      saveState();
      audInject();
      audOfferRelink(catId,tr.id);
    });
    return;
  }

  if(tr.kind==='noise'){
    if(!AUD_WAV[tr.id]){
      AUD_WAV[tr.id]=URL.createObjectURL(makeNoiseWav(tr.id));
    }
    audStartUrl(AUD_WAV[tr.id],tr,catId,prevTime);
    return;
  }

  audStartUrl(tr.url,tr,catId,prevTime);
};

var _atM5=audToggle;
audToggle=function(){
  var a=state.audio;

  if(!a.playing){
    var t=audFindTrack();
    if(!t){
      if(a.categories.length && a.categories[0].tracks.length){
        t=a.categories[0].tracks[0];
        a.curCat=a.categories[0].id;
      }else{
        openAudioSheet();
        return;
      }
    }

    a.playing=true;
    saveState();

    if(AUD_EL.error || !AUD_EL.currentSrc || AUD_EL.readyState<2){
      audPlayTrack(a.curCat,t,true);
    }else{
      var token=++audPlayToken;
      AUD_EL.play().then(function(){
        if(token===audPlayToken){
          audClearStall();
          audRecoverAttempts=0;
          if(typeof audSetPlayback==='function')audSetPlayback('playing');
        }
      }).catch(function(e){
        if(token!==audPlayToken)return;
        if(e && e.name==='AbortError'){
          setTimeout(function(){
            if(state.audio.playing){
              AUD_EL.play().then(function(){
                audClearStall();
                audRecoverAttempts=0;
                if(typeof audSetPlayback==='function')audSetPlayback('playing');
              }).catch(function(){
                audRecover();
              });
            }
          },120);
        }else{
          audRecover();
        }
      });
      audArmStall(token);
    }
  }else{
    a.playing=false;
    audClearStall();
    try{AUD_EL.pause();}catch(e){}
    saveState();
    if(typeof audSetPlayback==='function')audSetPlayback('paused');
  }

  audInject();
};

audSetMedia=function(tr,catId){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:tr.name,
      artist:audCatName(catId),
      album:'Ρυθμός'
    });
    navigator.mediaSession.playbackState=state.audio.playing?'playing':'paused';

    navigator.mediaSession.setActionHandler('play',function(){
      if(!state.audio.playing)audToggle();
    });
    navigator.mediaSession.setActionHandler('pause',function(){
      if(state.audio.playing)audToggle();
    });
    navigator.mediaSession.setActionHandler('previoustrack',function(){
      audPrev();
    });
    navigator.mediaSession.setActionHandler('nexttrack',function(){
      audNext();
    });
    navigator.mediaSession.setActionHandler('seekto',function(d){
      if(d && d.seekTime!=null){
        state.audio.playing=true;
        saveState();
        audSeekSeconds(d.seekTime);
        audInject();
        if(typeof audSetPlayback==='function')audSetPlayback('playing');
      }
    });
    navigator.mediaSession.setActionHandler('seekbackward',function(d){
      var o=(d && d.seekOffset)||10;
      state.audio.playing=true;
      saveState();
      audSeekSeconds((AUD_EL.currentTime||0)-o);
      audInject();
      if(typeof audSetPlayback==='function')audSetPlayback('playing');
    });
    navigator.mediaSession.setActionHandler('seekforward',function(d){
      var o=(d && d.seekOffset)||10;
      state.audio.playing=true;
      saveState();
      audSeekSeconds((AUD_EL.currentTime||0)+o);
      audInject();
      if(typeof audSetPlayback==='function')audSetPlayback('playing');
    });
  }catch(e){}
};

var _asa5=audStopAll;
audStopAll=function(){
  audRevokeCurrentObjectURL();
  audIsSeeking=false;
  audSeekPending=null;
  audPlayToken++;
  audClearStall();
  _asa5();
  if(typeof audSetPlayback==='function')audSetPlayback('paused');
};

if(!window.__audV4Bound){
  window.__audV4Bound=true;
  AUD_EL.addEventListener('playing',function(){
    audClearStall();
    audRecoverAttempts=0;
    if(typeof audSetPlayback==='function')audSetPlayback('playing');
  });
  AUD_EL.addEventListener('pause',function(){
    if(!audIsSeeking && typeof audSetPlayback==='function'){
      audSetPlayback(state.audio.playing?'playing':'paused');
    }
  });
  AUD_EL.addEventListener('error',function(){

      audRecover();
    }
  });
  AUD_EL.addEventListener('stalled',function(){

if(!window.__audV4Ticker){

var _oaS6=openAudioSheet;
openAudioSheet=function(){

  var oldSeek=document.getElementById('audSeek');

    d.innerHTML='<input type="range" id="audSeek" min="0" max="100" step="0.1" value="0" oninput="audDragSeek(this.value)" onchange="audReleaseSeek(this.value)" style="width:100%">'
      +'<div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)">'
      +'<span id="audCur">0:00</span><span id="audDur">0:00</span>'

};

saveState();

</script>

<script>
/* ===== ΕΙΔΟΠΟΙΗΣΕΙΣ v1: TOAST + ΚΕΝΤΡΟ ===== */
state.notifs=state.notifs||[];

function notifTrim(){
  if(state.notifs.length>50)state.notifs=state.notifs.slice(0,50);
}
function notifUnread(){
  var n=0;
  for(var i=0;i<state.notifs.length;i++)if(!state.notifs[i].read)n++;
  return n;
}
function notifTimeAgo(ts){
  var d=Date.now()-ts;
  if(d<60000)return 'τώρα';
  if(d<3600000)return Math.floor(d/60000)+'λ';
  if(d<86400000)return Math.floor(d/3600000)+'ω';
  if(d<172800000)return 'χθες';
  var dt=new Date(ts);
  return dt.getDate()+'/'+(dt.getMonth()+1);
}
function notifBadgeUpdate(){
  var row=document.querySelector('header .header-row');
  if(!row)return;
  var badge=row.querySelector('#notifBadge');
  if(!badge){
    badge=document.createElement('button');
    badge.id='notifBadge';
    badge.className='gear-btn';
    badge.style.position='relative';
    badge.setAttribute('aria-label','Ειδοποιήσεις');
    badge.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="notifCount" style="position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#ef4444;color:#fff;font:700 .62rem system-ui,sans-serif;display:none;place-items:center"></span>';
    badge.onclick=openNotifCenter;
    var gear=row.querySelector('.gear-btn');

  }
  var cnt=badge.querySelector('#notifCount');
  var n=notifUnread();
  if(cnt){
    if(n>0){cnt.style.display='grid';cnt.textContent=n>99?'99+':String(n);}
    else cnt.style.display='none';
  }
}
function notifToast(cfg){
  var t=document.getElementById('notifToast');
  if(!t){
    t=document.createElement('div');
    t.id='notifToast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--toast-bg);color:var(--toast-text);padding:12px 18px;border-radius:20px;font-size:.86rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:201;max-width:90%;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.25)';
    document.body.appendChild(t);

  t.innerHTML='<div style="font-size:.78rem;opacity:.8;margin-bottom:3px">'+esc(cfg.title||'Ειδοποίηση')+'</div><div>'+esc(cfg.message||'')+'</div>';
  t.style.opacity='1';
  t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(notifToast._tm);
  notifToast._tm=setTimeout(function(){
    t.style.opacity='0';
    t.style.transform='translateX(-50%) translateY(20px)';
  },4000);
}
function notifPush(cfg){
  var item={id:'n'+Date.now()+'_'+Math.floor(Math.random()*100000),title:cfg.title||'',message:cfg.message||'',ts:Date.now(),read:false};
  state.notifs.unshift(item);
  notifTrim();
  saveState();
  notifToast(cfg);
  notifBadgeUpdate();
  try{notify(cfg.title,cfg.message);}catch(e){}
}
function openNotifCenter(){
  var list=state.notifs;
  var body;
  if(!list.length){
    body='<p class="muted">Καμία ειδοποίηση.</p>';
  }else{
    body='<div class="stack" style="margin-top:6px">'+list.map(function(n){
      return '<div class="list-row" style="'+(n.read?'opacity:.6':'')+'">'
        +'<div class="list-left"><strong>'+esc(n.title)+'</strong><span class="muted" style="font-size:.74rem">'+esc(n.message)+' · '+notifTimeAgo(n.ts)+'</span></div>'
        +'<button class="btn btn-ghost-danger" onclick="notifDel(\''+n.id+'\')">✕</button>'
        +'</div>';
    }).join('')+'</div>';
  }
  var buttons=[{text:'Κλείσιμο'}];
  var hasUnread=false;
  for(var i=0;i<list.length;i++)if(!list[i].read){hasUnread=true;break;}
  if(hasUnread){
    buttons.unshift({text:'Σήμανε όλα ως διαβασμένα',class:'btn-ghost',close:false,onClick:function(){notifMarkAllRead();return false;}});
  }
  openModal({title:'Ειδοποιήσεις ('+list.length+')',body:body,buttons:buttons});

function notifMarkAllRead(){

  saveState();
  notifBadgeUpdate();

function notifDel(id){

  notifBadgeUpdate();

  setTimeout(openNotifCenter,240);

if(!window.__notifV1Mounted){

saveState();
/* ===== ΤΕΛΟΣ ΕΙΔΟΠΟΙΗΣΕΩΝ v1 ===== */
</script>

<script>
/* ===== UNDO v1 ===== */
var undoStack=null;
function undoShow(msg){
  var t=document.getElementById('undoToast');
  if(!t){
    t=document.createElement('div');
    t.id='undoToast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--toast-bg);color:var(--toast-text);padding:10px 14px;border-radius:16px;font-size:.84rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:202;display:flex;align-items:center;gap:12px;max-width:92%;box-shadow:0 12px 30px rgba(0,0,0,.25)';
    document.body.appendChild(t);
  }
  t.innerHTML='<span style="pointer-events:none">'+esc(msg)+'</span><button class="btn btn-ghost" style="pointer-events:auto;flex:0 0 auto;padding:6px 12px" onclick="undoPerform()">Αναίρεση</button>';
  t.style.opacity='1';
  t.style.pointerEvents='auto';
  t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(undoShow._tm);
  undoShow._tm=setTimeout(function(){
    undoStack=null;
    t.style.opacity='0';
    t.style.pointerEvents='none';
    t.style.transform='translateX(-50%) translateY(20px)';
  },5000);
}
function undoPerform(){
  var u=undoStack;
  if(!u)return;
  undoStack=null;
  if(u.kind==='log'){
    state.logs.splice(Math.min(u.index,state.logs.length),0,u.log);
    }else if(u.kind==='fixed'){
    FIXED_DEFS.splice(Math.min(u.index,FIXED_DEFS.length),0,u.def);
    state.logs=state.logs.concat(u.logs);
    state.logs.sort(function(a,b){return a.start-b.start;});
    if(u.slots&&u.slots.length){
      if(!state.schedule)state.schedule={slots:[],status:{}};
      if(!state.schedule.slots)state.schedule.slots=[];
      state.schedule.slots=state.schedule.slots.concat(u.slots);
    }
  }
  saveState();
  render();
  var t=document.getElementById('undoToast');
  if(t){
    t.style.opacity='0';
    t.style.pointerEvents='none';
    t.style.transform='translateX(-50%) translateY(20px)';
    clearTimeout(undoShow._tm);
  }
  showToast('Ανααιρέθηκε.');
}
/* ===== ΤΕΛΟΣ UNDO v1 ===== */
</script>

<script>
/* ===== PAUSE v1 ===== */
function togglePause(){
  if(!state.active)return;
  if(state.healthBreak){healthBreakEnd();return;}
  const a=state.active;
  if(a.pausedAt){
    const pausedMs=Date.now()-a.pausedAt;
    a.start+=pausedMs;
    const resetMin=clamp(parseInt((state.health&&state.health.pauseResetMin)||3,10),1,60);
    if(pausedMs>=resetMin*60000){
      a.healthStart=Date.now();
      if(typeof healthResync==='function')healthResync();
    }
    a.pausedAt=null;
    showToast('Συνέχισε.');
  }else{
    a.pausedAt=Date.now();
    showToast('Παύση.');
  }
  saveState();
  render();
}

</script>

<script>
/* ===== ΥΓΕΙΑ v3: ΕΙΔΟΠΟΙΗΣΗ ΜΕ ΕΠΙΛΟΓΗ + ΔΙΑΛΕΙΜΜΑ ΧΩΡΙΣ ΚΛΕΙΔΩΜΑ ===== */
var EYE_MIN=30;
var STAND_MIN=60;
var EYE_BREAK_MIN=3;
var STAND_BREAK_MIN=5;
var HEALTH_NONE=999999;

state.health=state.health||{};
state.healthBreak=state.healthBreak||null;

function healthEnsure(){
  var h=state.health;
  h.eyeEnabled=!!h.eyeEnabled;
  h.standEnabled=!!h.standEnabled;
  if(typeof h.nextEye!=='number'||h.nextEye<=0)h.nextEye=HEALTH_NONE;
  if(typeof h.nextStand!=='number'||h.nextStand<=0)h.nextStand=HEALTH_NONE;
}

function healthApplies(){
  if(!state.active)return false;
  if(state.active.type==='course')return true;
  var d=FIXED_DEFS.find(function(x){return x.id===state.active.id;});
  return !!(d&&(d.id==='reading'||d.id==='school'));
}

function healthResetThresholds(){
  healthEnsure();
  var h=state.health;
  h.nextEye=h.eyeEnabled?EYE_MIN:HEALTH_NONE;
  h.nextStand=h.standEnabled?STAND_MIN:HEALTH_NONE;
}

function healthClear(){
  healthEnsure();
  state.health.nextEye=HEALTH_NONE;
  state.health.nextStand=HEALTH_NONE;
  state.healthBreak=null;
  var bar=document.getElementById('healthBreakBar');
  if(bar)bar.classList.remove('on');
}

function healthElapsedMin(){
  if(!state.active)return 0;
  var a=state.active;
  var base=a.healthStart||a.start;
  var ref=a.pausedAt||Date.now();
  return Math.max(0,Math.floor((ref-base)/60000));
}

function healthResync(){
  healthEnsure();
  var h=state.health;
  var e=healthElapsedMin();
  h.nextEye=h.eyeEnabled?(Math.floor(e/EYE_MIN)+1)*EYE_MIN:HEALTH_NONE;
  h.nextStand=h.standEnabled?(Math.floor(e/STAND_MIN)+1)*STAND_MIN:HEALTH_NONE;
}

function healthOffer(kind){
  var title=kind==='eye'?'Ξεκούραση ματιών':'Ώρα να σηκωθείς';
  var message=kind==='eye'
    ?'30′ συνεχούς εργασίας. Κοίτα 6 μέτρα μακριά για '+EYE_BREAK_MIN+' λεπτά.'
    :'60′ συνεχούς εργασίας. Σηκώσου, τεντώσου και περπάτα για '+STAND_BREAK_MIN+' λεπτά.';
  if(typeof notifTrim==='function'){
    state.notifs.unshift({id:'n'+Date.now()+'_'+Math.floor(Math.random()*100000),title:title,message:message,ts:Date.now(),read:false});
    notifTrim();saveState();
    if(typeof notifBadgeUpdate==='function')notifBadgeUpdate();
  }
  pushAlert({
    title:title,message:message,sticky:true,
    buttons:[
      {text:'Αποδοχή — διάλειμμα',class:'btn-success',onClick:function(){healthBreakStart(kind);}},
      {text:'Απόρριψη — συνέχεια',class:'btn-ghost',onClick:function(){showToast('Συνέχεια εργασίας.');}}
    ]
  });
}

function healthBreakStart(kind){
  if(!state.active){showToast('Δεν τρέχει συνεδρία.');return;}
  var now=Date.now();
  var pomo=false;
  try{var p=P();if(p.phase&&p.phaseEndsAt>now)pomo=true;}catch(e){}
  state.healthBreak={kind:kind,start:now,durMin:kind==='eye'?EYE_BREAK_MIN:STAND_BREAK_MIN,pomo:pomo};
  if(!state.active.pausedAt)state.active.pausedAt=now;
  saveState();render();healthBreakFrame();
}

function healthBreakEnd(){
  var hb=state.healthBreak;
  if(!hb)return;
  var now=Date.now();
  var dur=now-hb.start;
  state.healthBreak=null;
  if(state.active){
    if(state.active.pausedAt){
      state.active.start+=dur;
      state.active.pausedAt=null;
    }
    if(hb.kind==='stand'){
      state.active.healthStart=now;
      healthResetThresholds();
    }else{
      state.active.healthStart=(state.active.healthStart||state.active.start)+dur;
      healthResync();
    }
  }
  try{var p=P();if(hb.pomo&&p.phase&&p.phaseEndsAt)p.phaseEndsAt+=dur;}catch(e){}
  saveState();render();healthBreakFrame();
  showToast('Τέλος διαλείμματος. Συνέχεια.');
}

function healthBreakFrame(){
  var hb=state.healthBreak;
  var bar=document.getElementById('healthBreakBar');
  if(hb&&!state.active){healthClear();return;}
  if(!hb){if(bar)bar.classList.remove('on');return;}
  var total=hb.durMin*60000;
  var left=Math.max(0,hb.start+total-Date.now());
  if(left<=0){healthBreakEnd();return;}
  if(!bar){
    bar=document.createElement('div');
    bar.id='healthBreakBar';
    document.body.appendChild(bar);
  }
  if(bar.dataset.kind!==hb.kind||!bar.querySelector('.hb-time')){
    bar.dataset.kind=hb.kind;
    var title=hb.kind==='eye'?'Διάλειμμα ματιών':'Διάλειμμα — σήκω';
    var sub=hb.kind==='eye'?'Κοίτα 6 μέτρα μακριά. Ξεκούρασε τα μάτια.':'Σηκώσου, τεντώσου, περπάτα λίγο.';
    bar.innerHTML='<div class="hb-row"><div><div class="hb-title">'+title+'</div><div class="hb-sub">'+sub+'</div></div><div class="hb-time">0:00</div></div>'
      +'<div class="hb-track"><div class="hb-fill"></div></div>'
      +'<button class="btn btn-success" style="width:100%" onclick="healthBreakEnd()">Τέλος διαλείμματος — συνέχεια</button>';
  }
  var sec=Math.ceil(left/1000);
  var mm=Math.floor(sec/60),ss=sec%60;
  var tEl=bar.querySelector('.hb-time');
  if(tEl)tEl.textContent=mm+':'+(ss<10?'0':'')+ss;
  var fEl=bar.querySelector('.hb-fill');
  if(fEl)fEl.style.width=Math.round((1-left/total)*100)+'%';
  bar.classList.add('on');
}

function healthTick(){
  healthEnsure();
  var h=state.health;
  if(state.healthBreak)return;
  if(!state.active||!healthApplies()){
    if(h.nextEye!==HEALTH_NONE||h.nextStand!==HEALTH_NONE){h.nextEye=HEALTH_NONE;h.nextStand=HEALTH_NONE;}
    return;
  }
  if(state.active.pausedAt)return;
  var e=healthElapsedMin();
  if(e<=0)return;
  if(!h.eyeEnabled)h.nextEye=HEALTH_NONE;
  if(!h.standEnabled)h.nextStand=HEALTH_NONE;
  if(h.eyeEnabled&&h.nextEye===HEALTH_NONE)h.nextEye=(Math.floor(e/EYE_MIN)+1)*EYE_MIN;
  if(h.standEnabled&&h.nextStand===HEALTH_NONE)h.nextStand=(Math.floor(e/STAND_MIN)+1)*STAND_MIN;
  var loops=0;
  while(loops<4){
    loops++;
    var dueStand=h.standEnabled&&e>=h.nextStand;
    var dueEye=h.eyeEnabled&&e>=h.nextEye;
    if(!dueStand&&!dueEye)break;
    if(dueStand){
      var fs=h.nextStand;
      h.nextStand=fs+STAND_MIN;
      if(h.eyeEnabled&&h.nextEye<=fs)h.nextEye=fs+EYE_MIN;
      healthOffer('stand');
      return;
    }
    if(dueEye){
      var fe=h.nextEye;
      h.nextEye=fe+EYE_MIN;
      healthOffer('eye');
      return;
    }
  }
  if(loops>=4)healthResync();
}

function healthToggle(key,chk){
  healthEnsure();
  state.health[key]=!!chk.checked;
  if(state.active)healthResync();else healthResetThresholds();
  saveState();
}

/* ---- dropdown στο γρανάζι ---- */
function gpGetGear(){
  var btns=document.querySelectorAll('.gear-btn');
  for(var i=0;i<btns.length;i++){if(btns[i].id!=='notifBadge')return btns[i];}
  return null;
}
function gpToggleSection(bodyId){
  var body=document.getElementById(bodyId);
  if(!body)return;
  var sec=body.closest('.gp-section');
  if(sec)sec.classList.toggle('open');
}
function gpSetTheme(t){state.settings.theme=t;saveState();if(typeof applyUi==='function')applyUi();render();gpSyncThemeUI();}
function gpSetScale(s){state.settings.uiScale=s;saveState();if(typeof applyUi==='function')applyUi();render();gpSyncThemeUI();}
function gpSyncThemeUI(){
  var th=state.settings.theme||'light';
  var sc=state.settings.uiScale||'normal';
  document.querySelectorAll('[data-gp-theme]').forEach(function(b){b.classList.toggle('on',b.dataset.gpTheme===th);});
  document.querySelectorAll('[data-gp-scale]').forEach(function(b){b.classList.toggle('on',b.dataset.gpScale===sc);});
}
function gpPosition(panel,gear){
  var r=gear.getBoundingClientRect();
  var pw=panel.offsetWidth||320;
  var left=Math.max(12,Math.min(window.innerWidth-pw-12,r.right-pw));
  panel.style.left=left+'px';
  panel.style.top=(r.bottom+8)+'px';
}
function gpClose(){
  var p=document.getElementById('gearPanel');
  if(p)p.classList.remove('open');
}
function gpTogglePanel(){
  var gear=gpGetGear();
  if(!gear)return;
  var panel=document.getElementById('gearPanel');
  if(!panel){gpBuildPanel();panel=document.getElementById('gearPanel');}
  if(panel.classList.contains('open')){gpClose();return;}
  gpSyncThemeUI();
  gpPosition(panel,gear);
  panel.classList.add('open');
}
function gpBuildPanel(){
  if(document.getElementById('gearPanel'))return;
  var h=state.health||{};
  var panel=document.createElement('div');
  panel.id='gearPanel';
  panel.className='gear-panel';
  panel.innerHTML=''
    +'<div class="gp-section" id="gpThemes">'
      +'<button type="button" class="gp-head" onclick="gpToggleSection(\'gpThemesBody\')">'
        +'<span>Εμφάνιση</span><span class="gp-arrow">▾</span>'
      +'</button>'
      +'<div class="gp-body" id="gpThemesBody">'
        +'<div class="gp-label">Μέγεθος</div>'
        +'<div class="gp-grid">'
          +'<button type="button" class="gp-choice" data-gp-scale="normal" onclick="gpSetScale(\'normal\')"><strong>Κανονικό</strong><small>Προεπιλεγμένο</small></button>'
          +'<button type="button" class="gp-choice" data-gp-scale="small" onclick="gpSetScale(\'small\')"><strong>Μικρό</strong><small>Συμπαγές</small></button>'
        +'</div>'
        +'<div class="gp-label">Θέμα</div>'
        +'<div class="gp-grid">'
          +'<button type="button" class="gp-choice" data-gp-theme="light" onclick="gpSetTheme(\'light\')"><strong>Φωτεινό</strong><small>Ανοιχτό</small></button>'
          +'<button type="button" class="gp-choice" data-gp-theme="blue" onclick="gpSetTheme(\'blue\')"><strong>Νυχτερινό</strong><small>Μπλε</small></button>'
          +'<button type="button" class="gp-choice" data-gp-theme="dark" onclick="gpSetTheme(\'dark\')"><strong>Σκοτεινό</strong><small>Γκρι</small></button>'
        +'</div>'
      +'</div>'
    +'</div>'
    +'<div class="gp-section" id="gpHealth">'
      +'<button type="button" class="gp-head" onclick="gpToggleSection(\'gpHealthBody\')">'
        +'<span>Ευεξία</span><span class="gp-arrow">▾</span>'
      +'</button>'
      +'<div class="gp-body" id="gpHealthBody">'
        +'<label class="gp-check"><input type="checkbox" id="gpEyeChk"'+(h.eyeEnabled?' checked':'')+' onchange="healthToggle(\'eyeEnabled\',this)">'
          +'<span><strong>Ξεκούραση ματιών</strong><small>Ειδοποίηση κάθε 30′ — διάλειμμα '+EYE_BREAK_MIN+'′ μόνο με αποδοχή</small></span></label>'
        +'<label class="gp-check"><input type="checkbox" id="gpStandChk"'+(h.standEnabled?' checked':'')+' onchange="healthToggle(\'standEnabled\',this)">'
          +'<span><strong>Σήκωμα</strong><small>Ειδοποίηση κάθε 60′ — διάλειμμα '+STAND_BREAK_MIN+'′ μόνο με αποδοχή</small></span></label>'
        +'<p class="gp-note">Καμία αυτόματη παύση. Στα 60′ έρχεται μόνο σήκωμα, όχι και μάτια. Το διάλειμμα τερματίζεται όποτε θες και δεν τρώει χρόνο pomodoro. Ισχύει για μαθήματα, Σχολή και Διάβασμα.</p>'
      +'</div>'
    +'</div>';
  document.body.appendChild(panel);

  var gear=gpGetGear();
  if(gear){gear.onclick=function(ev){ev.stopPropagation();gpTogglePanel();};}

  document.addEventListener('click',function(ev){
    var p=document.getElementById('gearPanel');
    if(!p||!p.classList.contains('open'))return;
    if(p.contains(ev.target))return;
    var g=gpGetGear();
    if(g&&g.contains(ev.target))return;
    gpClose();
  });
  window.addEventListener('resize',gpClose);
  window.addEventListener('scroll',gpClose,true);
}

if(!window.__healthV3Mounted){
  window.__healthV3Mounted=true;
  var hst=document.createElement('style');
  hst.textContent='#healthBreakBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:402px;z-index:170;background:var(--card);border:1px solid var(--card-border);border-radius:22px;box-shadow:0 18px 42px rgba(23,30,61,.34);padding:14px;display:none}'
    +'#healthBreakBar.on{display:block;animation:fadeUp .3s both}'
    +'.hb-row{display:flex;align-items:center;justify-content:space-between;gap:10px}'
    +'.hb-title{font-weight:700;font-size:.95rem}'
    +'.hb-sub{color:var(--muted);font-size:.76rem;margin-top:3px;line-height:1.35}'
    +'.hb-time{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--primary)}'
    +'.hb-track{height:6px;border-radius:999px;background:var(--track);overflow:hidden;margin:10px 0}'
    +'.hb-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--success));width:0;transition:width 1s linear}';
  document.head.appendChild(hst);
  healthEnsure();
  if(state.healthBreak&&!state.active)state.healthBreak=null;
  if(state.active)healthResync();else healthResetThresholds();
  setInterval(healthTick,15000);
  setInterval(function(){if(state.healthBreak)healthBreakFrame();},1000);
  if(document.readyState!=='loading')gpBuildPanel();
  else document.addEventListener('DOMContentLoaded',gpBuildPanel);
}
saveState();
/* ===== ΤΕΛΟΣ ΥΓΕΙΑΣ v3 ===== */
</script>

<script>
/* ===== ΚΑΤΗΓΟΡΙΕΣ v2: ΔΡΑΣΤΗΡΙΟΤΗΤΕΣ ΤΟΥ ΧΡΗΣΤΗ + ΔΙΟΡΘΩΣΕΙΣ ΠΥΡΗΝΑ ===== */
var ACT_CATS=[
{id:'mind',name:'Μυαλό',color:'#6366f1',color2:'#8b5cf6'},
{id:'body',name:'Σώμα',color:'#10b981',color2:'#059669'},
{id:'recover',name:'Επαναφορά',color:'#f472b6',color2:'#ec4899'},
{id:'organize',name:'Οργάνωση',color:'#f59e0b',color2:'#d97706'},
{id:'social',name:'Επαφή',color:'#0ea5e9',color2:'#0284c7'}
];
function catById(id){return ACT_CATS.find(function(c){return c.id===id;})||ACT_CATS[3];}
function catGuess(name){var n=String(name||'').toLowerCase();if(/γυμν|τρεξ|περπ|βολτ|ποδηλ|διατασ|αθλ|χορ/.test(n))return 'body';if(/διαβ|μελετ|μαθη|σχολ|φυσικ|κβαντ|μηχαν|υπολογ|προγραμμ|γλωσσ|ασκησ|ερευν/.test(n))return 'mind';if(/χαλαρ|μουσ|ταιν|σειρ|διαλογ|μπανι|σιωπ|ξαναπ|υπν/.test(n))return 'recover';if(/τηλεφ|φιλο|οικογ|συναντ|ομαδ|μηνυμ|κλήσ|επαφ/.test(n))return 'social';return 'organize';}
(function(){
FIXED_DEFS.forEach(function(d){
if(!d.categoryId)d.categoryId=catGuess(d.name);
if(typeof d.healthAware!=='boolean')d.healthAware=(d.categoryId==='mind');
if(typeof d.restorative!=='boolean')d.restorative=(d.id==='relax');
if(!Array.isArray(d.milestones))d.milestones=(d.id==='walk')?[30,60,-10]:(d.id==='reading')?[20,25]:null;
});
saveState();
})();

function healthApplies(){
if(!state.active)return false;
if(state.active.type==='course')return true;
var d=FIXED_DEFS.find(function(x){return x.id===state.active.id;});
return !!(d&&d.healthAware);
}

function getQuickActions(){
var last={};
state.logs.forEach(function(l){if(l.type==='fixed'&&(!last[l.id]||l.end>last[l.id]))last[l.id]=l.end;});
var ids=FIXED_DEFS.slice().sort(function(a,b){return (last[b.id]||0)-(last[a.id]||0);}).slice(0,4).map(function(d){return d.id;});
return ids.map(function(id){
var def=FIXED_DEFS.find(function(d){return d.id===id;});if(!def)return null;
var info=fixedInfo(id);
var isActive=state.active&&state.active.type==='fixed'&&state.active.id===id;
var otherActive=state.active&&!isActive;
return {def:def,info:info,isActive:isActive,otherActive:otherActive,canStart:!otherActive&&(!info.def.hard||info.dayMin<info.hardLimit-0.05)};
}).filter(Boolean);
}


function buildFixedAlerts(def,info){
var alerts=[];var d=info.dailyCap;
var ap=(state.settings.alertPct||80)/100;var apTitle=Math.round(ap*100)+'%';
if(Array.isArray(def.milestones)&&def.milestones.length){
def.milestones.forEach(function(m,i){
var min=m<0?Math.max(0,d+m):m;
alerts.push({key:'ms'+i,scope:'day',min:min,cap:d,title:m<0?(-m)+'λ πριν':(m+'λ')});
});
alerts.push({key:'daycap',scope:'day',min:d,cap:d,title:'Όριο'});
}else if(def.restorative){
alerts.push({key:'half',scope:'day',min:d/2,cap:d,title:'Μισό'});
alerts.push({key:'p80',scope:'day',min:d*ap,cap:d,title:apTitle});
alerts.push({key:'cap',scope:'day',min:d,cap:d,title:'Όριο'});
alerts.push({key:'double',scope:'day',min:info.hardLimit,cap:info.hardLimit,title:'Μέγιστο'});
}else{
alerts.push({key:'p80',scope:'day',min:d*ap,cap:d,title:apTitle});
alerts.push({key:'cap',scope:'day',min:d,cap:d,title:'Όριο'});
}
var wl=def.restorative?info.weeklyMax:info.weeklyCap;
if(wl){
alerts.push({key:'week80',scope:'week',min:wl*ap,cap:wl,title:apTitle+' εβδ.'});
alerts.push({key:'weekcap',scope:'week',min:wl,cap:wl,title:'Εβδομαδιαίο'});
}
var seen=new Set();
return alerts.filter(function(a){var k=a.key+'|'+a.scope+'|'+Math.round(a.min*10);if(seen.has(k)||a.min<=0)return false;seen.add(k);return true;});
}

function openFixedEditor(id){
var def=id?FIXED_DEFS.find(function(x){return x.id===id;}):null;
var d=def||{name:'',short:'',color:'#6366f1',color2:'#8b5cf6',daily:60,weekly:420,target:0,hard:false,timeRange:[8,22],desc:'',categoryId:'',healthAware:false};
var hard=!!d.hard;var hw=!!d.healthAware;var cat=d.categoryId||'';
var catOpts='<option value="">Αυτόματο από το όνομα</option>'+ACT_CATS.map(function(c){return '<option value="'+c.id+'"'+(cat===c.id?' selected':'')+'>'+c.name+'</option>';}).join('');
var body='<div class="field"><label>Όνομα</label><input id="fName" value="'+esc(d.name)+'"></div>'
+'<div class="field"><label>Σύντομο (1 γράμμα)</label><input id="fShort" maxlength="2" value="'+esc(d.short)+'"></div>'
+'<div class="field"><label>Περιγραφή</label><input id="fDesc" value="'+esc(d.desc||'')+'"></div>'
+'<div class="field"><label>Κατηγορία</label><select id="fCat">'+catOpts+'</select></div>'
+'<div class="field"><label>Χρώματα</label><div class="day-row"><input id="fColor" type="color" value="'+d.color+'" style="width:60px;padding:4px"><input id="fColor2" type="color" value="'+d.color2+'" style="width:60px;padding:4px"></div></div>'
+'<div class="field"><label>Ημερήσιο όριο (λεπτά)</label><input id="fDaily" type="number" min="5" max="1440" step="5" value="'+d.daily+'"></div>'
+'<div class="field"><label>Εβδομαδιαίο όριο (λεπτά)</label><input id="fWeekly" type="number" min="5" max="10080" step="5" value="'+d.weekly+'"></div>'
+'<div class="field"><label>Στόχος φορές / εβδομάδα (0 = χωρίς)</label><input id="fTarget" type="number" min="0" max="21" step="1" value="'+(d.target||0)+'"></div>'
+'<div class="field"><label>Ώρες: από / έως</label><div class="day-row"><input id="fFrom" type="number" min="0" max="24" step="1" value="'+d.timeRange[0]+'" style="width:80px"><input id="fTo" type="number" min="0" max="24" step="1" value="'+d.timeRange[1]+'" style="width:80px"></div></div>'
+'<div class="setting-row"><div><strong>Σκληρό όριο</strong><span class="muted">Διακοπή καταγραφής όταν πιάνεται το όριο.</span></div><button id="fHardBtn" type="button" class="switch '+(hard?'on':'')+'"></button></div>'
+'<div class="setting-row"><div><strong>Ευεξία</strong><span class="muted">Ειδοποιήσεις ματιών και σηκώματος όσο τρέχει.</span></div><button id="fHealthBtn" type="button" class="switch '+(hw?'on':'')+'"></button></div>'
+'<div id="budgetBox"></div><div id="formError" class="form-error"></div>';

function totalMin(type,id,from,to){var s=state.logs.reduce(function(acc,l){if(l.type===type&&l.id===id)return acc+overlap(l.start,l.end,from,to)/60000;return acc;},0);var a=state.active;if(a&&a.type===type&&a.id===id)s+=overlap(a.start,a.pausedAt||Date.now(),from,to)/60000;return s;}
function allTotalMin(from,to){var s=state.logs.reduce(function(acc,l){return acc+overlap(l.start,l.end,from,to)/60000;},0);var a=state.active;if(a)s+=overlap(a.start,a.pausedAt||Date.now(),from,to)/60000;return s;}
function occurrences(type,id,from,to){var days=new Set();state.logs.forEach(function(l){if(l.type===type&&l.id===id&&l.dur>0.01&&overlap(l.start,l.end,from,to)>0)days.add(startOfDay(l.start));});var a=state.active;if(a&&a.type===type&&a.id===id){var s=Math.max(a.start,from),e=Math.min(a.pausedAt||Date.now(),to);if(e>s)days.add(startOfDay(a.start));}return days.size;}

function generateWeeklyReview(){
var ws=startOfWeek();var we=startOfNextWeek();var now=Date.now();
if(now<we-2*3600000)return null;
var weekKey=shortDate(ws)+'-'+shortDate(we-86400000);
if(state.weeklyReviews.find(function(r){return r.key===weekKey;}))return null;
var totalStudy=state.courses.filter(function(c){return c.active&&c.hours>0;}).reduce(function(s,c){return s+totalMin('course',c.id,ws,we);},0);
var targetStudy=state.courses.filter(function(c){return c.active&&c.hours>0;}).reduce(function(s,c){return s+c.hours*60;},0);

if(review.stats.compliance.rate<80)review.stats.suggestions.push('Μείνε εντός ορίων περισσότερο');
if(relaxDef&&relaxOvers>0)review.stats.suggestions.push('Μείωσε υπερβάσεις χαλάρωσης ('+relaxOvers+')');
if(gymDef&&gymDef.target&&gymOcc<gymDef.target)review.stats.suggestions.push(gymDef.name+': '+(gymDef.target-gymOcc)+' φορές ακόμα');

}
function budgetSnapshotExact(courses,fixedDefs,sleepHours){
var slots=(state.schedule&&state.schedule.slots)||[];

slots.forEach(function(s){if(!s||!s.activityId)return;var p=String(s.activityId).split(':');if(p[0]==='fixed')scheduledFixed[p.slice(1).join(':')]=1;else if(p[0]==='course')scheduledCourse[p.slice(1).join(':')]=1;});
var unscheduledFixedW=0;
fixedDefs.forEach(function(d){if(!scheduledFixed[d.id])unscheduledFixedW+=(d.weekly||0);});
var unscheduledCourses=[];
courses.forEach(function(c){if(c&&c.active&&c.hours>0&&!scheduledCourse[c.id]){var off=Array.isArray(c.off)?c.off:[];var activeDays=Math.max(1,7-off.length);unscheduledCourses.push({hoursMin:c.hours*60,off:off,per:c.hours*60/activeDays});}});
var scheduledW=0,daysSlot=[0,0,0,0,0,0,0];
var todayIdx=(typeof mondayIndex==='function')?mondayIndex():0;
slots.forEach(function(s){
if(!s)return;var st,en;
if(s.day===todayIdx&&typeof slotEff==='function'){var eff=slotEff(s);st=eff.start;en=eff.end;}else{st=s.start;en=s.end;}
var t=String(st||'0:0').split(':').map(Number),e=String(en||'0:0').split(':').map(Number);
var m=(e[0]*60+(e[1]||0))-(t[0]*60+(t[1]||0));
if(m>0){scheduledW+=m;if(s.day>=0&&s.day<7)daysSlot[s.day]+=m;}
});
var unscheduledCourseW=0,unscheduledCourseDay=[0,0,0,0,0,0,0];
unscheduledCourses.forEach(function(c){unscheduledCourseW+=c.hoursMin;for(var d=0;d<7;d++){if(c.off.indexOf(d)<0)unscheduledCourseDay[d]+=c.per;}});
var plannedW=scheduledW+unscheduledFixedW+unscheduledCourseW;
var actualSleepToday=((typeof sleepTodayMin==='function')?sleepTodayMin():0)||(sleepHours*60);
var weeklySleep=sleepHours*7*60+(actualSleepToday-sleepHours*60);
var weekRem=10080-weeklySleep-plannedW;
var days=[];
for(var d=0;d<7;d++){var sleepD=(d===todayIdx?actualSleepToday:sleepHours*60);var loadD=daysSlot[d]+unscheduledFixedW/7+unscheduledCourseDay[d];days.push(1440-sleepD-loadD);}
return {weekRem:weekRem,days:days,sleepW:weeklySleep,plannedW:plannedW};
}
if(state.lastTab)currentTab=state.lastTab;
render();

document.addEventListener('pointerdown',rhUnlock,true);

function rhTone(c,t,f,d,g,track){
  var o=c.createOscillator(),gn=c.createGain();
  o.type='square';
  o.frequency.setValueAtTime(f,t);
  gn.gain.setValueAtTime(0.0001,t);
  gn.gain.exponentialRampToValueAtTime(g,t+0.012);
  gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(gn);gn.connect(c.destination);
  o.start(t);o.stop(t+d+0.03);
  if(track)RH_NODES.push({o:o,g:gn});
}
function rhSoundStart(){
  if(!state.settings.sound)return;
  var c=rhCtx();
  if(c&&c.state==='running'){
    RH_NODES=[];
    var t0=c.currentTime+0.03;
    for(var i=0;i<14;i++){
      rhTone(c,t0+i*0.5,880,0.17,0.3,true);
      rhTone(c,t0+i*0.5+0.22,1245,0.17,0.3,true);
    }
    return;
  }
  if(RH_AEL){
    try{RH_AEL.muted=false;RH_AEL.loop=true;RH_AEL.volume=1;RH_AEL.currentTime=0;var p=RH_AEL.play();if(p&&p.catch)p.catch(function(){});}catch(e){}
  }
}
function rhSoundStop(){
  if(RH_NODES){
    for(var i=0;i<RH_NODES.length;i++){
      try{RH_NODES[i].o.stop();}catch(e){}
      try{RH_NODES[i].g.disconnect();}catch(e){}
    }
    RH_NODES=null;
  }
  if(RH_AEL){try{RH_AEL.pause();RH_AEL.currentTime=0;}catch(e){}}
}
function rhVibeStart(){

      for(var i=0;i<14;i++){pat.push(350);pat.push(150);}
      navigator.vibrate(pat);
    }
  }catch(e){}
}
function rhVibeStop(){try{if(navigator.vibrate)navigator.vibrate(0);}catch(e){}}

function startHealthAlarm(){

function healthBreakFrame(){
  var hb=state.healthBreak;

  if(!hb){if(bar)bar.classList.remove('on');return;}

<script>
/* ===== ΣΥΝΟΧΗ v1: ΕΝΙΑΙΟ ΜΟΝΤΕΛΟ ΗΜΕΡΑΣ + ΣΗΜΑΙΕΣ ΑΝΤΙ ΓΙΑ IDS ===== */

function daySnap(){return (typeof budgetSnapshotExact==='function'?budgetSnapshotExact:budgetSnapshot)(state.courses,FIXED_DEFS,state.settings.sleepHours);}
function dayModel(idx,snap){
snap=snap||daySnap();
var today=mondayIndex(),isToday=(idx===today);
var d=new Date(startOfWeek());d.setDate(d.getDate()+idx);
var ds=d.getTime(),de=startOfNextDay(ds);
var sleep=isToday?(1440-todayAwakeMin()):(state.settings.sleepHours*60);
var awake=1440-sleep;
var logged=(ds<=Date.now())?allTotalMin(ds,de):0;
var planned=Math.max(0,awake-(snap.days[idx]||0));
return {idx:idx,isToday:isToday,sleep:sleep,awake:awake,logged:logged,planned:planned,freeLogged:awake-logged,freePlanned:awake-planned};
}
function heavyThreshold(awake){return awake*(state.settings.heavyDayPct||85)/100;}

function getHeavyDayWarning(){
var m=dayModel(mondayIndex()),thr=heavyThreshold(m.awake);
return {heavy:m.logged>=thr,load:m.logged,remaining:m.freeLogged,threshold:thr};
}
function getUpcomingHeavyDays(){
var today=mondayIndex(),snap=daySnap(),out=[];
for(var i=today+1;i<7;i++){
var m=dayModel(i,snap);
if(m.planned>=heavyThreshold(m.awake))out.push({day:i,load:m.planned,remaining:m.freePlanned});
}
return out;
}
function dailyFreeMin(){
var snap=daySnap(),s=0;
for(var i=0;i<7;i++)s+=dayModel(i,snap).freePlanned;
return s/7;
}

/* --- αποκαταστατική σημαια αντί για id 'relax' --- */
function isRestorative(d){return !!(d&&(d.restorative===true||d.categoryId==='recover'));}
function relaxDef(){return FIXED_DEFS.find(isRestorative)||null;}
function relaxBaseDaily(){var d=relaxDef();return d?d.weekly/7:RELAX_WEEK/7;}
function relaxDouble(){return relaxBaseDaily()*2;}
function relaxOversUsed(includeToday){
var d=relaxDef();if(!d)return 0;
var base=d.weekly/7,ws=startOfWeek(),today=startOfDay(),n=0;
for(var i=0;i<7;i++){
var x=new Date(ws);x.setDate(x.getDate()+i);
var ds=x.getTime();
if(ds>today)continue;
if(includeToday===false&&ds>=today)continue;
if(totalMin('fixed',d.id,ds,startOfNextDay(ds))>base+0.5)n++;
}
return n;
}
function fixedInfo(id){
var def=FIXED_DEFS.find(function(x){return x.id===id;});if(!def)return null;
var rest=isRestorative(def);
var dayMin=totalMin('fixed',id,startOfDay(),startOfNextDay());
var weekMin=totalMin('fixed',id,startOfWeek(),startOfNextWeek());
var occ=occurrences('fixed',id,startOfWeek(),startOfNextWeek());
var dailyCap=def.daily,weeklyCap=def.weekly,hardLimit=Infinity,extra={restorative:rest};
if(rest){
var base=def.weekly/7,allowed=state.settings.relaxOvers;
var before=relaxOversUsed(false),shown=relaxOversUsed(true),canOver=before<allowed;
dailyCap=base;weeklyCap=def.weekly;hardLimit=canOver?base*2:base;
extra={restorative:true,base:base,double:base*2,overs:shown,oversBefore:before,allowed:allowed,canOver:canOver,weeklyMax:def.weekly+allowed*base};
}else if(def.hard){hardLimit=dailyCap;}
return Object.assign({def:def,dayMin:dayMin,weekMin:weekMin,occ:occ,dailyCap:dailyCap,weeklyCap:weeklyCap,hardLimit:hardLimit,dayRemaining:dailyCap-dayMin,dayOver:Math.max(0,dayMin-dailyCap),weekRemaining:weeklyCap-weekMin,weekOver:Math.max(0,weekMin-weeklyCap),target:def.target},extra);
}
function startFixed(id){
if(state.active){showToast('Τρέχει άλλο.');return;}
var info=fixedInfo(id);if(!info)return;
if(info.def.hard&&info.dayMin>=info.hardLimit-0.05){pushAlert({title:info.def.name+': όριο',message:'Μέγιστο '+fmtPrecise(info.hardLimit)+'.'});return;}
if(info.restorative&&info.dayMin>=info.dailyCap-0.05){
if(!info.canOver){pushAlert({title:info.def.name,message:info.overs+'/'+info.allowed+' υπερβάσεις.'});return;}
confirmModal('Υπέρβαση','Ήδη '+fmtPrecise(info.dayMin)+'. Συνέχεια έως '+fmtPrecise(info.double)+'.',function(){doStart('fixed',id);},'Συνέχεια');return;
}
if(!info.def.hard&&info.dayRemaining<=0){confirmModal('Υπέρβαση',info.def.name+': το όριο εξαντλήθηκε.',function(){doStart('fixed',id);},'Έναρξη');return;}
doStart('fixed',id);
}
function fixedCard(def,index){
var info=fixedInfo(def.id),rest=isRestorative(def);
var isActive=state.active&&state.active.type==='fixed'&&state.active.id===def.id;
var otherActive=state.active&&!isActive;
var dayPct=info.dailyCap?clamp(info.dayMin/info.dailyCap*100,0,100):0;
var weekLimit=rest?info.weeklyMax:info.weeklyCap;
var weekPct=weekLimit?clamp(info.weekMin/weekLimit*100,0,100):0;
var sc='info',st='Εντός';
if(info.weekMin>weekLimit+0.5){sc='danger';st='Υπέρβαση εβδομάδας';}
else if(info.dayMin>info.dailyCap+0.5){sc='danger';st='Υπέρβαση ημέρας';}
else if(rest&&info.weekMin>info.weeklyCap+0.5){sc='warn';st='Υπέρβαση βάσης';}
else if(info.target&&info.occ>info.target){sc='warn';st='Πάνω από στόχο';}
else if(info.target&&info.occ>=info.target){sc='success';st='Στόχος';}
else if(dayPct>=80||weekPct>=80){sc='warn';st='Οριακά';}
var dayText=info.dayRemaining>=0?fmtHM(info.dayRemaining):'+'+fmtHM(info.dayOver);
var weekText=info.weekMin<=weekLimit?fmtHM(weekLimit-info.weekMin):'+'+fmtHM(info.weekMin-weekLimit);
var tl='Στόχος',tv='—',ts='';
if(def.target){tv=info.occ+'/'+def.target;ts='φορές';}
else if(rest){tl='Υπερβάσεις';tv=info.overs+'/'+info.allowed;ts='Διπλό '+fmtPrecise(info.double);}
else{tl='Ροή';tv='Ελεύθερη';}
var button;
if(isActive)button='<button class="btn btn-stop" onclick="stopActive()">Διακοπή</button>';
else if(otherActive)button='<button class="btn btn-primary" disabled>Τρέχει άλλο</button>';
else if(def.hard&&info.dayMin>=info.hardLimit-0.05)button='<button class="btn btn-primary" disabled>Όριο</button>';
else if(info.dayRemaining<=0){
if(rest&&!info.canOver)button='<button class="btn btn-primary" disabled>Όριο</button>';
else button='<button class="btn btn-warn" onclick="startFixed(\''+def.id+'\')">Υπέρβαση</button>';
}else button='<button class="btn btn-primary" onclick="startFixed(\''+def.id+'\')">Έναρξη</button>';
var note='';
if(rest)note='Βάση '+fmtPrecise(info.base)+', '+info.allowed+' υπερβάσεις έως '+fmtPrecise(info.double)+'.';
else if(Array.isArray(def.milestones)&&def.milestones.length)note='Ορόσημα: '+def.milestones.map(function(m){return m<0?(-m)+'λ πριν το όριο':m+'λ';}).join(', ')+'.';
else if(def.hard)note='Σκληρό όριο '+fmtHM(info.dailyCap)+'.';
var cat=catById(def.categoryId||'organize');
return '<article class="card activity '+(isActive?'running':'')+'" style="--accent:'+cat.color+';--accent2:'+cat.color2+';animation-delay:'+(index*0.03)+'s">'
+'<div class="activity-head"><div class="icon">'+esc(def.short)+'</div><div class="activity-title"><h3>'+esc(def.name)+'</h3><p class="muted">'+esc(def.desc||'')+'</p></div><span class="pill '+sc+'">'+st+'</span></div>'
+'<div class="metrics"><div class="metric"><span>Σήμερα</span><strong class="'+(info.dayRemaining<0?'text-danger':'')+'">'+dayText+'</strong><div class="progress '+(info.dayRemaining<0?'over':'')+'"><span style="width:'+dayPct+'%"></span></div><small>'+fmtHM(info.dayMin)+' / '+(rest?fmtPrecise(info.dailyCap):fmtHM(info.dailyCap))+'</small></div>'
+'<div class="metric"><span>Εβδομάδα</span><strong class="'+(info.weekMin>weekLimit?'text-danger':'')+'">'+weekText+'</strong><div class="progress '+(info.weekMin>weekLimit?'over':'')+'"><span style="width:'+weekPct+'%"></span></div><small>'+fmtHM(info.weekMin)+' / '+fmtHM(weekLimit)+'</small></div>'
+'<div class="metric"><span>'+tl+'</span><strong>'+tv+'</strong><small>'+(ts||'&nbsp;')+'</small></div></div>'
+(note?'<p class="note">'+note+'</p>':'')
+'<div class="actions">'+button+'<button class="btn btn-ghost" onclick="openFixedEditor(\''+def.id+'\')">✎</button></div></article>';
}
function relaxSettingsHTML(){
var d=relaxDef();
if(!d)return '<p class="note">Καμία αποκαταστατική δραστηριότητα. Βάλε μία δραστηριότητα στην κατηγορία «Επαναφορά» για να εμφανιστούν εδώ οι υπερβάσεις της.</p>';

+'<div class="summary-grid"><div class="stat-box"><span>Ημερήσια βάση</span><strong>'+fmtPrecise(base)+'</strong></div><div class="stat-box"><span>Διπλό</span><strong>'+fmtPrecise(base*2)+'</strong></div><div class="stat-box"><span>Εβδομαδιαία βάση</span><strong>'+fmtHM(d.weekly)+'</strong></div><div class="stat-box"><span>Μέγιστο</span><strong>'+fmtPrecise(max)+'</strong></div></div>';
}

/* --- ποσοστό κατωφλιού σε ΟΛΕΣ τις δραστηριότητες, dedup ανά λεπτό --- */
function buildFixedAlerts(def,info){
var alerts=[],d=info.dailyCap;
var ap=(state.settings.alertPct||80)/100,apTitle=Math.round(ap*100)+'%';
if(Array.isArray(def.milestones)&&def.milestones.length){
def.milestones.forEach(function(m,i){
var min=m<0?Math.max(0,d+m):m;
alerts.push({key:'ms'+i,scope:'day',min:min,cap:d,title:m<0?(-m)+'λ πριν':(m+'λ')});
});
}
if(info.restorative){
alerts.push({key:'half',scope:'day',min:d/2,cap:d,title:'Μισό'});
alerts.push({key:'double',scope:'day',min:info.hardLimit,cap:info.hardLimit,title:'Μέγιστο'});
}
alerts.push({key:'cap',scope:'day',min:d,cap:d,title:'Όριο'});
alerts.push({key:'pct',scope:'day',min:d*ap,cap:d,title:apTitle});
var wl=info.restorative?info.weeklyMax:info.weeklyCap;
if(wl){
alerts.push({key:'weekcap',scope:'week',min:wl,cap:wl,title:'Εβδομαδιαίο'});
alerts.push({key:'weekpct',scope:'week',min:wl*ap,cap:wl,title:apTitle+' εβδ.'});
}
var seen={};
return alerts.filter(function(a){
if(!(a.min>0))return false;
var k=a.scope+'|'+Math.round(a.min*10);
if(seen[k])return false;
seen[k]=1;return true;
});
}

/* --- προτάσεις από το ενιαίο μοντέλο, μόνο εντός ώρας --- */
function getSmartSuggestions(){
var out=[],today=mondayIndex(),m=dayModel(today);
var free=m.freeLogged,hour=new Date().getHours();
if(free<30)return out;
state.courses.forEach(function(c){
if(!c.active||!c.hours||c.off.includes(today))return;
var i=courseInfo(c);
if(i.remaining>60)out.push({type:'course',id:c.id,name:c.name,duration:Math.min(i.remaining,free),priority:i.remaining>180?'high':i.remaining>120?'medium':'low',reason:'Χρειάζεσαι '+fmtHM(i.remaining)+' ακόμα',timeOk:true});
});
FIXED_DEFS.forEach(function(def){
var r=def.timeRange||[0,24];
if(!(hour>=r[0]&&hour<r[1]))return;
var i=fixedInfo(def.id);
if(def.target&&i.occ<def.target){out.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(def.daily,free),priority:'medium',reason:i.occ+'/'+def.target+' φορές',timeOk:true});return;}
if(isRestorative(def)&&i.dayRemaining>30){out.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(i.dayRemaining,free),priority:'low',reason:'Επαναφορά',timeOk:true});return;}
if(def.categoryId==='body'&&i.dayRemaining>60){out.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(120,free),priority:'low',reason:'Κίνηση',timeOk:true});}
});
out.sort(function(a,b){var p={high:3,medium:2,low:1};return p[b.priority]-p[a.priority];});
return out.slice(0,state.settings.suggestionLimit||3);
}

/* --- χειροκίνητος ύπνος: σωστό παράθυρο πέρα από τα μεσάνυχτα --- */
function sleepManual(){
var d=prompt('Ημερομηνία (YYYY-MM-DD):',getDailyPlanKey());if(!d)return;
var s=prompt('Ύπνος ξεκινά (HH:MM):','23:00');if(!s)return;
var e=prompt('Ύπνος τελειώνει (HH:MM):','07:00');if(!e)return;
var sm=schParseHM(s),em=schParseHM(e);
var base=startOfDay(new Date(d+'T12:00:00').getTime());
if(!isFinite(base)){showToast('Λάθος ημερομηνία.');return;}
var start=base+sm*60000,end=base+em*60000;
if(em<=sm)end+=86400000;
var dur=(end-start)/60000;
if(dur<1||dur>16*60){showToast('Διάρκεια εκτός ορίων (1 λεπτό έως 16 ώρες).');return;}
state.sleep.hours=state.sleep.hours||{};
state.sleep.windows=state.sleep.windows||{};
var mid=startOfNextDay(start);
if(end<=mid){
var k=getDailyPlanKey(start);
state.sleep.hours[k]=dur/60;
state.sleep.windows[k]={start:start,end:end};
}else{
var k1=getDailyPlanKey(start),k2=getDailyPlanKey(end);
state.sleep.hours[k1]=(mid-start)/3600000;
state.sleep.hours[k2]=(end-mid)/3600000;
state.sleep.windows[k1]={start:start,end:mid};
state.sleep.windows[k2]={start:mid,end:end};
}
saveState();render();showToast('Καταχωρήθηκε ύπνος '+fmtHM(dur)+'.');
}

<script>
/* ===== ΕΛΕΓΧΟΣ ΗΜΕΡΑΣ v1: ΤΙ ΣΗΜΑΙΝΕΙ ΣΥΜΜΟΡΦΩΣΗ ===== */
function rhDayLogged(s,e){return allTotalMin(s,e);}
function rhRestorativeOk(d,ds){
var base=d.weekly/7,m=totalMin('fixed',d.id,ds,startOfNextDay(ds));
if(m<=base+0.5)return true;
if(m>base*2+0.5)return false;
var ws=startOfWeek(ds),n=0;
for(var t=ws;t<=ds;t=startOfNextDay(t)){if(totalMin('fixed',d.id,t,startOfNextDay(t))>base+0.5)n++;}
return n<=(state.settings.relaxOvers||0);
}
function dayCompliant(ts){var a=dayAudit(ts);return !a.empty&&a.ok;}
function dayHasData(ts){var s=startOfDay(ts),e=startOfNextDay(s);return rhDayLogged(s,e)>0;}
function streakCount(){
var day=86400000,cur=startOfDay(),n=0;
var a=dayAudit(cur);
if(a.empty||!a.ok)cur-=day;
while(n<60){var x=dayAudit(cur);if(x.empty||!x.ok)break;n++;cur-=day;}
return n;
}
render();
/* ===== ΤΕΛΟΣ ΕΛΕΓΧΟΥ ΗΜΕΡΑΣ v1 ===== */
</script>
