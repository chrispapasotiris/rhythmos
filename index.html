<script>
/* ===== ΟΨΗ ΗΜΕΡΑΣ v1: ΛΩΡΙΔΑ + ΠΛΑΝΟ/ΠΡΑΓΜΑΤΙΚΟ + ΕΠΕΞΕΡΓΑΣΙΑ + CSV ===== */

function rhHMtoMin(v){var p=String(v||'0:0').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function rhMinOfDay(ts){var d=new Date(ts);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
function rhPct(m){return clamp(m/1440*100,0,100);}
function rhActColor(type,id){
if(type==='course'){var c=state.courses.find(function(x){return x.id===id;});return c?c.color:'#64748b';}
var d=FIXED_DEFS.find(function(x){return x.id===id;});
if(!d)return '#64748b';
return (typeof catById==='function')?catById(d.categoryId||'organize').color:d.color;
}
function rhActName(type,id){
if(type==='course'){var c=state.courses.find(function(x){return x.id===id;});return c?c.name:'Μάθημα';}
var d=FIXED_DEFS.find(function(x){return x.id===id;});return d?d.name:'Δραστηριότητα';
}
function rhLoggedIn(type,id,a,b){
var m=0;
state.logs.forEach(function(l){if(l.type===type&&l.id===id)m+=overlap(l.start,l.end,a,b)/60000;});
var ac=state.active;
if(ac&&ac.type===type&&ac.id===id)m+=overlap(ac.start,ac.pausedAt||Date.now(),a,b)/60000;
return m;
}
function rhTodaySlots(){
if(typeof scheduleGetDay!=='function'||typeof mondayIndex!=='function')return [];
return scheduleGetDay(mondayIndex()).map(function(sl){
var eff=(typeof slotEff==='function')?slotEff(sl):sl;
var base=startOfDay();
var parts=(typeof slotActivityParts==='function')?slotActivityParts(sl):{type:'fixed',id:''};
return {id:sl.id,name:(typeof slotName==='function')?slotName(sl):'',type:parts.type,actId:parts.id,
a:base+rhHMtoMin(eff.start)*60000,b:base+rhHMtoMin(eff.end)*60000,
s:rhHMtoMin(eff.start),e:rhHMtoMin(eff.end),status:eff.status||'pending'};
});
}
function rhSleepSegs(){
var s=startOfDay(),e=startOfNextDay(),out=[];
var w=(state.sleep&&state.sleep.windows)?state.sleep.windows[getDailyPlanKey()]:null;
if(w&&w.end>w.start){
var a=Math.max(w.start,s),b=Math.min(w.end,e);
if(b>a)out.push([rhMinOfDay(a),rhMinOfDay(b)]);
}else if(state.sleepPattern){
var ps=rhHMtoMin(state.sleepPattern.start),pe=rhHMtoMin(state.sleepPattern.end);
if(pe>ps)out.push([ps,pe]);
else{out.push([ps,1440]);if(pe>0)out.push([0,pe]);}
}
if(state.sleep&&state.sleep.asleep&&state.sleep.startedAt){
var a2=Math.max(state.sleep.startedAt,s),b2=Math.min(Date.now(),e);
if(b2>a2)out.push([rhMinOfDay(a2),rhMinOfDay(b2)]);
}
return out;
}
function rhDayTimelineHTML(){
var s=startOfDay(),e=startOfNextDay(),i;
var sleep=rhSleepSegs();
var sleepHtml='';
for(i=0;i<sleep.length;i++){
sleepHtml+='<div class="rh-tl-sleep" style="left:'+rhPct(sleep[i][0])+'%;width:'+rhPct(sleep[i][1]-sleep[i][0])+'%"></div>';
}
var slots=rhTodaySlots();
var planHtml='';
for(i=0;i<slots.length;i++){
var sl=slots[i];
planHtml+='<div class="rh-tl-plan" title="'+esc(sl.name)+'" style="left:'+rhPct(sl.s)+'%;width:'+rhPct(Math.max(4,sl.e-sl.s))+'%;border-color:'+rhActColor(sl.type,sl.actId)+'"></div>';
}
var realHtml='';
state.logs.forEach(function(l){
if(l.end<=s||l.start>=e)return;
var a=rhMinOfDay(Math.max(l.start,s)),b=rhMinOfDay(Math.min(l.end,e));
realHtml+='<div class="rh-tl-seg" title="'+esc(rhActName(l.type,l.id))+'" style="left:'+rhPct(a)+'%;width:'+rhPct(Math.max(3,b-a))+'%;background:'+rhActColor(l.type,l.id)+'"></div>';
});
var ac=state.active;
if(ac){
var end=ac.pausedAt||Date.now();
if(end>s&&ac.start<e){
var a3=rhMinOfDay(Math.max(ac.start,s)),b3=rhMinOfDay(Math.min(end,e));
realHtml+='<div class="rh-tl-seg" style="left:'+rhPct(a3)+'%;width:'+rhPct(Math.max(3,b3-a3))+'%;background:'+rhActColor(ac.type,ac.id)+';box-shadow:0 0 0 2px var(--card) inset"></div>';
}
}
var nowPct=rhPct(rhMinOfDay(Date.now()));
var hours='<div class="rh-tl-hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>';
return '<div class="rh-tl-label">Πλάνο</div><div class="rh-tl">'+sleepHtml+planHtml+'<div class="rh-tl-now" style="left:'+nowPct+'%"></div></div>'
+'<div class="rh-tl-label">Πραγματικό</div><div class="rh-tl">'+sleepHtml+realHtml+'<div class="rh-tl-now" id="rhNowLine" style="left:'+nowPct+'%"></div></div>'+hours
+'<div class="rh-legend"><span><i style="background:var(--track)"></i>Ύπνος</span><span><i style="background:var(--danger)"></i>Τώρα</span><span>Διακεκομμένο = προγραμματισμένο</span></div>';
}
function rhPlanActualHTML(){
var s=startOfDay(),e=startOfNextDay();
var logged=allTotalMin(s,e);
var slots=rhTodaySlots(),planned=0,i;
for(i=0;i<slots.length;i++)planned+=Math.max(0,(slots[i].b-slots[i].a)/60000);
var awake=(typeof todayAwakeMin==='function')?todayAwakeMin():(1440-state.settings.sleepHours*60);
var diff=logged-planned;
var h='<div class="rh-tl-label">Σύνολο ημέρας</div>'
+'<div class="rh-pa-row"><span>Προγραμματισμένα</span><strong>'+fmtHM(planned)+'</strong></div>'
+'<div class="rh-bar"><span style="width:'+clamp(planned/awake*100,0,100)+'%;background:var(--primary)"></span></div>'
+'<div class="rh-pa-row"><span>Καταγεγραμμένα</span><strong>'+fmtHM(logged)+'</strong></div>'
+'<div class="rh-bar"><span style="width:'+clamp(logged/awake*100,0,100)+'%;background:var(--success)"></span></div>'
+'<div class="rh-pa-row"><span>Διαφορά</span><strong class="'+(diff<0?'text-warn':'text-success')+'">'+(diff>=0?'+':'−')+fmtHM(Math.abs(diff))+'</strong></div>';
if(!slots.length)return h+'<p class="note">Δεν υπάρχει προγραμματισμένη θέση για σήμερα, άρα η σύγκριση γίνεται με το μηδέν.</p>';
h+='<div class="rh-tl-label">Ανά θέση</div><div class="stack">';
var now=Date.now();
for(i=0;i<slots.length;i++){
var sl=slots[i];
var want=Math.max(0,(sl.b-sl.a)/60000);
var got=rhLoggedIn(sl.type,sl.actId,sl.a,sl.b);
var pc=want?clamp(got/want*100,0,100):0;
var cls='info',txt='Εκκρεμεί';
if(got>=want*0.9-0.5){cls='success';txt='Έγινε';}
else if(got>0){cls='warn';txt='Μισό';}
else if(now>sl.b){cls='danger';txt='Χάθηκε';}
if(sl.status==='skipped'){cls='danger';txt='Απορρίφθηκε';}
h+='<div class="list-row"><div class="list-left"><strong style="color:'+rhActColor(sl.type,sl.actId)+'">'+esc(sl.name)+'</strong>'
+'<span class="muted" style="font-size:.72rem">'+fmtHM(got)+' / '+fmtHM(want)+'</span>'
+'<div class="rh-bar" style="margin-top:5px"><span style="width:'+pc+'%;background:'+rhActColor(sl.type,sl.actId)+'"></span></div></div>'
+'<span class="pill '+cls+'">'+txt+'</span></div>';
}
return h+'</div>';
}
function rhExportCSV(){
if(!state.logs.length){showToast('Δεν υπάρχουν καταγραφές.');return;}
var rows=[['type','activity','date','start','end','minutes']];
state.logs.slice().sort(function(a,b){return a.start-b.start;}).forEach(function(l){
rows.push([l.type,rhActName(l.type,l.id),getDailyPlanKey(l.start),fmtAbs(l.start),fmtAbs(l.end),Number(l.dur||0).toFixed(2)]);
});
var csv=rows.map(function(r){
return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');
}).join('\r\n');
try{
var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;a.download='rhythmos-'+getDailyPlanKey()+'.csv';
document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(url);},3000);
showToast('Εξαγωγή '+(rows.length-1)+' καταγραφών.');
}catch(err){showToast('Αποτυχία εξαγωγής.');}
}

var body='<div class="field"><label>Ημερομηνία</label><input type="date" id="leDate" value="'+getDailyPlanKey(L.start)+'"></div>'

+'<div id="leErr" class="form-error"></div>';
openModal({title:'Επεξεργασία καταγραφής',body:body,buttons:[
{text:'Άκυρο',class:'btn-ghost'},
{text:'Αποθήκευση',class:'btn-primary',close:false,onClick:function(){

var a=base+rhHMtoMin(sv)*60000,b=base+rhHMtoMin(ev)*60000;
if(b<=a)b+=86400000;
var mins=(b-a)/60000;
if(mins<1||mins>960){err.textContent='Διάρκεια εκτός ορίων (1 λεπτό έως 16 ώρες).';err.classList.add('show');return false;}
L.start=a;L.end=b;L.dur=mins;
saveState();closeModal();render();showToast('Ενημερώθηκε η καταγραφή.');
}}]});
}
function rhSlotOverlaps(day,st,en,skipId){
var a=rhHMtoMin(st),b=rhHMtoMin(en),out=[];
if(typeof scheduleGetDay!=='function')return out;
scheduleGetDay(day).forEach(function(s){
if(skipId&&s.id===skipId)return;
var x=rhHMtoMin(s.start),y=rhHMtoMin(s.end);
if(a<y&&b>x)out.push(s);
});
return out;
}
function scheduleAdd(){

}

scheduleEditId=null;

scheduleOpen(scheduleCurDay);

commit();
}

render();

<script>

function rhGoalsHTML(){

var courses=state.courses.filter(function(c){return c.active&&c.hours>0;});

}

}

<script>
/* ===== ΣΕΡΙ v2: ΚΑΝΟΝΑΣ ΔΥΟ ΗΜΕΡΩΝ + ΣΥΝΕΠΕΙΑ ===== */
function streakCount(){
var day=86400000,cur=startOfDay(),n=0,miss=0,guard=0;
while(guard<120){
var a=dayAudit(cur);
if(a.empty){cur-=day;guard++;continue;}
if(a.ok){n++;miss=0;}
else{miss++;if(miss>=2)break;}
cur-=day;guard++;
}
return n;
}
function consistency14(){
var day=86400000,cur=startOfDay(),tot=0,ok=0;
for(var i=0;i<14;i++){
var a=dayAudit(cur-i*day);
if(a.empty)continue;
tot++;if(a.ok)ok++;
}
return {ok:ok,tot:tot};
}
function sleepExtrasMount(){
var main=document.querySelector('main');
if(!main)return;
var active=document.querySelector('.nav-btn.active');
var label=active?active.textContent:'';
if(label.indexOf('Ημέρα')>=0){
if(!document.getElementById('goals-card-extra')){main.insertAdjacentHTML('afterbegin','<div id="goals-card-extra">'+rhGoalsCardHTML()+'</div>');}
if(!document.getElementById('sleep-card-extra')){main.insertAdjacentHTML('beforeend','<div id="sleep-card-extra">'+sleepCardHTML()+logsTodayHTML()+'</div>');}
}
if(label.indexOf('Ανάλυση')>=0){
if(!document.getElementById('streak-card-extra')){
var c14=consistency14();
main.insertAdjacentHTML('afterbegin','<div id="streak-card-extra"><div class="card"><h3>Σερί και συνέπεια</h3>'
+'<div class="stat-card"><div class="stat-value">'+streakCount()+' ημέρες</div><div class="stat-sub">σερί με κανόνα δύο ημερών</div></div>'
+'<div class="plan-row" style="margin-top:8px"><span>Συνέπεια 14 ημερών</span><strong>'+c14.ok+'/'+c14.tot+'</strong></div>'
+'<p class="note">Μία μη συμμορφωμένη ημέρα δεν σπάει το σερί· δύο διαδοχικές το σπάνε. Ημέρες χωρίς καταγραφές είναι ουδέτερες, ούτε μετρούν ούτε σπάνε.</p></div></div>');
}
}
if(label.indexOf('Δραστηριότητες')>=0){
if(!document.getElementById('exam-card-extra')){main.insertAdjacentHTML('beforeend',examCardHTML());}
}
}
render();
/* ===== ΤΕΛΟΣ ΣΕΡΙ v2 ===== */
</script>

<script>
/* ===== ΛΗΞΗ ΗΜΕΡΑΣ v1: ΚΛΕΙΣΙΜΟ + ΜΕΤΑΦΟΡΑ + ΣΥΝΟΨΗ ===== */
(function(){
if(state.carry){
var tk=getDailyPlanKey();
Object.keys(state.carry).forEach(function(k){if(k<tk)delete state.carry[k];});
}
})();
function rhTodaySlotReport(){
var rows=[];
if(typeof scheduleGetDay!=='function')return rows;
var now=Date.now(),base=startOfDay();
scheduleGetDay(mondayIndex()).forEach(function(sl){
var eff=(typeof slotEff==='function')?slotEff(sl):sl;
var st=(typeof slotStatusGet==='function')?(slotStatusGet(sl.id)||{}):{};
var parts=(typeof slotActivityParts==='function')?slotActivityParts(sl):{type:'fixed',id:''};
var a=base+rhHMtoMin(eff.start)*60000,b=base+rhHMtoMin(eff.end)*60000;
var want=Math.max(0,(b-a)/60000);
var got=(typeof rhLoggedIn==='function')?rhLoggedIn(parts.type,parts.id,a,b):0;
var status=st.status||'pending',label;
if(status==='done')label='Έγινε';
else if(status==='skipped')label='Απορρίφθηκε';
else if(now>b)label=got>0?'Μισό':'Χάθηκε';
else label='Ανοιχτή';
rows.push({id:sl.id,name:(typeof slotName==='function')?slotName(sl):'',type:parts.type,actId:parts.id,want:want,got:got,status:status,label:label,open:now<=b,color:rhActColor(parts.type,parts.id)});
});
return rows;
}
function rhCarryKey(){return getDailyPlanKey(startOfNextDay());}
function openDayShutdown(){
var key=getDailyPlanKey();
var closed=!!(state.dayClose&&state.dayClose[key]);
var rows=rhTodaySlotReport();
var body='<div class="stack">';
if(!rows.length)body+='<p class="note">Δεν υπάρχουν θέσεις σήμερα. Η λήξη θα καταγράψει μόνο βαθμολογία και σημείωση.</p>';
rows.forEach(function(r,i){
var carryable=!closed&&!r.open&&(r.label==='Χάθηκε'||r.label==='Μισό')&&(r.want-r.got)>=10;
body+='<div class="list-row"><div class="list-left"><strong style="color:'+r.color+'">'+esc(r.name)+'</strong>'
+'<span class="muted" style="font-size:.72rem">'+fmtHM(r.got)+' / '+fmtHM(r.want)+'</span></div>'
+'<span class="pill '+(r.label==='Έγινε'?'success':(r.label==='Ανοιχτή'?'info':(r.label==='Μισό'?'warn':'danger')))+'">'+r.label+'</span>'
+(carryable?'<label class="gp-check" style="margin-left:8px"><input type="checkbox" data-carry="'+i+'"><span style="font-size:.72rem">Αύριο</span></label>':'')
+'</div>';
});
body+='</div>';
body+='<div class="field" style="margin-top:12px"><label>Βαθμολογία ημέρας</label><div class="actions">'
+[1,2,3,4,5].map(function(r){return '<button type="button" class="btn btn-ghost" data-rate="'+r+'">'+r+'</button>';}).join('')
+'</div></div>';
body+='<div class="field"><label>Σημείωση σύνοψης</label><input id="rhNote" placeholder="Τι πήγε καλά, τι όχι"></div>';
if(closed)body+='<p class="note">Η ημέρα έχει ήδη κλείσει. Όλα είναι μόνο για ανάγνωση.</p>';
openModal({title:'Λήξη ημέρας',body:body,buttons:[
{text:'Κλείσιμο',class:'btn-ghost'},
closed?{text:'ΟΚ',class:'btn-primary'}:{text:'Κλείσε την ημέρα',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet');
var rateBtn=sh.querySelector('[data-rate].on');
var rating=rateBtn?parseInt(rateBtn.getAttribute('data-rate'),10):0;
var note=(sh.querySelector('#rhNote').value||'').trim();
var carried=[];
sh.querySelectorAll('[data-carry]:checked').forEach(function(cb){
var r=rows[parseInt(cb.getAttribute('data-carry'),10)];
carried.push({type:r.type,id:r.actId,name:r.name,minutes:Math.round(r.want-r.got)});
});
if(rating)state.reviews[key]=rating;
if(note){state.reviewNotes=state.reviewNotes||{};state.reviewNotes[key]=note;}
if(carried.length){state.carry=state.carry||{};state.carry[rhCarryKey()]=carried;}
state.dayClose=state.dayClose||{};state.dayClose[key]=Date.now();
saveState();closeModal();render();
showToast(carried.length?('Η ημέρα έκλεισε. '+carried.length+' θέσεις πάνε αύριο.'):'Η ημέρα έκλεισε.');
}}
],onMount:function(sh){
sh.querySelectorAll('[data-rate]').forEach(function(b){
b.onclick=function(){
sh.querySelectorAll('[data-rate]').forEach(function(x){x.classList.remove('on','btn-primary');x.classList.add('btn-ghost');});
b.classList.add('on','btn-primary');b.classList.remove('btn-ghost');
};
});
}});
}
function rhGoalsCardHTML(){
var key=getDailyPlanKey();
var closed=!!(state.dayClose&&state.dayClose[key]);
return '<div class="card"><h3>Τώρα · Στόχοι · Πρόοδος</h3>'+rhNowNextHTML()+rhGoalsHTML()
+'<div class="actions" style="margin-top:12px"><button class="btn '+(closed?'btn-ghost':'btn-warn')+'" onclick="openDayShutdown()">'+(closed?'Ανακεφαλαίωση ημέρας':'Λήξη ημέρας')+'</button></div></div>';
}
function getSmartSuggestions(){
var out=[],today=mondayIndex();
var m=(typeof dayModel==='function')?dayModel(today):null;
var free=m?m.freeLogged:960;
var hour=new Date().getHours();
var carried=(state.carry&&state.carry[getDailyPlanKey()])||[];
carried.forEach(function(c){
out.push({type:c.type,id:c.id,name:c.name,duration:Math.max(15,Math.min(c.minutes,free)),priority:'high',reason:'Μεταφορά από χθες · '+fmtHM(c.minutes),timeOk:true});
});
var rest=[];
if(free>=30){
state.courses.forEach(function(c){
if(!c.active||!c.hours||c.off.includes(today))return;
var i=courseInfo(c);
if(i.remaining>60)rest.push({type:'course',id:c.id,name:c.name,duration:Math.min(i.remaining,free),priority:i.remaining>180?'high':i.remaining>120?'medium':'low',reason:'Χρειάζεσαι '+fmtHM(i.remaining)+' ακόμα',timeOk:true});
});
FIXED_DEFS.forEach(function(def){
var r=def.timeRange||[0,24];
if(!(hour>=r[0]&&hour<r[1]))return;
var i=fixedInfo(def.id);
if(def.target&&i.occ<def.target){rest.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(def.daily,free),priority:'medium',reason:i.occ+'/'+def.target+' φορές',timeOk:true});return;}
if((typeof isRestorative==='function'?isRestorative(def):(def.id==='relax'))&&i.dayRemaining>30){rest.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(i.dayRemaining,free),priority:'low',reason:'Επαναφορά',timeOk:true});return;}
if(def.categoryId==='body'&&i.dayRemaining>60){rest.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(120,free),priority:'low',reason:'Κίνηση',timeOk:true});}
});
rest.sort(function(a,b){var p={high:3,medium:2,low:1};return p[b.priority]-p[a.priority];});
}
return out.concat(rest).slice(0,state.settings.suggestionLimit||3);
}
render();
/* ===== ΤΕΛΟΣ ΛΗΞΗΣ ΗΜΕΡΑΣ v1 ===== */
</script>

var BF_FLY={list:[],raf:0,last:0,on:false};
function bfSkyEl(){var s=document.getElementById('bfSky');if(!s){s=document.createElement('div');s.id='bfSky';document.body.appendChild(s);}return s;}
function bfStopFlight(){
if(BF_FLY.raf){cancelAnimationFrame(BF_FLY.raf);BF_FLY.raf=0;}

function bfBuildFlight(){
bfStopFlight();
var b=bfEnsure();
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(state.settings.theme!=='butterflies'||!b.fly||b.count<1||reduce)return;
var list=bfEnabled();if(!list.length)list=[BF_SPECIES[1]];
var sky=bfSkyEl(),W=window.innerWidth,H=window.innerHeight;
for(var i=0;i<b.count;i++){
var sp=list[i%list.length];
var depth=b.depth?(0.6+Math.random()*0.65):1;
var el=document.createElement('div');el.className='bf-fly';
var w=Math.round(58*depth*(b.size/100)),h=Math.round(w*0.8);
el.style.width=w+'px';el.style.height=h+'px';
el.style.opacity=(b.depth?(0.42+depth*0.52):0.92).toFixed(2);
el.innerHTML=bfFlyerSvg(sp);
sky.appendChild(el);
BF_FLY.list.push({el:el,wr:el.querySelector('.bf-wr'),wl:el.querySelector('.bf-wl'),w:w,h:h,
x:Math.random()*W,y:Math.random()*H,hd:Math.random()*6.283,depth:depth,
ph:Math.random()*6.283,hzK:0.85+Math.random()*0.35,

}

BF_FLY.raf=requestAnimationFrame(bfStep);

function bfStep(ts){
if(!BF_FLY.on)return;
BF_FLY.raf=requestAnimationFrame(bfStep);
if(!BF_FLY.last){BF_FLY.last=ts;return;}
var dt=Math.min(0.05,(ts-BF_FLY.last)/1000);BF_FLY.last=ts;
var b=bfEnsure(),W=window.innerWidth,H=window.innerHeight;
var base=58*(b.speed/100),err=b.erratic/100,wind=b.wind*0.42;
for(var i=0;i<BF_FLY.list.length;i++){
var f=BF_FLY.list[i];
f.rt-=dt;
var dd=Math.hypot(f.tx-f.x,f.ty-f.y);
if(f.rt<=0||dd<48){f.tx=50+Math.random()*Math.max(60,W-100);f.ty=50+Math.random()*Math.max(60,H-100);f.rt=1.7+Math.random()*3.2;}

}

/* ===== ΧΑΡΤΗΣ ΩΡΩΝ + ΔΙΑΙΤΑ ===== */
function rhHourBuckets(){
var bk=[],i;for(i=0;i<24;i++)bk.push(0);
var from=Date.now()-28*86400000;
function add(s,e){
if(e<=from)return;
s=Math.max(s,from);
var guard=0;
while(s<e&&guard<2000){
guard++;
var d=new Date(s),h=d.getHours();
var nx=new Date(s);nx.setMinutes(0,0,0);nx.setHours(h+1);
var t=Math.min(e,nx.getTime());
if(t<=s)break;
bk[h]+=(t-s)/60000;s=t;
}
}
state.logs.forEach(function(l){add(l.start,l.end);});
var a=state.active;if(a)add(a.start,a.pausedAt||Date.now());
return bk;
}
function rhHourCardHTML(){
var bk=rhHourBuckets(),max=Math.max.apply(null,bk),i;
var total=bk.reduce(function(a,b){return a+b;},0);
var h='<div class="card"><h3>Χάρτης ποιότητας ώρας</h3>';
if(total<60)return h+'<p class="note">Χρειάζονται λίγες ακόμη καταγραφές για να βγει πότε αποδίδεις πραγματικά.</p></div>';
h+='<p class="muted" style="font-size:.78rem">Πού πήγε ο χρόνος σου τις τελευταίες 28 ημέρες, ανά ώρα του 24ώρου.</p><div class="rh-hm">';
for(i=0;i<24;i++){
var r=max?bk[i]/max:0;
h+='<i title="'+i+':00 — '+fmtHM(bk[i])+'" style="background:color-mix(in srgb,var(--primary) '+Math.round(r*100)+'%,var(--track))"></i>';
}
h+='</div><div class="rh-hm-x"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>';
var idx=bk.map(function(v,i){return {v:v,i:i};}).sort(function(a,b){return b.v-a.v;}).slice(0,3).sort(function(a,b){return a.i-b.i;});
var best=idx.map(function(o){return (o.i<10?'0':'')+o.i+':00–'+((o.i+1)<10?'0':'')+(o.i+1)+':00';}).join(', ');
h+='<div class="plan-row" style="margin-top:10px"><span>Οι τρεις καλύτερες ώρες σου</span><strong class="text-success">'+best+'</strong></div>';
h+='<p class="note">Βάλε τη βαριά νοητική δουλειά εκεί. Οι ώρες με σχεδόν άδειο κελί είναι ώρες που ιστορικά δεν αποδίδεις.</p></div>';
return h;
}
function rhDomPass(){
var main=document.querySelector('main');if(!main)return;
var act=document.querySelector('.nav-btn.active'),label=act?act.textContent:'';
var pomoOff=state.settings.pomodoroEnabled===false;
if(label.indexOf('Ρυθμίσεις')>=0){
Array.prototype.slice.call(main.querySelectorAll('.section-title')).forEach(function(t){
var k=t.textContent.trim().toLowerCase();
var drop=k.indexOf('εμφάνιση')===0||k.indexOf('μηνιαίες')===0||k.indexOf('δραστηριότητες')===0
||k.indexOf('onboarding')>=0||k.indexOf('εισαγωγ')>=0
||k.indexOf('focus')>=0||k.indexOf('pomodoro')>=0||k.indexOf('ειδοποι')>=0;
if(!drop)return;
var nodes=[t],n=t.nextElementSibling;
while(n&&!n.classList.contains('section-title')){nodes.push(n);n=n.nextElementSibling;}
nodes.forEach(function(x){x.remove();});
});
Array.prototype.slice.call(main.querySelectorAll('.summary-grid')).forEach(function(g){
if(g.textContent.indexOf('Ελεύθερος')<0)return;
var c=g.closest('.card');g.remove();
if(c&&!c.textContent.trim()&&!c.querySelector('input,button'))c.remove();
});
var ob=document.getElementById('rhOnboardRow');if(ob)ob.remove();
}
if(pomoOff&&label.indexOf('Ημέρα')>=0){
Array.prototype.slice.call(main.querySelectorAll('.card')).forEach(function(c){
var h=c.querySelector('h3');
if(h&&h.textContent.toLowerCase().indexOf('pomodoro')>=0)c.remove();
});
}
if(label.indexOf('Ανάλυση')>=0&&!document.getElementById('rh-hour-card')){
var w=document.createElement('div');w.id='rh-hour-card';w.innerHTML=rhHourCardHTML();
var anchor=main.querySelector('.card');
if(anchor&&anchor.parentNode)anchor.parentNode.insertBefore(w,anchor.nextSibling);else main.appendChild(w);
}
}
bfEnsure();
rhThemeApply();
rhThemeGrid();
rhPanelScrollFix();
bfApplyAll();
if(!window.__rhTheme3){
window.__rhTheme3=true;
var mm=document.querySelector('main');
if(mm&&typeof MutationObserver==='function')new MutationObserver(function(){rhDomPass();if(typeof rhPass2==='function')rhPass2();if(typeof rhUxPass==='function')rhUxPass();}).observe(mm,{childList:true});
setInterval(function(){rhThemeApply();rhThemeGrid();rhPanelScrollFix();bfCfgNode();},4000);
setInterval(function(){
var el=document.getElementById('rh-hour-card');
if(el){var a=document.querySelector('.nav-btn.active');if(a&&a.textContent.indexOf('Ανάλυση')>=0)el.innerHTML=rhHourCardHTML();}
},60000);
document.addEventListener('visibilitychange',function(){
if(document.hidden){if(BF_FLY.raf){cancelAnimationFrame(BF_FLY.raf);BF_FLY.raf=0;}}
else if(BF_FLY.on&&!BF_FLY.raf){BF_FLY.last=0;BF_FLY.raf=requestAnimationFrame(bfStep);}
});
var rz=0;
window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(bfResizeFlight,180);});
}
rhDomPass();
render();
/* ===== ΤΕΛΟΣ ΘΕΜΑΤΩΝ v3 ===== */
</script>

<script>

var rhPomoSetupOrig=(typeof window.openPomodoroSetup==='function')?window.openPomodoroSetup:null;

};
var rhPomoStartOrig=(typeof window.startPomodoro==='function')?window.startPomodoro:null;
window.startPomodoro=function(){

var t=null,id=null;
if(state.slotRunning){t=state.slotRunning.type;id=state.slotRunning.id;}
else if(typeof pomoSel!=='undefined'&&pomoSel&&pomoSel.type){t=pomoSel.type;id=pomoSel.id;}
if(!t){var c=state.courses.find(function(x){return x.active&&x.hours>0;});if(c){t='course';id=c.id;}}
closeModal();
if(t)doStart(t,id);else showToast('Δεν υπάρχει διαθέσιμη δραστηριότητα.');
return;
}
if(rhPomoStartOrig)return rhPomoStartOrig.apply(this,arguments);
};
function rhTogglePomodoro(on){
state.settings.pomodoroEnabled=!!on;
if(!on){try{if(P().phase)abortPomodoro(true);}catch(e){}}
saveState();render();rhPomoSync();
showToast(on?'Pomodoro ενεργό.':'Pomodoro ανενεργό. Οι θέσεις ξεκινούν απλή συνεδρία.');
}
function rhPomoFrame(){

if(!f){
f=document.createElement('div');
f.id='gpPomo';f.className='gp-section gp-flat';
f.innerHTML='<div><strong>Pomodoro</strong><small>Κύκλοι μελέτης με focus και διαλείμματα</small></div>'
+'<button type="button" class="switch" id="gpPomoSw" onclick="rhTogglePomodoro(state.settings.pomodoroEnabled===false)"></button>';

b.onclick=function(ev){ev.stopPropagation();rhSndPanelToggle();};

function rhSndPanel(){

p=document.createElement('div');
p.id='rhSoundPanel';p.className='gear-panel rh-snd';
p.innerHTML='<div class="rh-snd-head"><strong>Ήχος &amp; ειδοποιήσεις</strong></div>'
+'<div class="setting-row"><div><strong>Ειδοποιήσεις</strong><span class="muted">Εμφάνιση στη μπάρα του κινητού.</span></div>'
+'<button type="button" class="switch" id="rhSwNotif" onclick="rhSndNotif()"></button></div>'
+'<div class="setting-row"><div><strong>Ήχος</strong><span class="muted">Σήμα σε όρια, διαλείμματα και ολοκληρώσεις.</span></div>'
+'<button type="button" class="switch" id="rhSwSound" onclick="rhSndSound()"></button></div>'

else if(Notification.permission==='denied')h.textContent='Οι ειδοποιήσεις έχουν αποκλειστεί από τον browser για αυτή τη σελίδα. Άλλαξέ το από τις ρυθμίσεις του site.';
else if(Notification.permission!=='granted')h.textContent='Ενεργοποιώντας τις ειδοποιήσεις, ο browser θα ζητήσει άδεια.';
else h.textContent='Οι ειδοποιήσεις συστήματος είναι ενεργές. Ο συναγερμός διαλείμματος ηχεί και δονεί για 7 δευτερόλεπτα.';
}
}

var p=rhSndPanel();

if(typeof window.gpClose==='function')window.gpClose();
rhSndSync();
var r=b.getBoundingClientRect(),pw=p.offsetWidth||310;
p.style.left=Math.max(12,Math.min(window.innerWidth-pw-12,r.right-pw))+'px';
p.style.top=(r.bottom+8)+'px';

function rhSndNotif(){

if(r&&r.then)r.then(rhSndSync);
rhSndSync();setTimeout(rhSndSync,350);setTimeout(rhSndSync,1200);
}
function rhSndSound(){
state.settings.sound=!state.settings.sound;saveState();
if(typeof render==='function')render();
rhNoteBtn();rhSndSync();
if(state.settings.sound)rhTestSound();else showToast('Ήχος ανενεργός.');
}
function rhTestSound(){
if(!state.settings.sound){showToast('Ο ήχος είναι ανενεργός.');return;}
try{if(typeof beep==='function')beep();}catch(e){}
var b=document.getElementById('rhNoteBtn');
if(b){b.classList.remove('ping');void b.offsetWidth;b.classList.add('ping');setTimeout(function(){b.classList.remove('ping');},400);}
showToast('Έτσι ακούγεται το σήμα.');
}
rhLightInit();
rhNoteBtn();
rhPomoFrame();
rhStripRepo();
if(!window.__rhLightV4){
window.__rhLightV4=true;
var hdr=document.querySelector('header')||document.querySelector('.header');
if(hdr&&typeof MutationObserver==='function')new MutationObserver(function(){rhNoteBtn();}).observe(hdr,{childList:true,subtree:true});
var ov=document.getElementById('modalOverlay');
if(ov&&typeof MutationObserver==='function')new MutationObserver(function(){rhStripRepo();}).observe(ov,{childList:true,subtree:true});
document.addEventListener('click',function(ev){
var p=document.getElementById('rhSoundPanel');
if(!p||!p.classList.contains('open'))return;

if(p.contains(ev.target)||(b&&b.contains(ev.target)))return;

});
var sndGuard=function(ev){

if(p&&p.classList.contains('open'))ev.stopImmediatePropagation();
};
window.addEventListener('scroll',sndGuard,true);
document.addEventListener('scroll',sndGuard,true);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')rhSndClose();});

setInterval(function(){rhLightInit();rhNoteBtn();rhPomoFrame();rhSndSync();},3000);
}
render();
/* ===== ΤΕΛΟΣ ΡΥΘΜΟΥ v4 ===== */
</script>

<script>
/* ===== ΡΥΘΜΟΣ v5: ΥΠΝΟΣ + AUDIT + ΤΡΙΑ ΝΟΥΜΕΡΑ + ΕΦΙΚΤΟΤΗΤΑ + ΚΑΤΑΓΡΑΦΗ + NOTES ===== */
function rhHM2(v){var p=String(v||'0:0').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function rhLoggedAt(type,id,a,b){
var m=0;
state.logs.forEach(function(l){if(l.type===type&&l.id===id)m+=overlap(l.start,l.end,a,b)/60000;});
var ac=state.active;
if(ac&&ac.type===type&&ac.id===id)m+=overlap(ac.start,ac.pausedAt||Date.now(),a,b)/60000;
return m;
}

/* ---------- ΥΠΝΟΣ: ΜΙΑ ΠΗΓΗ ---------- */
function rhSleepList(k){
var w=(state.sleep&&state.sleep.windows)?state.sleep.windows[k]:null;
if(!w)return [];
if(Array.isArray(w))return w.filter(function(x){return x&&x.end>x.start;});
if(w.start&&w.end&&w.end>w.start)return [{start:w.start,end:w.end}];
return [];
}
function rhSleepSet(k,arr){
state.sleep.windows=state.sleep.windows||{};
state.sleep.hours=state.sleep.hours||{};
if(!arr.length){delete state.sleep.windows[k];delete state.sleep.hours[k];return;}
arr.sort(function(a,b){return a.start-b.start;});
state.sleep.windows[k]=arr;
var ms=0;arr.forEach(function(x){ms+=x.end-x.start;});
state.sleep.hours[k]=ms/3600000;
}
function rhSleepNorm(){
if(!state.sleep)return;
state.sleep.windows=state.sleep.windows||{};
Object.keys(state.sleep.windows).forEach(function(k){rhSleepSet(k,rhSleepList(k));});
}
function sleepTodayMin(){
var k=getDailyPlanKey(),s=startOfDay(),e=startOfNextDay(),now=Date.now(),ms=0;
rhSleepList(k).forEach(function(w){ms+=Math.max(0,Math.min(w.end,e,now)-Math.max(w.start,s));});
if(state.sleep&&state.sleep.asleep&&state.sleep.startedAt){
var a=Math.max(state.sleep.startedAt,s),b=Math.min(now,e);
if(b>a)ms+=b-a;
}
return Math.round(ms/60000);
}
var rhWakeOrig=(typeof window.sleepWake==='function')?window.sleepWake:null;
window.sleepWake=function(){
var k=getDailyPlanKey(),before=rhSleepList(k).slice();
var r=rhWakeOrig?rhWakeOrig.apply(this,arguments):null;
var raw=state.sleep.windows?state.sleep.windows[k]:null;
var list=before.slice();
if(raw&&!Array.isArray(raw)&&raw.start&&raw.end>raw.start)list.push({start:raw.start,end:raw.end});
rhSleepSet(k,list);saveState();
return r;
};
var rhManOrig=(typeof window.sleepManual==='function')?window.sleepManual:null;
window.sleepManual=function(){
var r=rhManOrig?rhManOrig.apply(this,arguments):null;
rhSleepNorm();saveState();render();
return r;
};

/* ---------- AUDIT: ΗΜΕΡΑ ΓΙΑ ΘΕΣΕΙΣ, ΕΒΔΟΜΑΔΑ ΓΙΑ ΜΕΛΕΤΗ ---------- */
function dayAudit(ts){
var s=startOfDay(ts),e=startOfNextDay(s),now=Date.now(),checks=[];
var logged=allTotalMin(s,e);
if(logged<=0)return {empty:true,checks:[],score:0,ok:false,logged:0};
FIXED_DEFS.forEach(function(d){
var m=totalMin('fixed',d.id,s,e);
if(m<=0&&!d.hard&&!d.target)return;
var rest=(typeof isRestorative==='function')?isRestorative(d):(d.categoryId==='recover');
var cap=rest?(d.weekly/7):d.daily;
var ok=rest?(typeof rhRestorativeOk==='function'?rhRestorativeOk(d,s):m<=cap*2+0.5):(m<=cap+0.5);
checks.push({label:d.name+' — όριο',ok:ok,detail:fmtHM(m)+' / '+fmtHM(cap)});
});
if(typeof scheduleGetDay==='function'&&typeof mondayIndex==='function'){
var slots=scheduleGetDay(mondayIndex(s)),want=0,got=0;
slots.forEach(function(sl){
var eff=(typeof slotEff==='function')?slotEff(sl):sl;
var a=s+rhHM2(eff.start)*60000,b=s+rhHM2(eff.end)*60000;
if(b>Math.min(now,e))return;
var parts=(typeof slotActivityParts==='function')?slotActivityParts(sl):{type:'fixed',id:''};
want+=(b-a)/60000;got+=rhLoggedAt(parts.type,parts.id,a,b);
});
if(want>0)checks.push({label:'Θέσεις ημέρας',ok:got>=want*0.9-0.5,detail:fmtHM(got)+' / '+fmtHM(want)});
}
var target=state.courses.filter(function(c){return c.active&&c.hours>0;}).reduce(function(a,c){return a+c.hours*60;},0);
if(target>0){
var from=s-6*86400000,study=0;
state.courses.forEach(function(c){if(c.active&&c.hours>0)study+=totalMin('course',c.id,from,e);});
var first=state.logs.length?state.logs.reduce(function(a,l){return Math.min(a,l.start);},now):now;
var span=Math.max(1,Math.min(7,Math.floor((e-Math.max(first,from))/86400000)+1));
var want2=target*span/7;
checks.push({label:'Μελέτη '+span+' ημερών',ok:study>=want2*0.9-0.5,detail:fmtHM(study)+' / '+fmtHM(want2)});
}
var sl=(state.sleep&&state.sleep.hours)?(state.sleep.hours[getDailyPlanKey(s)]||0):0;
if(sl>0){var tg=state.settings.sleepHours*60;checks.push({label:'Ύπνος',ok:sl*60>=tg*0.85,detail:fmtHM(sl*60)+' / '+fmtHM(tg)});}
var pass=checks.filter(function(c){return c.ok;}).length;
return {empty:checks.length===0,checks:checks,score:checks.length?pass/checks.length*100:0,ok:checks.length>0&&pass===checks.length,logged:logged};
}

function rhFeasibility(){

function rhHistStart(){return startOfDay(Date.now()-rhHistOff*86400000);}
function rhHistGo(d){
rhHistOff=Math.max(0,Math.min(365,rhHistOff+d));
var w=document.getElementById('rh-hist-card');
if(w)w.innerHTML=rhHistCardHTML();
}
function rhHistName(type,id){
if(typeof rhActName==='function')return rhActName(type,id);
if(type==='course'){var c=state.courses.find(function(x){return x.id===id;});return c?c.name:'Μάθημα';}
var d=FIXED_DEFS.find(function(x){return x.id===id;});return d?d.name:'Δραστηριότητα';
}
function rhHistCardHTML(){
var s=rhHistStart(),e=startOfNextDay(s),idx=[];
state.logs.forEach(function(L,i){if(L.end>s&&L.start<e)idx.push(i);});
var tot=allTotalMin(s,e);
var lbl=new Date(s).toLocaleDateString('el-GR',{weekday:'short',day:'numeric',month:'short'});
if(rhHistOff===0)lbl='Σήμερα';else if(rhHistOff===1)lbl='Χθες';
var h='<div class="card"><h3>Ιστορικό καταγραφών</h3>'
+'<div class="rh-hist-nav"><button type="button" class="btn btn-ghost" onclick="rhHistGo(1)" aria-label="Προηγούμενη ημέρα">‹</button>'
+'<div><strong>'+esc(lbl)+'</strong><small>'+fmtHM(tot)+' σύνολο · '+idx.length+' καταγραφές</small></div>'
+'<button type="button" class="btn btn-ghost" onclick="rhHistGo(-1)"'+(rhHistOff<=0?' disabled':'')+' aria-label="Επόμενη ημέρα">›</button></div>';
if(!idx.length){
h+='<p class="note">Καμία καταγραφή αυτή την ημέρα. Πήγαινε πιο πίσω ή πρόσθεσε ξεχασμένη δουλειά από την Ημέρα.</p>';
}else{
h+='<div class="stack" style="margin-top:10px">';
idx.forEach(function(i){
var L=state.logs[i];
h+='<div class="list-row"><div class="list-left"><strong>'+esc(rhHistName(L.type,L.id))+'</strong>'
+'<span class="muted">'+fmtAbs(L.start)+' – '+fmtAbs(L.end)+'</span></div>'
+'<div class="list-value">'+fmtHM(L.dur)+'</div>'
+'<button class="btn btn-ghost" onclick="logEdit('+i+')" aria-label="Επεξεργασία">✎</button>'
+'<button class="btn btn-ghost-danger" onclick="logDel('+i+')" aria-label="Διαγραφή">✕</button></div>';
});
h+='</div>';
}
return h+'</div>';
}
function rhSteppers(main){
Array.prototype.slice.call(main.querySelectorAll('.field input[type="number"]')).forEach(function(inp){
if(inp.getAttribute('data-rh-step'))return;
inp.setAttribute('data-rh-step','1');
var wrap=document.createElement('div');wrap.className='rh-step';
inp.parentNode.insertBefore(wrap,inp);
wrap.appendChild(inp);
var step=parseFloat(inp.getAttribute('step'))||1;
var mk=function(txt,dir){
var b=document.createElement('button');
b.type='button';b.className='rh-step-btn';b.textContent=txt;
b.setAttribute('aria-label',dir>0?'Αύξηση':'Μείωση');
b.onclick=function(){
var v=parseFloat(inp.value)||0,nv=v+dir*step;
var mn=parseFloat(inp.getAttribute('min')),mx=parseFloat(inp.getAttribute('max'));
if(isFinite(mn))nv=Math.max(mn,nv);
if(isFinite(mx))nv=Math.min(mx,nv);
inp.value=nv;
inp.dispatchEvent(new Event('input',{bubbles:true}));
inp.dispatchEvent(new Event('change',{bubbles:true}));
};
return b;
};
wrap.insertBefore(mk('−',-1),inp);
wrap.appendChild(mk('+',1));
});
}
function rhUxPass(){
var main=document.querySelector('main');if(!main)return;
var act=document.querySelector('.nav-btn.active'),label=act?act.textContent:'';
if(label.indexOf('Ημέρα')>=0){
var hs=main.querySelector('.hero-stats');
if(hs){
hs.classList.add('rh-3');
if(!document.getElementById('rhPlannedStat')){
var n=(typeof rhTodayNums==='function')?rhTodayNums():{planned:0};
var box=document.createElement('div');
box.className='stat-box';box.id='rhPlannedStat';
box.innerHTML='<span>Προγραμματισμένα</span><strong>'+fmtHM(n.planned)+'</strong>';
hs.appendChild(box);
}else{
var nn=(typeof rhTodayNums==='function')?rhTodayNums():{planned:0};
var st=document.querySelector('#rhPlannedStat strong');
if(st)st.textContent=fmtHM(nn.planned);
}
}
var nums=document.getElementById('rh-nums-card');
if(nums)nums.style.display='none';
var ns=document.getElementById('next-slot-card'),goals=document.getElementById('goals-card-extra');
if(ns&&goals&&goals.parentNode&&ns.previousElementSibling!==goals){
goals.parentNode.insertBefore(ns,goals.nextSibling);
}
}
if(label.indexOf('Ρυθμίσεις')>=0)rhSteppers(main);
if(label.indexOf('Ανάλυση')>=0&&!document.getElementById('rh-hist-card')){
var w=document.createElement('div');w.id='rh-hist-card';w.innerHTML=rhHistCardHTML();
var f=document.getElementById('rh-feas-card');
if(f&&f.parentNode)f.parentNode.insertBefore(w,f.nextSibling);else main.appendChild(w);
}
Array.prototype.slice.call(main.querySelectorAll('.card')).forEach(function(c){
var u=!!c.querySelector('.pill.danger'),wa=!u&&!!c.querySelector('.pill.warn');
c.classList.toggle('rh-urgent',u);
c.classList.toggle('rh-watch',wa);
});
}
if(!window.__rhUx1){
window.__rhUx1=true;
setInterval(function(){
var el=document.getElementById('rhPlannedStat');
if(!el)return;
var a=document.querySelector('.nav-btn.active');
if(a&&a.textContent.indexOf('Ημέρα')>=0&&typeof rhTodayNums==='function'){
var st=el.querySelector('strong');
if(st)st.textContent=fmtHM(rhTodayNums().planned);
}
},20000);
}
rhUxPass();
render();
/* ===== ΤΕΛΟΣ UX v1 ===== */
</script>

<script>
/* ===== ΜΑΘΗΜΑΤΑ v1: ΚΑΤΗΓΟΡΙΑ ΜΕΛΕΤΗΣ + ΕΜΒΟΛΙΜΕΣ + ΜΗΝΙΑΙΑ CRUD ===== */
(function(){
if(!ACT_CATS.some(function(c){return c.id==='study';})){
ACT_CATS.splice(1,0,{id:'study',name:'Μαθήματα',color:'#4f46e5',color2:'#7c3aed'});
}
})();
var RH_SEED_IDS=['osy','qm1','mech1','comp','elec','makeup1','makeup2'];
function rhCourseLogged(id){
var t=0;state.logs.forEach(function(l){if(l.type==='course'&&l.id===id)t+=(l.dur||0);});
return t;
}
function mergeCourses(saved){
var arr=Array.isArray(saved)?saved:[];
return arr.map(function(c){
return Object.assign({hours:0,totalHours:0,off:[],type:'core',active:false,color:'#6366f1',color2:'#8b5cf6',short:(c.name||'Μ').charAt(0)},c,{off:[]});
});
}
function rhStudyInit(){
if(typeof state.settings.showMakeup==='undefined')state.settings.showMakeup=true;
if(!state.__studyMigrated){
state.__studyMigrated=true;
var keep=[];
state.courses.forEach(function(c){
if(RH_SEED_IDS.indexOf(c.id)>=0&&rhCourseLogged(c.id)<=0.01)return;
keep.push(c);
});
state.courses=keep;
if(!state.courses.some(function(c){return c.type==='makeup';})){
for(var i=1;i<=2;i++){
state.courses.push({id:'mk'+i,name:'Εμβόλιμη θέση '+i,short:'Ε'+i,hours:0,totalHours:0,off:[],type:'makeup',active:false,color:'#0ea5e9',color2:'#0284c7',examDate:''});
}
}
saveState();
}
state.courses.forEach(function(c){
if(typeof c.totalHours==='undefined')c.totalHours=0;
if(!c.short)c.short=(c.name||'Μ').charAt(0);
if(!Array.isArray(c.off))c.off=[];
});
}
function rhMakeupAdd(){
var n=state.courses.filter(function(c){return c.type==='makeup';}).length+1;
var id='mk'+Date.now();
state.courses.push({id:id,name:'Εμβόλιμη θέση '+n,short:'Ε'+n,hours:0,totalHours:0,off:[],type:'makeup',active:false,color:'#0ea5e9',color2:'#0284c7',examDate:''});
saveState();render();rhStudyEditor(id);
}
function rhMakeupTrim(){
var mk=state.courses.filter(function(c){return c.type==='makeup';});
for(var i=mk.length-1;i>=0;i--){
if(rhCourseLogged(mk[i].id)<=0.01){
state.courses=state.courses.filter(function(c){return c.id!==mk[i].id;});
saveState();render();showToast('Αφαιρέθηκε κενή εμβόλιμη.');return;
}
}
showToast('Όλες οι εμβόλιμες έχουν καταγραφές.');
}
function rhToggleMakeup(){
state.settings.showMakeup=!state.settings.showMakeup;
saveState();render();
}
function rhCourseDel(id){
var c=state.courses.find(function(x){return x.id===id;});if(!c)return;
var mins=rhCourseLogged(id);
confirmModal('Διαγραφή','«'+c.name+'»'+(mins>0.01?' και '+fmtHM(mins)+' καταγραφές':'')+'. Οριστικό.',function(){
if(state.active&&state.active.type==='course'&&state.active.id===id)endSession(true);
state.courses=state.courses.filter(function(x){return x.id!==id;});
state.logs=state.logs.filter(function(l){return !(l.type==='course'&&l.id===id);});
if(state.schedule&&state.schedule.slots)state.schedule.slots=state.schedule.slots.filter(function(s){return s.activityId!=='course:'+id;});
saveState();closeModal();render();showToast('Διαγράφηκε.');
},'Διαγραφή');
}
function rhStudyEditor(id,prefill){
var c=id?state.courses.find(function(x){return x.id===id;}):null;
var d=c||{name:(prefill&&prefill.name)||'',short:'',hours:0,totalHours:0,type:'core',active:true,color:'#4f46e5',color2:'#7c3aed',examDate:''};
var mk=d.type==='makeup';
var act=!!d.active;
var catOpts=ACT_CATS.map(function(k){return '<option value="'+k.id+'"'+(k.id==='study'?' selected':'')+'>'+k.name+'</option>';}).join('');
var body='<div class="field"><label>Κατηγορία</label><select id="sCat">'+catOpts+'</select></div>'
+'<div class="field"><label>Όνομα μαθήματος</label><input id="sName" value="'+esc(d.name)+'" placeholder="π.χ. Κβαντική Μηχανική 1"></div>'
+'<div class="rh-two"><div class="field"><label>Σύντομο</label><input id="sShort" maxlength="2" value="'+esc(d.short||'')+'"></div>'
+'<div class="field"><label>Χρώμα</label><input id="sColor" type="color" value="'+d.color+'" style="width:100%;padding:4px;height:42px"></div></div>'
+'<div class="rh-two"><div class="field"><label>Εβδομαδιαίος στόχος (ώρες)</label><input id="sWeek" type="number" min="0" max="80" step="0.5" value="'+(d.hours||0)+'"></div>'
+'<div class="field"><label>Συνολικός στόχος (ώρες)</label><input id="sTotal" type="number" min="0" max="2000" step="1" value="'+(d.totalHours||0)+'"></div></div>'
+'<div class="field"><label>Ημερομηνία εξέτασης</label><input id="sExam" type="date" value="'+(d.examDate||'')+'"></div>'
+'<div class="setting-row"><div><strong>Εμβόλιμη</strong><span class="muted">Πάει στην υποκατηγορία εμβόλιμων, όχι στα κανονικά.</span></div><button type="button" id="sMk" class="switch '+(mk?'on':'')+'"></button></div>'
+'<div class="setting-row"><div><strong>Ενεργό</strong><span class="muted">Μετράει στους στόχους και στην εφικτότητα.</span></div><button type="button" id="sAct" class="switch '+(act?'on':'')+'"></button></div>'
+'<p class="note">Ο εβδομαδιαίος στόχος κρίνει την εβδομάδα. Ο συνολικός στόχος κρίνει όλο το εξάμηνο και δείχνει πόσο δρόμο έχεις ακόμη μέχρι την εξέταση.</p>'
+'<div id="sErr" class="form-error"></div>';
openModal({title:c?'Επεξεργασία μαθήματος':'Νέο μάθημα',body:body,buttons:[
{text:'Άκυρο',class:'btn-ghost'},
{text:'Αποθήκευση',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet'),err=sh.querySelector('#sErr');
var name=sh.querySelector('#sName').value.trim();
if(!name){err.textContent='Δώσε όνομα μαθήματος.';err.classList.add('show');return false;}
var wk=Math.max(0,parseFloat(sh.querySelector('#sWeek').value)||0);
var tot=Math.max(0,parseFloat(sh.querySelector('#sTotal').value)||0);
var col=sh.querySelector('#sColor').value;
var data={name:name,short:(sh.querySelector('#sShort').value.trim()||name.charAt(0)),hours:wk,totalHours:tot,examDate:sh.querySelector('#sExam').value||'',type:mk?'makeup':'core',active:act,color:col,color2:col,off:[]};
if(c){Object.assign(c,data);}
else{state.courses.push(Object.assign({id:'crs_'+Date.now()},data));}
saveState();closeModal();render();showToast('Αποθηκεύτηκε.');
}}],onMount:function(sh){
var b1=sh.querySelector('#sMk');b1.onclick=function(){mk=!mk;b1.classList.toggle('on',mk);};
var b2=sh.querySelector('#sAct');b2.onclick=function(){act=!act;b2.classList.toggle('on',act);};
sh.querySelector('#sCat').onchange=function(){
if(this.value==='study')return;
var nm=sh.querySelector('#sName').value.trim();
closeModal();
openFixedEditor(null);
setTimeout(function(){
var s2=document.querySelector('#modalOverlay .sheet');
if(!s2)return;
var n=s2.querySelector('#fName');if(n)n.value=nm;
var k=s2.querySelector('#fCat');if(k){k.value=this.value;}
}.bind(this),260);
};
}});
}
function rhStudyCard(c,i){
var info=courseInfo(c);
var isActive=state.active&&state.active.type==='course'&&state.active.id===c.id;
var other=state.active&&!isActive;
var wk=info.targetMin||0;
var wp=wk?clamp(info.weekMin/wk*100,0,100):0;
var tot=(c.totalHours||0)*60;
var done=totalMin('course',c.id,state.semesterStart||0,Date.now()+86400000);
var tp=tot?clamp(done/tot*100,0,100):0;
var ex='—',exSub='χωρίς ημερομηνία';
if(c.examDate){
var dd=Math.round((startOfDay(new Date(c.examDate+'T12:00:00').getTime())-startOfDay())/86400000);
if(dd>=0){ex=dd+' ημ.';exSub='έως την εξέταση';}else{ex='Πέρασε';exSub='η εξέταση';}
}
var sc='info',st='Εντός';
if(!c.active){sc='info';st='Ανενεργό';}
else if(wk&&info.weekMin>=wk-0.5){sc='success';st='Στόχος';}
else if(wp>=80){sc='warn';st='Οριακά';}
else if(c.examDate&&ex!=='Πέρασε'&&parseInt(ex,10)<=7){sc='danger';st='Κοντά εξέταση';}
var btn;
if(isActive)btn='<button class="btn btn-stop" onclick="stopActive()">Διακοπή</button>';
else if(other)btn='<button class="btn btn-primary" disabled>Τρέχει άλλο</button>';
else if(!c.active)btn='<button class="btn btn-primary" disabled>Ανενεργό</button>';
else btn='<button class="btn btn-primary" onclick="startCourse(\''+c.id+'\')">Έναρξη</button>';
return '<article class="card activity '+(isActive?'running':'')+'" style="--accent:'+c.color+';--accent2:'+(c.color2||c.color)+';animation-delay:'+(i*0.03)+'s">'
+'<div class="activity-head"><div class="icon">'+esc(c.short||c.name.charAt(0))+'</div>'
+'<div class="activity-title"><h3>'+esc(c.name)+'</h3><p class="muted">'+(c.type==='makeup'?'Εμβόλιμη · ':'')+(wk?fmtHM(wk)+' / εβδομάδα':'χωρίς εβδομαδιαίο στόχο')+'</p></div>'
+'<span class="pill '+sc+'">'+st+'</span></div>'
+'<div class="metrics">'
+'<div class="metric"><span>Εβδομάδα</span><strong>'+(wk?fmtHM(Math.max(0,wk-info.weekMin)):'—')+'</strong><div class="progress"><span style="width:'+wp+'%"></span></div><small>'+fmtHM(info.weekMin)+(wk?' / '+fmtHM(wk):'')+'</small></div>'
+'<div class="metric"><span>Συνολικός στόχος</span><strong>'+(tot?fmtHM(Math.max(0,tot-done)):'—')+'</strong><div class="progress '+(tot&&done>=tot?'':'')+'"><span style="width:'+tp+'%"></span></div><small>'+fmtHM(done)+(tot?' / '+fmtHM(tot)+' · '+Math.round(tp)+'%':' · χωρίς στόχο')+'</small></div>'
+'<div class="metric"><span>Εξέταση</span><strong>'+ex+'</strong><small>'+exSub+'</small></div>'
+'</div>'
+'<div class="actions">'+btn
+'<button class="btn btn-ghost" onclick="rhStudyEditor(\''+c.id+'\')">✎</button>'
+'<button class="btn btn-ghost-danger" onclick="rhCourseDel(\''+c.id+'\')">✕</button>'
+'</div></article>';
}
function renderActivities(){
var html='<div class="actions" style="margin:0 0 12px"><button class="btn btn-primary" onclick="openFixedEditor(null)">+ Νέα δραστηριότητα</button>'
+'<button class="btn btn-ghost" onclick="rhStudyEditor(null)">+ Νέο μάθημα</button></div>';
if(!FIXED_DEFS.length&&!state.courses.length){
html+='<div class="rh-empty">Καμία δραστηριότητα ακόμα. Φτιάξε μία και διάλεξε κατηγορία — τα μαθήματα πάνε στην κατηγορία «Μαθήματα».</div>';
}
ACT_CATS.forEach(function(cat){
if(cat.id==='study')return;
var list=FIXED_DEFS.filter(function(d){return (d.categoryId||'organize')===cat.id;});
if(!list.length)return;
html+='<div class="section-title" style="color:'+cat.color+'">'+cat.name+' <span class="muted" style="font-size:.78rem">· '+list.length+'</span></div>';
html+=list.map(function(d,i){return fixedCard(d,i);}).join('');
});
var core=state.courses.filter(function(c){return c.type!=='makeup';});
var mk=state.courses.filter(function(c){return c.type==='makeup';});
html+='<div class="rh-study-head"><span class="t" style="color:#4f46e5">Μαθήματα · '+core.length+'</span>'
+'<div class="ops"><button class="rh-icon-btn" onclick="rhStudyEditor(null)" aria-label="Νέο μάθημα">+</button></div></div>';
if(!core.length)html+='<div class="rh-empty">Δεν έχεις ορίσει μαθήματα. Πάτα + και όρισε εβδομαδιαίο και συνολικό στόχο.</div>';
else html+=core.map(function(c,i){return rhStudyCard(c,i);}).join('');
html+='<div class="rh-study-head"><span class="t" style="color:#0ea5e9">Εμβόλιμες · '+mk.length+'</span>'
+'<div class="ops"><button class="rh-icon-btn" onclick="rhMakeupTrim()" aria-label="Αφαίρεση κενής">−</button>'
+'<button class="rh-icon-btn" onclick="rhMakeupAdd()" aria-label="Προσθήκη">+</button></div></div>';
html+='<div class="rh-mk-bar"><div><strong>Εμφάνιση εμβόλιμων</strong><small>Δύο θέσεις από προεπιλογή. Πρόσθεσε όσες χρειάζεσαι.</small></div>'
+'<button class="switch '+(state.settings.showMakeup?'on':'')+'" onclick="rhToggleMakeup()"></button></div>';
if(state.settings.showMakeup){
if(!mk.length)html+='<div class="rh-empty">Καμία εμβόλιμη θέση. Πάτα + για να προσθέσεις.</div>';
else html+=mk.map(function(c,i){return rhStudyCard(c,i);}).join('');
}
html+='<div class="rh-study-head"><span class="t" style="color:#f59e0b">Μηνιαίες επιλογές</span>'
+'<div class="ops"><button class="rh-icon-btn" onclick="rhMonthlyEditor(null)" aria-label="Νέα μηνιαία">+</button></div></div>';
html+='<div class="card" id="rh-monthly-card">'+rhMonthlyInner()+'</div>';
return html;
}
function rhMonthlyInner(){
ensureMonth();
var h='';
if(!MONTHLY_DEFS.length)h+='<div class="rh-empty">Καμία μηνιαία επιλογή. Πάτα + για να ορίσεις π.χ. έξοδο ή σινεμά.</div>';
MONTHLY_DEFS.forEach(function(m){
var on=!!state.monthly.items[m.id];
h+='<div class="setting-row"><div><strong>'+esc(m.name)+'</strong><span class="muted">'+fmtHM((m.hours||0)*60)+'</span></div>'
+'<div style="display:flex;align-items:center;gap:6px">'
+'<button class="rh-icon-btn" onclick="rhMonthlyEditor(\''+m.id+'\')" aria-label="Επεξεργασία">✎</button>'
+'<button class="rh-icon-btn" onclick="rhMonthlyDel(\''+m.id+'\')" aria-label="Διαγραφή">✕</button>'
+'<button class="switch '+(on?'on':'')+'" onclick="toggleMonthly(\''+m.id+'\')"></button></div></div>';
});
var free=(typeof monthlyFreeMin==='function')?monthlyFreeMin():0;
h+='<div class="summary-grid" style="margin-top:10px"><div class="stat-box"><span>Επιλεγμένα</span><strong>'+fmtHM(selectedMonthlyMin())+'</strong></div>'
+'<div class="stat-box"><span>Διαθέσιμο μήνα</span><strong class="'+(free<0?'text-danger':'text-success')+'">'+fmtHM(free)+'</strong></div></div>';
return h;
}
function rhMonthlyEditor(id){
var m=id?MONTHLY_DEFS.find(function(x){return x.id===id;}):null;
var d=m||{name:'',hours:3};
var body='<div class="field"><label>Όνομα</label><input id="mName" value="'+esc(d.name)+'" placeholder="π.χ. Έξοδος, Σινεμά, Ταξίδι"></div>'
+'<div class="field"><label>Ώρες</label><input id="mHours" type="number" min="0.5" max="200" step="0.5" value="'+(d.hours||3)+'"></div>'
+'<div id="mErr" class="form-error"></div>';
openModal({title:m?'Επεξεργασία μηνιαίας':'Νέα μηνιαία επιλογή',body:body,buttons:[
{text:'Άκυρο',class:'btn-ghost'},
{text:'Αποθήκευση',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet'),err=sh.querySelector('#mErr');
var nm=sh.querySelector('#mName').value.trim();
var hr=parseFloat(sh.querySelector('#mHours').value)||0;
if(!nm){err.textContent='Δώσε όνομα.';err.classList.add('show');return false;}
if(hr<=0){err.textContent='Βάλε θετικό αριθμό ωρών.';err.classList.add('show');return false;}
if(m){m.name=nm;m.hours=hr;}
else{MONTHLY_DEFS.push({id:'mo_'+Date.now(),name:nm,hours:hr});}
saveState();closeModal();render();showToast('Αποθηκεύτηκε.');
}}]});
}
function rhMonthlyDel(id){
var m=MONTHLY_DEFS.find(function(x){return x.id===id;});if(!m)return;
confirmModal('Διαγραφή','«'+m.name+'»; Οριστικό.',function(){
var i=MONTHLY_DEFS.indexOf(m);
if(i>=0)MONTHLY_DEFS.splice(i,1);
if(state.monthly&&state.monthly.items)delete state.monthly.items[id];
saveState();closeModal();render();showToast('Διαγράφηκε.');
},'Διαγραφή');
}
function openFixedEditor(id){
var def=id?FIXED_DEFS.find(function(x){return x.id===id;}):null;
var d=def||{name:'',short:'',color:'#6366f1',color2:'#8b5cf6',daily:60,weekly:420,target:0,hard:false,timeRange:[8,22],desc:'',categoryId:'',healthAware:false};
var hard=!!d.hard,hw=!!d.healthAware,cat=d.categoryId||'';
var catOpts='<option value="">Αυτόματο από το όνομα</option>'+ACT_CATS.map(function(c){return '<option value="'+c.id+'"'+(cat===c.id?' selected':'')+'>'+c.name+'</option>';}).join('');
var body='<div class="field"><label>Όνομα</label><input id="fName" value="'+esc(d.name)+'"></div>'
+'<div class="field"><label>Κατηγορία</label><select id="fCat">'+catOpts+'</select></div>'
+'<div class="rh-two"><div class="field"><label>Σύντομο</label><input id="fShort" maxlength="2" value="'+esc(d.short)+'"></div>'
+'<div class="field"><label>Χρώμα</label><input id="fColor" type="color" value="'+d.color+'" style="width:100%;padding:4px;height:42px"></div></div>'
+'<div class="field"><label>Περιγραφή</label><input id="fDesc" value="'+esc(d.desc||'')+'"></div>'
+'<div class="rh-two"><div class="field"><label>Ημερήσιο όριο (λεπτά)</label><input id="fDaily" type="number" min="5" max="1440" step="5" value="'+d.daily+'"></div>'
+'<div class="field"><label>Εβδομαδιαίο όριο (λεπτά)</label><input id="fWeekly" type="number" min="5" max="10080" step="5" value="'+d.weekly+'"></div></div>'
+'<div class="field"><label>Στόχος φορές / εβδομάδα (0 = χωρίς)</label><input id="fTarget" type="number" min="0" max="21" step="1" value="'+(d.target||0)+'"></div>'
+'<div class="rh-two"><div class="field"><label>Ώρες από</label><input id="fFrom" type="number" min="0" max="24" step="1" value="'+d.timeRange[0]+'"></div>'
+'<div class="field"><label>Ώρες έως</label><input id="fTo" type="number" min="0" max="24" step="1" value="'+d.timeRange[1]+'"></div></div>'
+'<div class="setting-row"><div><strong>Σκληρό όριο</strong><span class="muted">Διακοπή καταγραφής στο όριο.</span></div><button id="fHardBtn" type="button" class="switch '+(hard?'on':'')+'"></button></div>'
+'<div class="setting-row"><div><strong>Ευεξία</strong><span class="muted">Ειδοποιήσεις ματιών και σηκώματος.</span></div><button id="fHealthBtn" type="button" class="switch '+(hw?'on':'')+'"></button></div>'
+'<div id="formError" class="form-error"></div>';
openModal({title:def?'Επεξεργασία δραστηριότητας':'Νέα δραστηριότητα',body:body,buttons:[
{text:'Άκυρο',class:'btn-ghost'},
{text:'Αποθήκευση',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet'),err=sh.querySelector('#formError');
var name=sh.querySelector('#fName').value.trim();
if(!name){err.textContent='Δώσε όνομα.';err.classList.add('show');return false;}
var daily=clamp(parseInt(sh.querySelector('#fDaily').value)||60,5,1440);
var weekly=clamp(parseInt(sh.querySelector('#fWeekly').value)||daily,5,10080);
var target=clamp(parseInt(sh.querySelector('#fTarget').value)||0,0,21);
var from=clamp(parseInt(sh.querySelector('#fFrom').value)||0,0,24);
var to=clamp(parseInt(sh.querySelector('#fTo').value)||24,0,24);if(to<=from)to=Math.min(24,from+1);
if(weekly<daily){err.textContent='Το εβδομαδιαίο όριο δεν γίνεται μικρότερο από το ημερήσιο.';err.classList.add('show');return false;}
var chosen=sh.querySelector('#fCat').value||catGuess(name);
var col=sh.querySelector('#fColor').value;
var data={name:name,short:(sh.querySelector('#fShort').value.trim()||name.charAt(0)),desc:sh.querySelector('#fDesc').value.trim(),color:col,color2:col,daily:daily,weekly:weekly,target:target,hard:hard,healthAware:hw,categoryId:chosen,timeRange:[from,to]};
if(def){Object.assign(def,data);}
else{FIXED_DEFS.push(Object.assign({id:'act_'+Date.now(),restorative:false,milestones:null},data));}
saveState();closeModal();render();showToast('Αποθηκεύτηκε.');
}}],onMount:function(sh){
var hb=sh.querySelector('#fHardBtn');hb.onclick=function(){hard=!hard;hb.classList.toggle('on',hard);};
var hwb=sh.querySelector('#fHealthBtn');hwb.onclick=function(){hw=!hw;hwb.classList.toggle('on',hw);};
sh.querySelector('#fCat').onchange=function(){
if(this.value!=='study')return;
var nm=sh.querySelector('#fName').value.trim();
closeModal();
setTimeout(function(){rhStudyEditor(null,{name:nm});},260);
};
}});
}
function rhStudyPass(){
var main=document.querySelector('main');if(!main)return;
var act=document.querySelector('.nav-btn.active');
if(!act||act.textContent.indexOf('Δραστηριότητες')<0)return;
var mine=document.getElementById('rh-monthly-card');
if(!mine)return;
Array.prototype.slice.call(main.querySelectorAll('.card')).forEach(function(c){
if(c===mine||c.contains(mine)||mine.contains(c))return;
var h=c.querySelector('h3');
if(h&&h.textContent.indexOf('Μηνιαίες επιλογές')>=0){
var prev=c.previousElementSibling;
if(prev&&prev.classList.contains('section-title')&&prev.textContent.indexOf('Μηνιαίες')>=0)prev.remove();
c.remove();
}
});
}
rhStudyInit();
if(!window.__rhStudy1){
window.__rhStudy1=true;
setInterval(rhStudyPass,1200);
}
render();
/* ===== ΤΕΛΟΣ ΜΑΘΗΜΑΤΩΝ v1 ===== */
</script>
