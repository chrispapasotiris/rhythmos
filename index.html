<script>
/* ===== ΠΡΟΓΡΑΜΜΑ v6: ΡΕΠΟ ΑΠΟ ΘΕΣΕΙΣ + ΑΚΡΙΒΕΣ 24ΩΡΟ ===== */
function schedulePlacedDays(courseId){
var days=[];
(state.schedule&&state.schedule.slots||[]).forEach(function(s){
if(s.activityId==='course:'+courseId&&days.indexOf(s.day)<0)days.push(s.day);
});
return days;
}
function scheduleDayMinutes(day){
var m=0;
(state.schedule&&state.schedule.slots||[]).forEach(function(s){
if(s.day===day){
var t=String(s.start).split(':').map(Number),e=String(s.end).split(':').map(Number);
m+=(e[0]*60+e[1])-(t[0]*60+t[1]);
}
});
return m;
}
function scheduleSlotCount(){return (state.schedule&&state.schedule.slots||[]).length;}
function budgetSnapshotExact(courses,fixedDefs,sleepHours){
  var slots=(state.schedule&&state.schedule.slots)||[];
  var scheduledFixed={};
  var scheduledCourse={};

  slots.forEach(function(s){
    if(!s||!s.activityId)return;
    var p=String(s.activityId).split(':');
    if(p[0]==='fixed')scheduledFixed[p.slice(1).join(':')]=1;
    else if(p[0]==='course')scheduledCourse[p.slice(1).join(':')]=1;
  });

  var unscheduledFixedW=0;
  fixedDefs.forEach(function(d){
    if(!scheduledFixed[d.id])unscheduledFixedW+=(d.weekly||0);
  });

  var unscheduledCourses=[];
  courses.forEach(function(c){
    if(c&&c.active&&c.hours>0&&!scheduledCourse[c.id]){
      var off=Array.isArray(c.off)?c.off:[];
      var activeDays=Math.max(1,7-off.length);
      unscheduledCourses.push({
        id:c.id,
        hoursMin:c.hours*60,
        off:off,
        per:c.hours*60/activeDays
      });
    }
  });

  var scheduledW=0;
  var daysSlot=[0,0,0,0,0,0,0];
  var todayIdx=(typeof mondayIndex==='function')?mondayIndex():0;

  slots.forEach(function(s){
    if(!s)return;
    var st,en;

    if(s.day===todayIdx && typeof slotEff==='function'){
      var eff=slotEff(s);
      st=eff.start;
      en=eff.end;
    }else{
      st=s.start;
      en=s.end;
    }

    var t=String(st||'0:0').split(':').map(Number);
    var e=String(en||'0:0').split(':').map(Number);
    var m=(e[0]*60+(e[1]||0))-(t[0]*60+(t[1]||0));

    if(m>0){
      scheduledW+=m;
      if(s.day>=0&&s.day<7)daysSlot[s.day]+=m;
    }
  });

  var unscheduledCourseW=0;
  var unscheduledCourseDay=[0,0,0,0,0,0,0];

  unscheduledCourses.forEach(function(c){
    unscheduledCourseW+=c.hoursMin;
    for(var d=0;d<7;d++){
      if(c.off.indexOf(d)<0)unscheduledCourseDay[d]+=c.per;
    }
  });

  var plannedW=scheduledW+unscheduledFixedW+unscheduledCourseW;

  var actualSleepToday=(typeof sleepTodayMin==='function')?sleepTodayMin():(sleepHours*60);
  var weeklySleep=sleepHours*7*60+(actualSleepToday-sleepHours*60);
  var weekRem=10080-weeklySleep-plannedW;

  var days=[];
  for(var d=0;d<7;d++){
    var sleepD=(d===todayIdx?actualSleepToday:sleepHours*60);
    var loadD=daysSlot[d]+unscheduledFixedW/7+unscheduledCourseDay[d];
    days.push(1440-sleepD-loadD);
  }

  return {
    weekRem:weekRem,
    days:days,
    sleepW:weeklySleep,
    plannedW:plannedW
  };
}

var main=document.querySelector('main');

if(label.indexOf('Δραστηριότητες')<0)return;

if(!c.active||!c.hours)return;
if(schedulePlacedDays(c.id).length>0)return;
main.querySelectorAll('article.card').forEach(function(card){
var h=card.querySelector('.activity-title h3');
if(!h||h.textContent.trim()!==c.name)return;
if(card.querySelector('.unplaced-badge'))return;
var t=card.querySelector('.activity-title');
if(t)t.insertAdjacentHTML('beforeend',' <span class="badge warn unplaced-badge">Ατοποθέτητο</span>');

<script>
/* ===== ΠΡΟΓΡΑΜΜΑ v8: ΑΝΑΒΟΛΗ + ΚΛΕΙΣΙΜΟ + ΥΠΕΡΒΑΣΗ ===== */
state.slotStatus=state.slotStatus||{};
state.slotRunning=state.slotRunning||null;

function slotDateKey(){return getDailyPlanKey();}
function slotStatusGet(id){
  var k=slotDateKey();
  return (state.slotStatus[k]&&state.slotStatus[k][id])||null;
}
function slotStatusSet(id,patch){
  var k=slotDateKey();
  if(!state.slotStatus[k])state.slotStatus[k]={};
  var cur=state.slotStatus[k][id]||{};
  for(var key in patch){
    if(patch.hasOwnProperty(key))cur[key]=patch[key];
  }
  state.slotStatus[k][id]=cur;
  saveState();
}
function slotParseHM(v){
  var p=String(v||'0:0').split(':');
  var h=parseInt(p[0],10)||0;
  var m=parseInt(p[1],10)||0;
  return h*60+m;
}
function slotFmtHM(min){
  min=Math.max(0,Math.min(1439,Math.round(min)));
  var h=Math.floor(min/60),m=min%60;
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
}
function slotNowMin(){
  var d=new Date();
  return d.getHours()*60+d.getMinutes();
}
function slotEff(s){
  var st=slotStatusGet(s.id)||{};
  return {
    start:st.start||s.start,
    end:st.end||s.end,
    count:st.postponeCount||0,
    status:st.status||'pending',
    overtime:!!st.overtime,
    startedAt:st.startedAt||0,
    lastAsk:st.lastAsk||0
  };
}
function slotName(s){return scheduleActivityName(s.activityId);}
function slotActivityParts(s){
  var p=String(s.activityId).split(':');
  return {type:p[0],id:p.slice(1).join(':')};
}
function slotRunningInfo(){
  if(!state.slotRunning)return null;
  var s=scheduleFind(state.slotRunning.slotId);
  if(!s){state.slotRunning=null;return null;}
  var st=slotStatusGet(s.id);
  if(!st||(st.status!=='accepted'&&st.status!=='late')){
    state.slotRunning=null;
    return null;
  }
  return {s:s,st:st,eff:slotEff(s)};
}
function slotMarkDone(slotId,source){
  var s=scheduleFind(slotId);
  if(!s)return;
  var st=slotStatusGet(slotId);
  if(!st||st.status==='done'||st.status==='skipped')return;

  var running=state.slotRunning&&state.slotRunning.slotId===slotId?state.slotRunning:null;
  var end=Date.now();
  var start=running?running.start:(st.startedAt||end);
  var dur=0;

  try{
    if(running&&typeof totalMin==='function'){
      dur=totalMin(running.type,running.id,start,end);
    }else{
      dur=Math.max(0,Math.round((end-start)/60000));
    }
  }catch(e){
    dur=Math.max(0,Math.round((end-start)/60000));
  }

  slotStatusSet(slotId,{
    status:'done',
    endedAt:end,
    actualDurMin:Math.round(dur),
    overtime:false,
    lastAsk:0
  });

  if(state.slotRunning&&state.slotRunning.slotId===slotId)state.slotRunning=null;
  saveState();
  if(source!=='silent')render();
}
function slotAccept(s){
  if(state.slotRunning){
    showToast('Τρέχει ήδη θέση. Ολοκλήρωσέ την πρώτα.');
    return;
  }

  var now=slotNowMin();
  var eff=slotEff(s);
  var late=now>slotParseHM(eff.start);
  var parts=slotActivityParts(s);

  slotStatusSet(s.id,{
    status:late?'late':'accepted',
    startedAt:Date.now(),
    endedAt:0,
    actualDurMin:0,
    overtime:false,
    lastAsk:0
  });

  state.slotRunning={
    slotId:s.id,
    type:parts.type,
    id:parts.id,
    start:Date.now()
  };

  closeModal();

  if(parts.type==='course'){
    if(typeof pomoSel!=='undefined')pomoSel={type:'course',id:parts.id};
    if(typeof startPomodoro==='function')startPomodoro();
    else if(typeof openPomodoroSetup==='function')openPomodoroSetup();
  }else if(parts.type==='fixed'){
    if(typeof doStart==='function')doStart('fixed',parts.id);
  }

  saveState();
  render();
}
function slotDecline(s){
  slotStatusSet(s.id,{status:'skipped',lastAsk:0});
  if(state.slotRunning&&state.slotRunning.slotId===s.id)state.slotRunning=null;
  closeModal();
  showToast('Απορρίφθηκε: '+slotName(s));
  render();
}
function slotPostpone15(s){
  var st=slotStatusGet(s.id)||{};
  var count=st.postponeCount||0;
  if(count>=7){
    showToast('Όριο αναβολών +15λ εξαντλήθηκε.');
    return;
  }

  var eff=slotEff(s);
  var sm=slotParseHM(eff.start);
  var em=slotParseHM(eff.end);

   if(st.status==='accepted'||st.status==='late'){
    var newEnd=Math.min(1439,em+15);
    if(scheduleSleepBlocked(scheduleCurDay,eff.start,slotFmtHM(newEnd))){
      showToast('Η αναβολή θα έπεφτε μέσα στο πρότυπο ύπνου.');
      return;
    }
    slotStatusSet(s.id,{
      end:slotFmtHM(newEnd),
      postponeCount:count+1,
      overtime:false,
      lastAsk:Date.now()
    });
    showToast('Νέα λήξη: '+slotFmtHM(newEnd)+'.');
  }else{
    var newStart=Math.min(1438,sm+15);
    var newEnd=Math.min(1439,Math.max(newStart+1,em+15));
    if(scheduleSleepBlocked(scheduleCurDay,slotFmtHM(newStart),slotFmtHM(newEnd))){
      showToast('Η αναβολή θα έπεφτε μέσα στο πρότυπο ύπνου.');
      return;
    }
    slotStatusSet(s.id,{
      status:'pending',
      start:slotFmtHM(newStart),
      end:slotFmtHM(newEnd),
      postponeCount:count+1,
      lastAsk:0
    });

    var eff=slotEff(s);
    var sm=slotParseHM(eff.start);

function slotLatePending(){

function slotTick(){
  if(modalOpen)return;

  var ov=document.getElementById('focusOverlay');
  if(ov&&!ov.classList.contains('hidden'))return;

  if(state.sleep&&state.sleep.asleep)return;

  if(state.slotRunning&&!scheduleFind(state.slotRunning.slotId)){
    state.slotRunning=null;
  }

  if(state.slotRunning){
    var hasActive=!!state.active;
    var hasPomo=false;
    try{hasPomo=typeof P==='function'&&!!P().phase;}catch(e){}
    if(!hasActive&&!hasPomo&&Date.now()-state.slotRunning.start>5*60000){
      slotStatusSet(state.slotRunning.slotId,{status:'skipped',lastAsk:0});state.slotRunning=null;saveState();
    }
  }

  var now=slotNowMin();
  var list=scheduleGetDay(mondayIndex());
  var changed=false;

  for(var i=0;i<list.length;i++){
    var s=list[i];
    var st=slotStatusGet(s.id)||{};
    var eff=slotEff(s);
    var sm=slotParseHM(eff.start);
    var em=slotParseHM(eff.end);

    if(st.status==='done'||st.status==='skipped')continue;

    if(!st.status||st.status==='pending'){
      if(now>=em){
        slotStatusSet(s.id,{status:'skipped',lastAsk:0});
        changed=true;
        continue;
      }

      if(now>=sm-5){
        var lastPending=st.lastAsk||0;
        if(Date.now()-lastPending>5*60000){
          slotAskPending(s);
          return;
        }
      }
    }else if(st.status==='accepted'||st.status==='late'){
      if(now>=em-5){
        var lastDone=st.lastAsk||0;
        var interval=st.overtime?15*60000:5*60000;
        if(Date.now()-lastDone>interval){
          slotAskCompletion(s);
          return;
        }
      }
    }
  }

  if(changed)render();
  slotUpdateOvertimeUI();
}

}

<script>
/* ===== ΗΧΟΣ v4: ΑΝΘΕΚΤΙΚΟ SEEK + ΕΠΑΝΑΣΥΝΔΕΣΗ ΤΟΠΙΚΩΝ + ΜΟΝΙΜΗ ΑΠΟΘΗΚΕΥΣΗ ===== */
var audDragging=false;
var audIsSeeking=false;
var audSeekPending=null;
var audPlayToken=0;
var audStallTimer=0;
var audRecoverAttempts=0;
var audCurrentObjectURL=null;
var AUD_RELINK_INPUT=null;
var audPersistRequested=false;

function audFmtTime(s){
  s=Math.floor(Number(s)||0);
  if(s<0)s=0;
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function audHasDuration(){
  return AUD_EL.duration && !isNaN(AUD_EL.duration) && AUD_EL.duration>0;
}
function audPctToSec(pct){
  pct=parseFloat(pct);
  if(isNaN(pct)||!audHasDuration())return 0;
  return Math.max(0,Math.min(AUD_EL.duration,(pct/100)*AUD_EL.duration));
}
function audSecToPct(sec){
  if(!audHasDuration())return 0;
  return Math.max(0,Math.min(100,((Number(sec)||0)/AUD_EL.duration)*100));
}
function audSetSeekLabel(sec){
  var cur=document.getElementById('audCur');
  if(cur)cur.textContent=audFmtTime(sec);
}
function audSetDurLabel(){
  var dur=document.getElementById('audDur');
  if(dur)dur.textContent=audFmtTime(AUD_EL.duration||0);
}
function audUpdateSeek(){
  if(audDragging)return;
  var el=document.getElementById('audSeek');
  if(!el)return;
  if(!audHasDuration()){
    el.value=0;
    audSetSeekLabel(0);
    audSetDurLabel();
    return;
  }
  el.value=audSecToPct(AUD_EL.currentTime);
  audSetSeekLabel(AUD_EL.currentTime);
  audSetDurLabel();
}
function audClearStall(){
  clearTimeout(audStallTimer);
  audStallTimer=0;
}
function audArmStall(token){
  audClearStall();
  audStallTimer=setTimeout(function(){
    if(token!==audPlayToken)return;
    if(state.audio.playing && AUD_EL.paused){
      audRecover();
    }
  },2200);
}
function audRevokeCurrentObjectURL(){
  if(audCurrentObjectURL){
    try{URL.revokeObjectURL(audCurrentObjectURL);}catch(e){}
    audCurrentObjectURL=null;
  }
}
function audRequestPersist(){
  if(audPersistRequested)return;
  audPersistRequested=true;
  try{
    if(navigator.storage && navigator.storage.persisted && navigator.storage.persist){
      navigator.storage.persisted().then(function(p){
        if(!p){
          navigator.storage.persist().catch(function(){});
        }
      }).catch(function(){});
    }
  }catch(e){}
}
audRequestPersist();

function audRecover(){
  if(audRecoverAttempts>2){
    audRecoverAttempts=0;
    var tr0=audFindTrack();
    if(tr0){
      state.audio.playing=false;
      saveState();
      audPlayTrack(state.audio.curCat,tr0,false);
    }
    return;
  }
  audRecoverAttempts++;

  var token=++audPlayToken;
  var wasPlaying=state.audio.playing;
  var t=AUD_EL.currentTime;
  var url=AUD_EL.currentSrc || audCurrentObjectURL;

  audIsSeeking=false;
  audSeekPending=null;
  audClearStall();

  try{AUD_EL.pause();}catch(e){}

  if(!url){
    var tr=audFindTrack();
    if(tr){
      state.audio.playing=wasPlaying;
      audPlayTrack(state.audio.curCat,tr,true);
    }
    return;
  }

  AUD_EL.src=url;
  try{AUD_EL.load();}catch(e){}

  function restore(){
    if(token!==audPlayToken)return;
    if(state.audio.curTrack!==audFindTrack()?.id && audFindTrack()){
      // αποφυγή κατάστασης όπου το track άλλαξε κατά τη恢复
    }
    if(t>0 && audHasDuration() && t<AUD_EL.duration){
      try{AUD_EL.currentTime=t;}catch(e){}
    }
    if(wasPlaying){
      AUD_EL.play().then(function(){
        if(token===audPlayToken){
          state.audio.playing=true;
          saveState();
          audInject();
          audClearStall();
          audRecoverAttempts=0;
          if(typeof audSetPlayback==='function')audSetPlayback('playing');
        }
      }).catch(function(){
        if(token===audPlayToken){
          state.audio.playing=false;
          saveState();
          audInject();
          if(typeof audSetPlayback==='function')audSetPlayback('paused');
          var tr=audFindTrack();
          if(tr && tr.kind==='local')audOfferRelink(state.audio.curCat,tr.id);
        }
      });
      audArmStall(token);
    }
  }

  if(AUD_EL.readyState>=3)restore();
  else AUD_EL.addEventListener('canplay',restore,{once:true});
}

function audDoSeek(sec){
  if(!audHasDuration())return;
  sec=Math.max(0,Math.min(AUD_EL.duration-0.02,Number(sec)||0));

  if(audIsSeeking){
    audSeekPending=sec;
    audSetSeekLabel(sec);
    return;
  }

  audIsSeeking=true;
  var token=++audPlayToken;
  audSetSeekLabel(sec);

  try{AUD_EL.currentTime=sec;}catch(e){audIsSeeking=false;}

  function onSeeked(){
    audIsSeeking=false;

    if(audSeekPending!=null){
      var p=audSeekPending;
      audSeekPending=null;
      audDoSeek(p);
      return;
    }

    if(state.audio.playing){
      AUD_EL.play().then(function(){
        if(token===audPlayToken){
          audClearStall();
          audRecoverAttempts=0;
          if(typeof audSetPlayback==='function')audSetPlayback('playing');
        }
      }).catch(function(e){
        if(token!==audPlayToken)return;
        if(e && e.name==='AbortError'){
          setTimeout(function(){
            if(state.audio.playing){
              AUD_EL.play().then(function(){
                audClearStall();
                audRecoverAttempts=0;
                if(typeof audSetPlayback==='function')audSetPlayback('playing');
              }).catch(function(){
                audRecover();
              });
            }
          },120);
        }else{
          audRecover();
        }
      });
      audArmStall(token);
    }else{
      audClearStall();
      if(typeof audSetPlayback==='function')audSetPlayback('paused');
    }
  }

  if(AUD_EL.seeking){
    AUD_EL.addEventListener('seeked',onSeeked,{once:true});
  }else{
    setTimeout(onSeeked,0);
  }
}

function audSeekSeconds(sec){
  if(!audHasDuration()){
    var tr=audFindTrack();
    if(tr){
      state.audio.playing=true;
      saveState();
      audPlayTrack(state.audio.curCat,tr,true);
    }
    return;
  }
  audDoSeek(sec);
}

function audDragSeek(pct){
  audDragging=true;
  var sec=audPctToSec(pct);
  audSetSeekLabel(sec);
  var el=document.getElementById('audSeek');
  if(el)el.value=pct;
}

function audReleaseSeek(pct){
  audDragging=false;
  var sec=audPctToSec(pct);
  if(audHasDuration())audDoSeek(sec);
  else audSeekSeconds(sec);
}

function audStartUrl(url,tr,catId,prevTime){
  var a=state.audio;
  AUD_EL.src=url;
  AUD_EL.volume=a.volume;
  AUD_EL.loop=a.loop;

  var started=false;
  function start(){
    if(started)return;
    started=true;

    if(state.audio.curTrack!==tr.id || state.audio.curCat!==catId)return;

    if(prevTime>0 && audHasDuration() && prevTime<AUD_EL.duration){
      try{AUD_EL.currentTime=prevTime;}catch(e){}
    }

    if(!state.audio.playing){
      saveState();
      audInject();
      return;
    }

    var token=++audPlayToken;
    AUD_EL.play().then(function(){
      if(token===audPlayToken){
        state.audio.playing=true;
        saveState();
        audInject();
        audClearStall();
        audRecoverAttempts=0;
        if(typeof audSetPlayback==='function')audSetPlayback('playing');
      }
    }).catch(function(e){
      if(token!==audPlayToken)return;
      if(e && e.name==='AbortError'){
        setTimeout(function(){
          if(state.audio.playing){
            AUD_EL.play().then(function(){
              audClearStall();
              audRecoverAttempts=0;
              if(typeof audSetPlayback==='function')audSetPlayback('playing');
            }).catch(function(){
              audRecover();
            });
          }
        },120);
      }else{
        state.audio.playing=false;
        saveState();
        audInject();
        if(typeof audSetPlayback==='function')audSetPlayback('paused');
        if(tr && tr.kind==='local')audOfferRelink(catId,tr.id);
        else audRecover();
      }
    });
    audArmStall(token);
  }

  if(AUD_EL.readyState>=3)start();
  else AUD_EL.addEventListener('canplay',start,{once:true});

  saveState();
  audInject();
  audSetMedia(tr,catId);
}

function audOfferRelink(catId,trId){
  var c=state.audio.categories.find(function(x){return x.id===catId;});
  if(!c)return;
  var t=c.tracks.find(function(x){return x.id===trId;});
  if(!t)return;
  if(confirm('Το τοπικό αρχείο "'+t.name+'" δεν βρέθηκε στη συσκευή. Επανασύνδεση;')){
    audRelinkPrompt(catId,trId);
  }
}
function audRelinkPrompt(catId,trId){
  if(!AUD_RELINK_INPUT){
    AUD_RELINK_INPUT=document.createElement('input');
    AUD_RELINK_INPUT.type='file';
    AUD_RELINK_INPUT.accept='audio/*';
    AUD_RELINK_INPUT.style.display='none';
    document.body.appendChild(AUD_RELINK_INPUT);
    AUD_RELINK_INPUT.onchange=function(){
      var file=AUD_RELINK_INPUT.files && AUD_RELINK_INPUT.files[0];
      var cId=AUD_RELINK_INPUT.dataset.cat;
      var tId=AUD_RELINK_INPUT.dataset.track;
      AUD_RELINK_INPUT.value='';
      if(!file||!cId||!tId)return;

      var c=state.audio.categories.find(function(x){return x.id===cId;});
      if(!c)return;
      var t=c.tracks.find(function(x){return x.id===tId;});
      if(!t)return;
      if(!t.key){
        showToast('Το αρχείο δεν έχει έγκυρο κλειδί αποθήκευσης. Διαγραφή και επαναπροσθήκη είναι αναγκαία.');
        return;
      }

      audPut(t.key,file).then(function(){
        showToast('Επανασυνδέθηκε: '+t.name);
        audRequestPersist();
        if(state.audio.curTrack===t.id){
          if(state.audio.playing){
            audPlayTrack(cId,t,true);
          }else{
            audInject();
          }
        }
        if(typeof modalOpen!=='undefined' && modalOpen){
          audReopen(function(){openCategorySheet(cId);});
        }
      }).catch(function(){
        showToast('Αποτυχία επανασύνδεσης του αρχείου. Ίσως ο χώρος αποθήκευσης είναι πλήρης.');
      });
    };
  }
  AUD_RELINK_INPUT.dataset.cat=catId;
  AUD_RELINK_INPUT.dataset.track=trId;
  AUD_RELINK_INPUT.click();
}

var _apM7=audPlayTrack;
audPlayTrack=function(catId,tr,preserveTime){
  if(!tr){
    _apM7(catId,tr);
    return;
  }

  var a=state.audio;
  if(a.volume<=0)a.volume=0.7;
  a.curCat=catId;
  a.curTrack=tr.id;
  a.playing=true;

  try{AUD_EL.pause();}catch(e){}

  var prevTime=preserveTime?(AUD_EL.currentTime||0):0;
  audRevokeCurrentObjectURL();
  audRequestPersist();

  if(tr.kind==='local'){
    if(!tr.key){
      a.playing=false;
      saveState();
      audInject();
      showToast('Το τοπικό αρχείο δεν έχει έγκυρο κλειδί αποθήκευσης.');
      return;
    }
    audGet(tr.key).then(function(b){
      if(state.audio.curTrack!==tr.id || state.audio.curCat!==catId)return;
      if(!b){
        a.playing=false;
        saveState();
        audInject();
        audOfferRelink(catId,tr.id);
        return;
      }
      var u;
      try{u=URL.createObjectURL(b);}catch(e){
        a.playing=false;
        saveState();
        audInject();
        audOfferRelink(catId,tr.id);
        return;
      }
      audCurrentObjectURL=u;
      audStartUrl(u,tr,catId,prevTime);
    }).catch(function(){
      if(state.audio.curTrack!==tr.id || state.audio.curCat!==catId)return;
      a.playing=false;
      saveState();
      audInject();
      audOfferRelink(catId,tr.id);
    });
    return;
  }

  if(tr.kind==='noise'){
    if(!AUD_WAV[tr.id]){
      AUD_WAV[tr.id]=URL.createObjectURL(makeNoiseWav(tr.id));
    }
    audStartUrl(AUD_WAV[tr.id],tr,catId,prevTime);
    return;
  }

  audStartUrl(tr.url,tr,catId,prevTime);
};

var _atM5=audToggle;
audToggle=function(){
  var a=state.audio;

  if(!a.playing){
    var t=audFindTrack();
    if(!t){
      if(a.categories.length && a.categories[0].tracks.length){
        t=a.categories[0].tracks[0];
        a.curCat=a.categories[0].id;
      }else{
        openAudioSheet();
        return;
      }
    }

    a.playing=true;
    saveState();

    if(AUD_EL.error || !AUD_EL.currentSrc || AUD_EL.readyState<2){
      audPlayTrack(a.curCat,t,true);
    }else{
      var token=++audPlayToken;
      AUD_EL.play().then(function(){
        if(token===audPlayToken){
          audClearStall();
          audRecoverAttempts=0;
          if(typeof audSetPlayback==='function')audSetPlayback('playing');
        }
      }).catch(function(e){
        if(token!==audPlayToken)return;
        if(e && e.name==='AbortError'){
          setTimeout(function(){
            if(state.audio.playing){
              AUD_EL.play().then(function(){
                audClearStall();
                audRecoverAttempts=0;
                if(typeof audSetPlayback==='function')audSetPlayback('playing');
              }).catch(function(){
                audRecover();
              });
            }
          },120);
        }else{
          audRecover();
        }
      });
      audArmStall(token);
    }
  }else{
    a.playing=false;
    audClearStall();
    try{AUD_EL.pause();}catch(e){}
    saveState();
    if(typeof audSetPlayback==='function')audSetPlayback('paused');
  }

  audInject();
};

audSetMedia=function(tr,catId){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:tr.name,
      artist:audCatName(catId),
      album:'Ρυθμός'
    });
    navigator.mediaSession.playbackState=state.audio.playing?'playing':'paused';

    navigator.mediaSession.setActionHandler('play',function(){
      if(!state.audio.playing)audToggle();
    });
    navigator.mediaSession.setActionHandler('pause',function(){
      if(state.audio.playing)audToggle();
    });
    navigator.mediaSession.setActionHandler('previoustrack',function(){
      audPrev();
    });
    navigator.mediaSession.setActionHandler('nexttrack',function(){
      audNext();
    });
    navigator.mediaSession.setActionHandler('seekto',function(d){
      if(d && d.seekTime!=null){
        state.audio.playing=true;
        saveState();
        audSeekSeconds(d.seekTime);
        audInject();
        if(typeof audSetPlayback==='function')audSetPlayback('playing');
      }
    });
    navigator.mediaSession.setActionHandler('seekbackward',function(d){
      var o=(d && d.seekOffset)||10;
      state.audio.playing=true;
      saveState();
      audSeekSeconds((AUD_EL.currentTime||0)-o);
      audInject();
      if(typeof audSetPlayback==='function')audSetPlayback('playing');
    });
    navigator.mediaSession.setActionHandler('seekforward',function(d){
      var o=(d && d.seekOffset)||10;
      state.audio.playing=true;
      saveState();
      audSeekSeconds((AUD_EL.currentTime||0)+o);
      audInject();
      if(typeof audSetPlayback==='function')audSetPlayback('playing');
    });
  }catch(e){}
};

var _asa5=audStopAll;
audStopAll=function(){

if(!window.__audV4Bound){

  AUD_EL.addEventListener('playing',function(){

    audRecoverAttempts=0;
    if(typeof audSetPlayback==='function')audSetPlayback('playing');
  });
  AUD_EL.addEventListener('pause',function(){
    if(!audIsSeeking && typeof audSetPlayback==='function'){

<script>

function notifBadgeUpdate(){

<script>
/* ===== UNDO v1 ===== */
var undoStack=null;
function undoShow(msg){
  var t=document.getElementById('undoToast');
  if(!t){
    t=document.createElement('div');
    t.id='undoToast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--toast-bg);color:var(--toast-text);padding:10px 14px;border-radius:16px;font-size:.84rem;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:202;display:flex;align-items:center;gap:12px;max-width:92%;box-shadow:0 12px 30px rgba(0,0,0,.25)';
    document.body.appendChild(t);
  }
  t.innerHTML='<span style="pointer-events:none">'+esc(msg)+'</span><button class="btn btn-ghost" style="pointer-events:auto;flex:0 0 auto;padding:6px 12px" onclick="undoPerform()">Αναίρεση</button>';
  t.style.opacity='1';
  t.style.pointerEvents='auto';
  t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(undoShow._tm);
  undoShow._tm=setTimeout(function(){
    undoStack=null;
    t.style.opacity='0';
    t.style.pointerEvents='none';
    t.style.transform='translateX(-50%) translateY(20px)';
  },5000);
}
function undoPerform(){
  var u=undoStack;
  if(!u)return;
  undoStack=null;
  if(u.kind==='log'){
    state.logs.splice(Math.min(u.index,state.logs.length),0,u.log);
    }else if(u.kind==='fixed'){
    FIXED_DEFS.splice(Math.min(u.index,FIXED_DEFS.length),0,u.def);
    state.logs=state.logs.concat(u.logs);
    state.logs.sort(function(a,b){return a.start-b.start;});
    if(u.slots&&u.slots.length){
      if(!state.schedule)state.schedule={slots:[],status:{}};
      if(!state.schedule.slots)state.schedule.slots=[];
      state.schedule.slots=state.schedule.slots.concat(u.slots);
    }
  }
  saveState();
  render();
  var t=document.getElementById('undoToast');
  if(t){
    t.style.opacity='0';
    t.style.pointerEvents='none';
    t.style.transform='translateX(-50%) translateY(20px)';
    clearTimeout(undoShow._tm);
  }
  showToast('Ανααιρέθηκε.');
}
/* ===== ΤΕΛΟΣ UNDO v1 ===== */
</script>

<script>
/* ===== PAUSE v1 ===== */
function togglePause(){
  if(!state.active)return;
  if(state.healthBreak){healthBreakEnd();return;}
  const a=state.active;
  if(a.pausedAt){
    const pausedMs=Date.now()-a.pausedAt;
    a.start+=pausedMs;
    const resetMin=clamp(parseInt((state.health&&state.health.pauseResetMin)||3,10),1,60);
    if(pausedMs>=resetMin*60000){
      a.healthStart=Date.now();
      if(typeof healthResync==='function')healthResync();
    }
    a.pausedAt=null;
    showToast('Συνέχισε.');
  }else{
    a.pausedAt=Date.now();
    showToast('Παύση.');
  }
  saveState();
  render();
}

<script>
/* ===== ΥΓΕΙΑ v3: ΕΙΔΟΠΟΙΗΣΗ ΜΕ ΕΠΙΛΟΓΗ + ΔΙΑΛΕΙΜΜΑ ΧΩΡΙΣ ΚΛΕΙΔΩΜΑ ===== */
var EYE_MIN=30;
var STAND_MIN=60;
var EYE_BREAK_MIN=3;
var STAND_BREAK_MIN=5;
var HEALTH_NONE=999999;

state.health=state.health||{};
state.healthBreak=state.healthBreak||null;

function healthEnsure(){
  var h=state.health;
  h.eyeEnabled=!!h.eyeEnabled;
  h.standEnabled=!!h.standEnabled;
  if(typeof h.nextEye!=='number'||h.nextEye<=0)h.nextEye=HEALTH_NONE;
  if(typeof h.nextStand!=='number'||h.nextStand<=0)h.nextStand=HEALTH_NONE;
}

function healthApplies(){
  if(!state.active)return false;
  if(state.active.type==='course')return true;
  var d=FIXED_DEFS.find(function(x){return x.id===state.active.id;});
  return !!(d&&(d.id==='reading'||d.id==='school'));
}

function healthResetThresholds(){
  healthEnsure();
  var h=state.health;
  h.nextEye=h.eyeEnabled?EYE_MIN:HEALTH_NONE;
  h.nextStand=h.standEnabled?STAND_MIN:HEALTH_NONE;
}

function healthClear(){
  healthEnsure();
  state.health.nextEye=HEALTH_NONE;
  state.health.nextStand=HEALTH_NONE;
  state.healthBreak=null;
  var bar=document.getElementById('healthBreakBar');
  if(bar)bar.classList.remove('on');
}

function healthElapsedMin(){
  if(!state.active)return 0;
  var a=state.active;
  var base=a.healthStart||a.start;
  var ref=a.pausedAt||Date.now();
  return Math.max(0,Math.floor((ref-base)/60000));
}

function healthResync(){
  healthEnsure();
  var h=state.health;
  var e=healthElapsedMin();
  h.nextEye=h.eyeEnabled?(Math.floor(e/EYE_MIN)+1)*EYE_MIN:HEALTH_NONE;
  h.nextStand=h.standEnabled?(Math.floor(e/STAND_MIN)+1)*STAND_MIN:HEALTH_NONE;
}

function healthOffer(kind){
  var title=kind==='eye'?'Ξεκούραση ματιών':'Ώρα να σηκωθείς';
  var message=kind==='eye'
    ?'30′ συνεχούς εργασίας. Κοίτα 6 μέτρα μακριά για '+EYE_BREAK_MIN+' λεπτά.'
    :'60′ συνεχούς εργασίας. Σηκώσου, τεντώσου και περπάτα για '+STAND_BREAK_MIN+' λεπτά.';
  if(typeof notifTrim==='function'){
    state.notifs.unshift({id:'n'+Date.now()+'_'+Math.floor(Math.random()*100000),title:title,message:message,ts:Date.now(),read:false});
    notifTrim();saveState();
    if(typeof notifBadgeUpdate==='function')notifBadgeUpdate();
  }
  pushAlert({
    title:title,message:message,sticky:true,
    buttons:[
      {text:'Αποδοχή — διάλειμμα',class:'btn-success',onClick:function(){healthBreakStart(kind);}},
      {text:'Απόρριψη — συνέχεια',class:'btn-ghost',onClick:function(){showToast('Συνέχεια εργασίας.');}}
    ]
  });
}

function healthBreakStart(kind){
  if(!state.active){showToast('Δεν τρέχει συνεδρία.');return;}
  var now=Date.now();
  var pomo=false;
  try{var p=P();if(p.phase&&p.phaseEndsAt>now)pomo=true;}catch(e){}
  state.healthBreak={kind:kind,start:now,durMin:kind==='eye'?EYE_BREAK_MIN:STAND_BREAK_MIN,pomo:pomo};
  if(!state.active.pausedAt)state.active.pausedAt=now;
  saveState();render();healthBreakFrame();
}

function healthBreakEnd(){
  var hb=state.healthBreak;
  if(!hb)return;
  var now=Date.now();
  var dur=now-hb.start;
  state.healthBreak=null;
  if(state.active){
    if(state.active.pausedAt){
      state.active.start+=dur;
      state.active.pausedAt=null;
    }
    if(hb.kind==='stand'){
      state.active.healthStart=now;
      healthResetThresholds();
    }else{
      state.active.healthStart=(state.active.healthStart||state.active.start)+dur;
      healthResync();
    }
  }
  try{var p=P();if(hb.pomo&&p.phase&&p.phaseEndsAt)p.phaseEndsAt+=dur;}catch(e){}
  saveState();render();healthBreakFrame();
  showToast('Τέλος διαλείμματος. Συνέχεια.');
}

function healthBreakFrame(){
  var hb=state.healthBreak;
  var bar=document.getElementById('healthBreakBar');
  if(hb&&!state.active){healthClear();return;}
  if(!hb){if(bar)bar.classList.remove('on');return;}
  var total=hb.durMin*60000;
  var left=Math.max(0,hb.start+total-Date.now());
  if(left<=0){healthBreakEnd();return;}
  if(!bar){
    bar=document.createElement('div');
    bar.id='healthBreakBar';
    document.body.appendChild(bar);
  }
  if(bar.dataset.kind!==hb.kind||!bar.querySelector('.hb-time')){
    bar.dataset.kind=hb.kind;
    var title=hb.kind==='eye'?'Διάλειμμα ματιών':'Διάλειμμα — σήκω';
    var sub=hb.kind==='eye'?'Κοίτα 6 μέτρα μακριά. Ξεκούρασε τα μάτια.':'Σηκώσου, τεντώσου, περπάτα λίγο.';
    bar.innerHTML='<div class="hb-row"><div><div class="hb-title">'+title+'</div><div class="hb-sub">'+sub+'</div></div><div class="hb-time">0:00</div></div>'
      +'<div class="hb-track"><div class="hb-fill"></div></div>'
      +'<button class="btn btn-success" style="width:100%" onclick="healthBreakEnd()">Τέλος διαλείμματος — συνέχεια</button>';
  }
  var sec=Math.ceil(left/1000);
  var mm=Math.floor(sec/60),ss=sec%60;
  var tEl=bar.querySelector('.hb-time');
  if(tEl)tEl.textContent=mm+':'+(ss<10?'0':'')+ss;
  var fEl=bar.querySelector('.hb-fill');
  if(fEl)fEl.style.width=Math.round((1-left/total)*100)+'%';
  bar.classList.add('on');
}

function healthTick(){
  healthEnsure();
  var h=state.health;
  if(state.healthBreak)return;
  if(!state.active||!healthApplies()){
    if(h.nextEye!==HEALTH_NONE||h.nextStand!==HEALTH_NONE){h.nextEye=HEALTH_NONE;h.nextStand=HEALTH_NONE;}
    return;
  }
  if(state.active.pausedAt)return;
  var e=healthElapsedMin();
  if(e<=0)return;
  if(!h.eyeEnabled)h.nextEye=HEALTH_NONE;
  if(!h.standEnabled)h.nextStand=HEALTH_NONE;
  if(h.eyeEnabled&&h.nextEye===HEALTH_NONE)h.nextEye=(Math.floor(e/EYE_MIN)+1)*EYE_MIN;
  if(h.standEnabled&&h.nextStand===HEALTH_NONE)h.nextStand=(Math.floor(e/STAND_MIN)+1)*STAND_MIN;
  var loops=0;
  while(loops<4){
    loops++;
    var dueStand=h.standEnabled&&e>=h.nextStand;
    var dueEye=h.eyeEnabled&&e>=h.nextEye;
    if(!dueStand&&!dueEye)break;
    if(dueStand){
      var fs=h.nextStand;
      h.nextStand=fs+STAND_MIN;
      if(h.eyeEnabled&&h.nextEye<=fs)h.nextEye=fs+EYE_MIN;
      healthOffer('stand');
      return;
    }
    if(dueEye){
      var fe=h.nextEye;
      h.nextEye=fe+EYE_MIN;
      healthOffer('eye');
      return;
    }
  }
  if(loops>=4)healthResync();
}

<script>

var ACT_CATS=[

/* --- διορθώσεις πυρήνα --- */
function totalMin(type,id,from,to){var s=state.logs.reduce(function(acc,l){if(l.type===type&&l.id===id)return acc+overlap(l.start,l.end,from,to)/60000;return acc;},0);var a=state.active;if(a&&a.type===type&&a.id===id)s+=overlap(a.start,a.pausedAt||Date.now(),from,to)/60000;return s;}
function allTotalMin(from,to){var s=state.logs.reduce(function(acc,l){return acc+overlap(l.start,l.end,from,to)/60000;},0);var a=state.active;if(a)s+=overlap(a.start,a.pausedAt||Date.now(),from,to)/60000;return s;}
function occurrences(type,id,from,to){var days=new Set();state.logs.forEach(function(l){if(l.type===type&&l.id===id&&l.dur>0.01&&overlap(l.start,l.end,from,to)>0)days.add(startOfDay(l.start));});var a=state.active;if(a&&a.type===type&&a.id===id){var s=Math.max(a.start,from),e=Math.min(a.pausedAt||Date.now(),to);if(e>s)days.add(startOfDay(a.start));}return days.size;}
function handleActive(){var a=state.active;if(!a||a.pausedAt)return;if(!Array.isArray(a.shownAlerts))a.shownAlerts=[];if(a.type==='fixed')handleFixedActive(a);else handleCourseActive(a);}
function openQuickSettings(){gpTogglePanel();}

function generateWeeklyReview(){
var ws=startOfWeek();var we=startOfNextWeek();var now=Date.now();

for(var i=0;i<7;i++){var d=new Date(ws);d.setDate(d.getDate()+i);var ds=d.getTime();var de=startOfNextDay(ds);if(ds>Date.now())continue;var has=false;state.logs.forEach(function(l){if(l.end>ds&&l.start<de)has=true;});if(!has)continue;var ok=true;FIXED_DEFS.forEach(function(def){if(totalMin('fixed',def.id,ds,de)>def.daily+0.5)ok=false;});totalDays++;if(ok)complianceDays++;}
var relaxDef=FIXED_DEFS.find(function(x){return x.restorative;});

if(review.stats.study.pct<90)review.stats.suggestions.push('Αύξησε τη μελέτη κατά '+fmtHM(targetStudy-totalStudy));

state.weeklyReviews.push(review);state.lastReviewCheck=now;saveState();return review;
}
function budgetSnapshotExact(courses,fixedDefs,sleepHours){

var unscheduledFixedW=0;
fixedDefs.forEach(function(d){if(!scheduledFixed[d.id])unscheduledFixedW+=(d.weekly||0);});
var unscheduledCourses=[];
courses.forEach(function(c){if(c&&c.active&&c.hours>0&&!scheduledCourse[c.id]){var off=Array.isArray(c.off)?c.off:[];var activeDays=Math.max(1,7-off.length);unscheduledCourses.push({hoursMin:c.hours*60,off:off,per:c.hours*60/activeDays});}});

<script>

function dayModel(idx,snap){
snap=snap||daySnap();
var today=mondayIndex(),isToday=(idx===today);
var d=new Date(startOfWeek());d.setDate(d.getDate()+idx);
var ds=d.getTime(),de=startOfNextDay(ds);
var sleep=isToday?(1440-todayAwakeMin()):(state.settings.sleepHours*60);
var awake=1440-sleep;
var logged=(ds<=Date.now())?allTotalMin(ds,de):0;
var planned=Math.max(0,awake-(snap.days[idx]||0));
return {idx:idx,isToday:isToday,sleep:sleep,awake:awake,logged:logged,planned:planned,freeLogged:awake-logged,freePlanned:awake-planned};
}
function heavyThreshold(awake){return awake*(state.settings.heavyDayPct||85)/100;}

function getHeavyDayWarning(){
var m=dayModel(mondayIndex()),thr=heavyThreshold(m.awake);
return {heavy:m.logged>=thr,load:m.logged,remaining:m.freeLogged,threshold:thr};
}
function getUpcomingHeavyDays(){
var today=mondayIndex(),snap=daySnap(),out=[];
for(var i=today+1;i<7;i++){
var m=dayModel(i,snap);
if(m.planned>=heavyThreshold(m.awake))out.push({day:i,load:m.planned,remaining:m.freePlanned});
}
return out;
}
function dailyFreeMin(){
var snap=daySnap(),s=0;
for(var i=0;i<7;i++)s+=dayModel(i,snap).freePlanned;
return s/7;
}

/* --- αποκαταστατική σημαια αντί για id 'relax' --- */
function isRestorative(d){return !!(d&&(d.restorative===true||d.categoryId==='recover'));}
function relaxDef(){return FIXED_DEFS.find(isRestorative)||null;}
function relaxBaseDaily(){var d=relaxDef();return d?d.weekly/7:RELAX_WEEK/7;}
function relaxDouble(){return relaxBaseDaily()*2;}
function relaxOversUsed(includeToday){
var d=relaxDef();if(!d)return 0;
var base=d.weekly/7,ws=startOfWeek(),today=startOfDay(),n=0;
for(var i=0;i<7;i++){
var x=new Date(ws);x.setDate(x.getDate()+i);
var ds=x.getTime();
if(ds>today)continue;
if(includeToday===false&&ds>=today)continue;
if(totalMin('fixed',d.id,ds,startOfNextDay(ds))>base+0.5)n++;
}
return n;
}
function fixedInfo(id){
var def=FIXED_DEFS.find(function(x){return x.id===id;});if(!def)return null;
var rest=isRestorative(def);
var dayMin=totalMin('fixed',id,startOfDay(),startOfNextDay());
var weekMin=totalMin('fixed',id,startOfWeek(),startOfNextWeek());
var occ=occurrences('fixed',id,startOfWeek(),startOfNextWeek());
var dailyCap=def.daily,weeklyCap=def.weekly,hardLimit=Infinity,extra={restorative:rest};
if(rest){
var base=def.weekly/7,allowed=state.settings.relaxOvers;
var before=relaxOversUsed(false),shown=relaxOversUsed(true),canOver=before<allowed;
dailyCap=base;weeklyCap=def.weekly;hardLimit=canOver?base*2:base;
extra={restorative:true,base:base,double:base*2,overs:shown,oversBefore:before,allowed:allowed,canOver:canOver,weeklyMax:def.weekly+allowed*base};
}else if(def.hard){hardLimit=dailyCap;}
return Object.assign({def:def,dayMin:dayMin,weekMin:weekMin,occ:occ,dailyCap:dailyCap,weeklyCap:weeklyCap,hardLimit:hardLimit,dayRemaining:dailyCap-dayMin,dayOver:Math.max(0,dayMin-dailyCap),weekRemaining:weeklyCap-weekMin,weekOver:Math.max(0,weekMin-weeklyCap),target:def.target},extra);
}
function startFixed(id){
if(state.active){showToast('Τρέχει άλλο.');return;}
var info=fixedInfo(id);if(!info)return;
if(info.def.hard&&info.dayMin>=info.hardLimit-0.05){pushAlert({title:info.def.name+': όριο',message:'Μέγιστο '+fmtPrecise(info.hardLimit)+'.'});return;}
if(info.restorative&&info.dayMin>=info.dailyCap-0.05){
if(!info.canOver){pushAlert({title:info.def.name,message:info.overs+'/'+info.allowed+' υπερβάσεις.'});return;}
confirmModal('Υπέρβαση','Ήδη '+fmtPrecise(info.dayMin)+'. Συνέχεια έως '+fmtPrecise(info.double)+'.',function(){doStart('fixed',id);},'Συνέχεια');return;
}
if(!info.def.hard&&info.dayRemaining<=0){confirmModal('Υπέρβαση',info.def.name+': το όριο εξαντλήθηκε.',function(){doStart('fixed',id);},'Έναρξη');return;}
doStart('fixed',id);
}
function fixedCard(def,index){
var info=fixedInfo(def.id),rest=isRestorative(def);
var isActive=state.active&&state.active.type==='fixed'&&state.active.id===def.id;
var otherActive=state.active&&!isActive;
var dayPct=info.dailyCap?clamp(info.dayMin/info.dailyCap*100,0,100):0;
var weekLimit=rest?info.weeklyMax:info.weeklyCap;
var weekPct=weekLimit?clamp(info.weekMin/weekLimit*100,0,100):0;
var sc='info',st='Εντός';
if(info.weekMin>weekLimit+0.5){sc='danger';st='Υπέρβαση εβδομάδας';}
else if(info.dayMin>info.dailyCap+0.5){sc='danger';st='Υπέρβαση ημέρας';}
else if(rest&&info.weekMin>info.weeklyCap+0.5){sc='warn';st='Υπέρβαση βάσης';}
else if(info.target&&info.occ>info.target){sc='warn';st='Πάνω από στόχο';}
else if(info.target&&info.occ>=info.target){sc='success';st='Στόχος';}
else if(dayPct>=80||weekPct>=80){sc='warn';st='Οριακά';}
var dayText=info.dayRemaining>=0?fmtHM(info.dayRemaining):'+'+fmtHM(info.dayOver);
var weekText=info.weekMin<=weekLimit?fmtHM(weekLimit-info.weekMin):'+'+fmtHM(info.weekMin-weekLimit);
var tl='Στόχος',tv='—',ts='';
if(def.target){tv=info.occ+'/'+def.target;ts='φορές';}
else if(rest){tl='Υπερβάσεις';tv=info.overs+'/'+info.allowed;ts='Διπλό '+fmtPrecise(info.double);}
else{tl='Ροή';tv='Ελεύθερη';}
var button;
if(isActive)button='<button class="btn btn-stop" onclick="stopActive()">Διακοπή</button>';
else if(otherActive)button='<button class="btn btn-primary" disabled>Τρέχει άλλο</button>';
else if(def.hard&&info.dayMin>=info.hardLimit-0.05)button='<button class="btn btn-primary" disabled>Όριο</button>';
else if(info.dayRemaining<=0){
if(rest&&!info.canOver)button='<button class="btn btn-primary" disabled>Όριο</button>';
else button='<button class="btn btn-warn" onclick="startFixed(\''+def.id+'\')">Υπέρβαση</button>';
}else button='<button class="btn btn-primary" onclick="startFixed(\''+def.id+'\')">Έναρξη</button>';
var note='';
if(rest)note='Βάση '+fmtPrecise(info.base)+', '+info.allowed+' υπερβάσεις έως '+fmtPrecise(info.double)+'.';
else if(Array.isArray(def.milestones)&&def.milestones.length)note='Ορόσημα: '+def.milestones.map(function(m){return m<0?(-m)+'λ πριν το όριο':m+'λ';}).join(', ')+'.';
else if(def.hard)note='Σκληρό όριο '+fmtHM(info.dailyCap)+'.';
var cat=catById(def.categoryId||'organize');
return '<article class="card activity '+(isActive?'running':'')+'" style="--accent:'+cat.color+';--accent2:'+cat.color2+';animation-delay:'+(index*0.03)+'s">'
+'<div class="activity-head"><div class="icon">'+esc(def.short)+'</div><div class="activity-title"><h3>'+esc(def.name)+'</h3><p class="muted">'+esc(def.desc||'')+'</p></div><span class="pill '+sc+'">'+st+'</span></div>'
+'<div class="metrics"><div class="metric"><span>Σήμερα</span><strong class="'+(info.dayRemaining<0?'text-danger':'')+'">'+dayText+'</strong><div class="progress '+(info.dayRemaining<0?'over':'')+'"><span style="width:'+dayPct+'%"></span></div><small>'+fmtHM(info.dayMin)+' / '+(rest?fmtPrecise(info.dailyCap):fmtHM(info.dailyCap))+'</small></div>'
+'<div class="metric"><span>Εβδομάδα</span><strong class="'+(info.weekMin>weekLimit?'text-danger':'')+'">'+weekText+'</strong><div class="progress '+(info.weekMin>weekLimit?'over':'')+'"><span style="width:'+weekPct+'%"></span></div><small>'+fmtHM(info.weekMin)+' / '+fmtHM(weekLimit)+'</small></div>'
+'<div class="metric"><span>'+tl+'</span><strong>'+tv+'</strong><small>'+(ts||'&nbsp;')+'</small></div></div>'
+(note?'<p class="note">'+note+'</p>':'')
+'<div class="actions">'+button+'<button class="btn btn-ghost" onclick="openFixedEditor(\''+def.id+'\')">✎</button></div></article>';
}
function relaxSettingsHTML(){
var d=relaxDef();
if(!d)return '<p class="note">Καμία αποκαταστατική δραστηριότητα. Βάλε μία δραστηριότητα στην κατηγορία «Επαναφορά» για να εμφανιστούν εδώ οι υπερβάσεις της.</p>';
var base=d.weekly/7,max=d.weekly+state.settings.relaxOvers*base;
return '<div class="field"><label>Υπερβάσεις «'+esc(d.name)+'» / εβδομάδα</label><input type="number" min="0" max="7" step="1" value="'+state.settings.relaxOvers+'" onchange="updateSetting(\'relaxOvers\',parseInt(this.value||0,10))"></div>'
+'<div class="summary-grid"><div class="stat-box"><span>Ημερήσια βάση</span><strong>'+fmtPrecise(base)+'</strong></div><div class="stat-box"><span>Διπλό</span><strong>'+fmtPrecise(base*2)+'</strong></div><div class="stat-box"><span>Εβδομαδιαία βάση</span><strong>'+fmtHM(d.weekly)+'</strong></div><div class="stat-box"><span>Μέγιστο</span><strong>'+fmtPrecise(max)+'</strong></div></div>';
}

/* --- ποσοστό κατωφλιού σε ΟΛΕΣ τις δραστηριότητες, dedup ανά λεπτό --- */
function buildFixedAlerts(def,info){
var alerts=[],d=info.dailyCap;
var ap=(state.settings.alertPct||80)/100,apTitle=Math.round(ap*100)+'%';
if(Array.isArray(def.milestones)&&def.milestones.length){
def.milestones.forEach(function(m,i){
var min=m<0?Math.max(0,d+m):m;
alerts.push({key:'ms'+i,scope:'day',min:min,cap:d,title:m<0?(-m)+'λ πριν':(m+'λ')});
});
}
if(info.restorative){
alerts.push({key:'half',scope:'day',min:d/2,cap:d,title:'Μισό'});
alerts.push({key:'double',scope:'day',min:info.hardLimit,cap:info.hardLimit,title:'Μέγιστο'});
}
alerts.push({key:'cap',scope:'day',min:d,cap:d,title:'Όριο'});
alerts.push({key:'pct',scope:'day',min:d*ap,cap:d,title:apTitle});
var wl=info.restorative?info.weeklyMax:info.weeklyCap;
if(wl){
alerts.push({key:'weekcap',scope:'week',min:wl,cap:wl,title:'Εβδομαδιαίο'});
alerts.push({key:'weekpct',scope:'week',min:wl*ap,cap:wl,title:apTitle+' εβδ.'});
}
var seen={};
return alerts.filter(function(a){
if(!(a.min>0))return false;
var k=a.scope+'|'+Math.round(a.min*10);
if(seen[k])return false;
seen[k]=1;return true;
});
}

/* --- προτάσεις από το ενιαίο μοντέλο, μόνο εντός ώρας --- */
function getSmartSuggestions(){
var out=[],today=mondayIndex(),m=dayModel(today);
var free=m.freeLogged,hour=new Date().getHours();
if(free<30)return out;
state.courses.forEach(function(c){
if(!c.active||!c.hours||c.off.includes(today))return;
var i=courseInfo(c);
if(i.remaining>60)out.push({type:'course',id:c.id,name:c.name,duration:Math.min(i.remaining,free),priority:i.remaining>180?'high':i.remaining>120?'medium':'low',reason:'Χρειάζεσαι '+fmtHM(i.remaining)+' ακόμα',timeOk:true});
});
FIXED_DEFS.forEach(function(def){
var r=def.timeRange||[0,24];
if(!(hour>=r[0]&&hour<r[1]))return;
var i=fixedInfo(def.id);
if(def.target&&i.occ<def.target){out.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(def.daily,free),priority:'medium',reason:i.occ+'/'+def.target+' φορές',timeOk:true});return;}
if(isRestorative(def)&&i.dayRemaining>30){out.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(i.dayRemaining,free),priority:'low',reason:'Επαναφορά',timeOk:true});return;}
if(def.categoryId==='body'&&i.dayRemaining>60){out.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(120,free),priority:'low',reason:'Κίνηση',timeOk:true});}
});
out.sort(function(a,b){var p={high:3,medium:2,low:1};return p[b.priority]-p[a.priority];});
return out.slice(0,state.settings.suggestionLimit||3);
}

/* --- χειροκίνητος ύπνος: σωστό παράθυρο πέρα από τα μεσάνυχτα --- */
function sleepManual(){
var d=prompt('Ημερομηνία (YYYY-MM-DD):',getDailyPlanKey());if(!d)return;
var s=prompt('Ύπνος ξεκινά (HH:MM):','23:00');if(!s)return;
var e=prompt('Ύπνος τελειώνει (HH:MM):','07:00');if(!e)return;
var sm=schParseHM(s),em=schParseHM(e);
var base=startOfDay(new Date(d+'T12:00:00').getTime());
if(!isFinite(base)){showToast('Λάθος ημερομηνία.');return;}
var start=base+sm*60000,end=base+em*60000;
if(em<=sm)end+=86400000;
var dur=(end-start)/60000;
if(dur<1||dur>16*60){showToast('Διάρκεια εκτός ορίων (1 λεπτό έως 16 ώρες).');return;}
state.sleep.hours=state.sleep.hours||{};
state.sleep.windows=state.sleep.windows||{};
var mid=startOfNextDay(start);
if(end<=mid){
var k=getDailyPlanKey(start);
state.sleep.hours[k]=dur/60;
state.sleep.windows[k]={start:start,end:end};
}else{
var k1=getDailyPlanKey(start),k2=getDailyPlanKey(end);
state.sleep.hours[k1]=(mid-start)/3600000;
state.sleep.hours[k2]=(end-mid)/3600000;
state.sleep.windows[k1]={start:start,end:mid};
state.sleep.windows[k2]={start:mid,end:end};
}
saveState();render();showToast('Καταχωρήθηκε ύπνος '+fmtHM(dur)+'.');
}

}

<script>
/* ===== ΕΛΕΓΧΟΣ ΗΜΕΡΑΣ v1: ΤΙ ΣΗΜΑΙΝΕΙ ΣΥΜΜΟΡΦΩΣΗ ===== */
function rhDayLogged(s,e){return allTotalMin(s,e);}
function rhRestorativeOk(d,ds){
var base=d.weekly/7,m=totalMin('fixed',d.id,ds,startOfNextDay(ds));
if(m<=base+0.5)return true;
if(m>base*2+0.5)return false;
var ws=startOfWeek(ds),n=0;
for(var t=ws;t<=ds;t=startOfNextDay(t)){if(totalMin('fixed',d.id,t,startOfNextDay(t))>base+0.5)n++;}
return n<=(state.settings.relaxOvers||0);
}
function dayCompliant(ts){var a=dayAudit(ts);return !a.empty&&a.ok;}
function dayHasData(ts){var s=startOfDay(ts),e=startOfNextDay(s);return rhDayLogged(s,e)>0;}
function streakCount(){
var day=86400000,cur=startOfDay(),n=0;
var a=dayAudit(cur);
if(a.empty||!a.ok)cur-=day;
while(n<60){var x=dayAudit(cur);if(x.empty||!x.ok)break;n++;cur-=day;}
return n;
}

/* ===== ΤΕΛΟΣ ΕΛΕΓΧΟΥ ΗΜΕΡΑΣ v1 ===== */
</script>

<script>
/* ===== ΟΨΗ ΗΜΕΡΑΣ v1: ΛΩΡΙΔΑ + ΠΛΑΝΟ/ΠΡΑΓΜΑΤΙΚΟ + ΕΠΕΞΕΡΓΑΣΙΑ + CSV ===== */

function rhHMtoMin(v){var p=String(v||'0:0').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function rhMinOfDay(ts){var d=new Date(ts);return d.getHours()*60+d.getMinutes()+d.getSeconds()/60;}
function rhPct(m){return clamp(m/1440*100,0,100);}
function rhActName(type,id){
if(type==='course'){var c=state.courses.find(function(x){return x.id===id;});return c?c.name:'Μάθημα';}
var d=FIXED_DEFS.find(function(x){return x.id===id;});return d?d.name:'Δραστηριότητα';
}
function rhLoggedIn(type,id,a,b){
var m=0;
state.logs.forEach(function(l){if(l.type===type&&l.id===id)m+=overlap(l.start,l.end,a,b)/60000;});
var ac=state.active;
if(ac&&ac.type===type&&ac.id===id)m+=overlap(ac.start,ac.pausedAt||Date.now(),a,b)/60000;
return m;
}
function rhTodaySlots(){
if(typeof scheduleGetDay!=='function'||typeof mondayIndex!=='function')return [];
return scheduleGetDay(mondayIndex()).map(function(sl){
var eff=(typeof slotEff==='function')?slotEff(sl):sl;
var base=startOfDay();
var parts=(typeof slotActivityParts==='function')?slotActivityParts(sl):{type:'fixed',id:''};
return {id:sl.id,name:(typeof slotName==='function')?slotName(sl):'',type:parts.type,actId:parts.id,
a:base+rhHMtoMin(eff.start)*60000,b:base+rhHMtoMin(eff.end)*60000,
s:rhHMtoMin(eff.start),e:rhHMtoMin(eff.end),status:eff.status||'pending'};
});
}
function rhSleepSegs(){
var s=startOfDay(),e=startOfNextDay(),out=[];
var w=(state.sleep&&state.sleep.windows)?state.sleep.windows[getDailyPlanKey()]:null;
if(w&&w.end>w.start){
var a=Math.max(w.start,s),b=Math.min(w.end,e);
if(b>a)out.push([rhMinOfDay(a),rhMinOfDay(b)]);
}else if(state.sleepPattern){
var ps=rhHMtoMin(state.sleepPattern.start),pe=rhHMtoMin(state.sleepPattern.end);
if(pe>ps)out.push([ps,pe]);
else{out.push([ps,1440]);if(pe>0)out.push([0,pe]);}
}
if(state.sleep&&state.sleep.asleep&&state.sleep.startedAt){
var a2=Math.max(state.sleep.startedAt,s),b2=Math.min(Date.now(),e);
if(b2>a2)out.push([rhMinOfDay(a2),rhMinOfDay(b2)]);
}
return out;
}
function rhDayTimelineHTML(){
var s=startOfDay(),e=startOfNextDay(),i;
var sleep=rhSleepSegs();
var sleepHtml='';
for(i=0;i<sleep.length;i++){
sleepHtml+='<div class="rh-tl-sleep" style="left:'+rhPct(sleep[i][0])+'%;width:'+rhPct(sleep[i][1]-sleep[i][0])+'%"></div>';
}
var slots=rhTodaySlots();
var planHtml='';
for(i=0;i<slots.length;i++){
var sl=slots[i];
planHtml+='<div class="rh-tl-plan" title="'+esc(sl.name)+'" style="left:'+rhPct(sl.s)+'%;width:'+rhPct(Math.max(4,sl.e-sl.s))+'%;border-color:'+rhActColor(sl.type,sl.actId)+'"></div>';
}
var realHtml='';
state.logs.forEach(function(l){
if(l.end<=s||l.start>=e)return;
var a=rhMinOfDay(Math.max(l.start,s)),b=rhMinOfDay(Math.min(l.end,e));
realHtml+='<div class="rh-tl-seg" title="'+esc(rhActName(l.type,l.id))+'" style="left:'+rhPct(a)+'%;width:'+rhPct(Math.max(3,b-a))+'%;background:'+rhActColor(l.type,l.id)+'"></div>';
});
var ac=state.active;
if(ac){
var end=ac.pausedAt||Date.now();
if(end>s&&ac.start<e){
var a3=rhMinOfDay(Math.max(ac.start,s)),b3=rhMinOfDay(Math.min(end,e));
realHtml+='<div class="rh-tl-seg" style="left:'+rhPct(a3)+'%;width:'+rhPct(Math.max(3,b3-a3))+'%;background:'+rhActColor(ac.type,ac.id)+';box-shadow:0 0 0 2px var(--card) inset"></div>';
}
}
var nowPct=rhPct(rhMinOfDay(Date.now()));
var hours='<div class="rh-tl-hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>';
return '<div class="rh-tl-label">Πλάνο</div><div class="rh-tl">'+sleepHtml+planHtml+'<div class="rh-tl-now" style="left:'+nowPct+'%"></div></div>'
+'<div class="rh-tl-label">Πραγματικό</div><div class="rh-tl">'+sleepHtml+realHtml+'<div class="rh-tl-now" id="rhNowLine" style="left:'+nowPct+'%"></div></div>'+hours

function rhPlanActualHTML(){

function rhSlotOverlaps(day,st,en,skipId){
var a=rhHMtoMin(st),b=rhHMtoMin(en),out=[];
if(typeof scheduleGetDay!=='function')return out;
scheduleGetDay(day).forEach(function(s){
if(skipId&&s.id===skipId)return;
var x=rhHMtoMin(s.start),y=rhHMtoMin(s.end);
if(a<y&&b>x)out.push(s);
});
return out;
}
function scheduleAdd(){

if(st>=en){showToast('Η λήξη πρέπει να είναι μετά την έναρξη.');return;}
if(typeof scheduleSleepBlocked==='function'&&scheduleSleepBlocked(scheduleCurDay,st,en)){
showToast('Η θέση πέφτει μέσα στο πρότυπο ύπνου.');return;
}
var commit=function(){

var s=scheduleFind(scheduleEditId);
if(s){s.activityId=act;s.start=st;s.end=en;}
scheduleEditId=null;
showToast('Η θέση ενημερώθηκε.');
}else{
state.schedule.slots.push({id:'sch'+Date.now()+'_'+Math.floor(Math.random()*10000),day:scheduleCurDay,start:st,end:en,activityId:act});
showToast('Προστέθηκε θέση.');
}
saveState();
scheduleOpen(scheduleCurDay);
};
var ov=rhSlotOverlaps(scheduleCurDay,st,en,scheduleEditId);
if(ov.length){
var names=ov.map(function(s){return (typeof slotName==='function')?slotName(s):'';}).join(', ');
confirmModal('Επικάλυψη','Η θέση πέφτει πάνω σε: '+names+'. Να αποθηκευτεί έτσι;',commit,'Αποθήκευση');
return;
}
commit();
}

<script>
/* ===== ΣΕΡΙ v2: ΚΑΝΟΝΑΣ ΔΥΟ ΗΜΕΡΩΝ + ΣΥΝΕΠΕΙΑ ===== */
function streakCount(){
var day=86400000,cur=startOfDay(),n=0,miss=0,guard=0;
while(guard<120){
var a=dayAudit(cur);
if(a.empty){cur-=day;guard++;continue;}
if(a.ok){n++;miss=0;}
else{miss++;if(miss>=2)break;}
cur-=day;guard++;
}
return n;
}
function consistency14(){
var day=86400000,cur=startOfDay(),tot=0,ok=0;
for(var i=0;i<14;i++){
var a=dayAudit(cur-i*day);
if(a.empty)continue;
tot++;if(a.ok)ok++;
}
return {ok:ok,tot:tot};
}
function sleepExtrasMount(){
var main=document.querySelector('main');
if(!main)return;

}

if(!document.getElementById('streak-card-extra')){

+'<div class="plan-row" style="margin-top:8px"><span>Συνέπεια 14 ημερών</span><strong>'+c14.ok+'/'+c14.tot+'</strong></div>'
+'<p class="note">Μία μη συμμορφωμένη ημέρα δεν σπάει το σερί· δύο διαδοχικές το σπάνε. Ημέρες χωρίς καταγραφές είναι ουδέτερες, ούτε μετρούν ούτε σπάνε.</p></div></div>');
}
}
if(label.indexOf('Δραστηριότητες')>=0){
if(!document.getElementById('exam-card-extra')){main.insertAdjacentHTML('beforeend',examCardHTML());}
}
}

{text:'Κλείσιμο',class:'btn-ghost'},
closed?{text:'ΟΚ',class:'btn-primary'}:{text:'Κλείσε την ημέρα',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet');
var rateBtn=sh.querySelector('[data-rate].on');
var rating=rateBtn?parseInt(rateBtn.getAttribute('data-rate'),10):0;
var note=(sh.querySelector('#rhNote').value||'').trim();
var carried=[];
sh.querySelectorAll('[data-carry]:checked').forEach(function(cb){
var r=rows[parseInt(cb.getAttribute('data-carry'),10)];
carried.push({type:r.type,id:r.actId,name:r.name,minutes:Math.round(r.want-r.got)});
});
if(rating)state.reviews[key]=rating;
if(note){state.reviewNotes=state.reviewNotes||{};state.reviewNotes[key]=note;}
if(carried.length){state.carry=state.carry||{};state.carry[rhCarryKey()]=carried;}
state.dayClose=state.dayClose||{};state.dayClose[key]=Date.now();
saveState();closeModal();render();
showToast(carried.length?('Η ημέρα έκλεισε. '+carried.length+' θέσεις πάνε αύριο.'):'Η ημέρα έκλεισε.');
}}
],onMount:function(sh){
sh.querySelectorAll('[data-rate]').forEach(function(b){
b.onclick=function(){
sh.querySelectorAll('[data-rate]').forEach(function(x){x.classList.remove('on','btn-primary');x.classList.add('btn-ghost');});
b.classList.add('on','btn-primary');b.classList.remove('btn-ghost');
};
});
}});
}
function rhGoalsCardHTML(){
var key=getDailyPlanKey();
var closed=!!(state.dayClose&&state.dayClose[key]);
return '<div class="card"><h3>Τώρα · Στόχοι · Πρόοδος</h3>'+rhNowNextHTML()+rhGoalsHTML()
+'<div class="actions" style="margin-top:12px"><button class="btn '+(closed?'btn-ghost':'btn-warn')+'" onclick="openDayShutdown()">'+(closed?'Ανακεφαλαίωση ημέρας':'Λήξη ημέρας')+'</button></div></div>';
}
function getSmartSuggestions(){
var out=[],today=mondayIndex();
var m=(typeof dayModel==='function')?dayModel(today):null;
var free=m?m.freeLogged:960;
var hour=new Date().getHours();
var carried=(state.carry&&state.carry[getDailyPlanKey()])||[];
carried.forEach(function(c){
out.push({type:c.type,id:c.id,name:c.name,duration:Math.max(15,Math.min(c.minutes,free)),priority:'high',reason:'Μεταφορά από χθες · '+fmtHM(c.minutes),timeOk:true});
});
var rest=[];
if(free>=30){
state.courses.forEach(function(c){
if(!c.active||!c.hours||c.off.includes(today))return;
var i=courseInfo(c);
if(i.remaining>60)rest.push({type:'course',id:c.id,name:c.name,duration:Math.min(i.remaining,free),priority:i.remaining>180?'high':i.remaining>120?'medium':'low',reason:'Χρειάζεσαι '+fmtHM(i.remaining)+' ακόμα',timeOk:true});
});
FIXED_DEFS.forEach(function(def){
var r=def.timeRange||[0,24];
if(!(hour>=r[0]&&hour<r[1]))return;
var i=fixedInfo(def.id);
if(def.target&&i.occ<def.target){rest.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(def.daily,free),priority:'medium',reason:i.occ+'/'+def.target+' φορές',timeOk:true});return;}
if((typeof isRestorative==='function'?isRestorative(def):(def.id==='relax'))&&i.dayRemaining>30){rest.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(i.dayRemaining,free),priority:'low',reason:'Επαναφορά',timeOk:true});return;}
if(def.categoryId==='body'&&i.dayRemaining>60){rest.push({type:'fixed',id:def.id,name:def.name,duration:Math.min(120,free),priority:'low',reason:'Κίνηση',timeOk:true});}
});
rest.sort(function(a,b){var p={high:3,medium:2,low:1};return p[b.priority]-p[a.priority];});
}
return out.concat(rest).slice(0,state.settings.suggestionLimit||3);
}

function bfEnsure(){
state.butterflies=state.butterflies||{};

function bfWings(sp){

function bfTile(S,count,seed,list,k){

var BF_FLY={list:[],raf:0,last:0,on:false};

function bfBuildFlight(){

if(state.settings.theme!=='butterflies'||!b.fly||b.count<1||reduce)return;
var list=bfEnabled();if(!list.length)list=[BF_SPECIES[1]];
var sky=bfSkyEl(),W=window.innerWidth,H=window.innerHeight;
for(var i=0;i<b.count;i++){

var el=document.createElement('div');el.className='bf-fly';
var w=Math.round(58*depth*(b.size/100)),h=Math.round(w*0.8);
el.style.width=w+'px';el.style.height=h+'px';
el.style.opacity=(b.depth?(0.42+depth*0.52):0.92).toFixed(2);
el.innerHTML=bfFlyerSvg(sp);
sky.appendChild(el);
BF_FLY.list.push({el:el,wr:el.querySelector('.bf-wr'),wl:el.querySelector('.bf-wl'),w:w,h:h,
x:Math.random()*W,y:Math.random()*H,hd:Math.random()*6.283,depth:depth,

}

BF_FLY.raf=requestAnimationFrame(bfStep);
}
function bfStep(ts){
if(!BF_FLY.on)return;
BF_FLY.raf=requestAnimationFrame(bfStep);
if(!BF_FLY.last){BF_FLY.last=ts;return;}
var dt=Math.min(0.05,(ts-BF_FLY.last)/1000);BF_FLY.last=ts;
var b=bfEnsure(),W=window.innerWidth,H=window.innerHeight;
var base=58*(b.speed/100),err=b.erratic/100,wind=b.wind*0.42;
for(var i=0;i<BF_FLY.list.length;i++){
var f=BF_FLY.list[i];
f.rt-=dt;
var dd=Math.hypot(f.tx-f.x,f.ty-f.y);
if(f.rt<=0||dd<48){f.tx=50+Math.random()*Math.max(60,W-100);f.ty=50+Math.random()*Math.max(60,H-100);f.rt=1.7+Math.random()*3.2;}
var want=Math.atan2(f.ty-f.y,f.tx-f.x);
var diff=((want-f.hd+Math.PI*3)%6.283185)-Math.PI;
var mt=(1.0+err*3.6)*dt;
f.hd+=Math.max(-mt,Math.min(mt,diff));
f.wb+=dt*(2.1+err*5.2);
f.hd+=(Math.sin(f.wb)*0.95+Math.sin(f.wb*2.7)*0.45)*err*dt;
if(b.glide){f.gt-=dt;if(f.gt<=0){f.gl=0.3+Math.random()*0.8;f.gt=2.6+Math.random()*5;}if(f.gl>0)f.gl-=dt;}else{f.gl=0;}
var gliding=f.gl>0;
if(!gliding)f.ph+=dt*(b.flap/10)*f.hzK*6.283185;
var thrust=gliding?0.88:(0.7+0.55*Math.max(0,Math.sin(f.ph)));
var sp=base*f.depth*thrust;
f.x+=(Math.cos(f.hd)*sp+wind)*dt;
f.y+=Math.sin(f.hd)*sp*dt;
if(f.x<-100)f.x=W+90;else if(f.x>W+100)f.x=-90;
if(f.y<-100)f.y=H+90;else if(f.y>H+100)f.y=-90;
var bob=gliding?0:Math.sin(f.ph)*4.4*f.depth;
var k=gliding?0.94:(0.26+0.74*(0.5+0.5*Math.cos(f.ph)));
var bank=1-Math.min(0.24,Math.abs(diff)*0.2);
f.el.style.transform='translate3d('+(f.x-f.w/2).toFixed(1)+'px,'+(f.y+bob-f.h/2).toFixed(1)+'px,0) rotate('+(f.hd*57.29578+90).toFixed(1)+'deg) scale('+bank.toFixed(3)+',1)';
if(f.wr)f.wr.setAttribute('transform','scale('+k.toFixed(3)+',1)');
if(f.wl)f.wl.setAttribute('transform','scale('+(-k).toFixed(3)+',1)');
}
}

function rhHourBuckets(){
var bk=[],i;for(i=0;i<24;i++)bk.push(0);
var from=Date.now()-28*86400000;
function add(s,e){
if(e<=from)return;
s=Math.max(s,from);
var guard=0;
while(s<e&&guard<2000){
guard++;
var d=new Date(s),h=d.getHours();
var nx=new Date(s);nx.setMinutes(0,0,0);nx.setHours(h+1);
var t=Math.min(e,nx.getTime());
if(t<=s)break;
bk[h]+=(t-s)/60000;s=t;
}
}
state.logs.forEach(function(l){add(l.start,l.end);});
var a=state.active;if(a)add(a.start,a.pausedAt||Date.now());
return bk;
}
function rhHourCardHTML(){
var bk=rhHourBuckets(),max=Math.max.apply(null,bk),i;
var total=bk.reduce(function(a,b){return a+b;},0);
var h='<div class="card"><h3>Χάρτης ποιότητας ώρας</h3>';
if(total<60)return h+'<p class="note">Χρειάζονται λίγες ακόμη καταγραφές για να βγει πότε αποδίδεις πραγματικά.</p></div>';
h+='<p class="muted" style="font-size:.78rem">Πού πήγε ο χρόνος σου τις τελευταίες 28 ημέρες, ανά ώρα του 24ώρου.</p><div class="rh-hm">';
for(i=0;i<24;i++){
var r=max?bk[i]/max:0;
h+='<i title="'+i+':00 — '+fmtHM(bk[i])+'" style="background:color-mix(in srgb,var(--primary) '+Math.round(r*100)+'%,var(--track))"></i>';
}
h+='</div><div class="rh-hm-x"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>';
var idx=bk.map(function(v,i){return {v:v,i:i};}).sort(function(a,b){return b.v-a.v;}).slice(0,3).sort(function(a,b){return a.i-b.i;});
var best=idx.map(function(o){return (o.i<10?'0':'')+o.i+':00–'+((o.i+1)<10?'0':'')+(o.i+1)+':00';}).join(', ');
h+='<div class="plan-row" style="margin-top:10px"><span>Οι τρεις καλύτερες ώρες σου</span><strong class="text-success">'+best+'</strong></div>';
h+='<p class="note">Βάλε τη βαριά νοητική δουλειά εκεί. Οι ώρες με σχεδόν άδειο κελί είναι ώρες που ιστορικά δεν αποδίδεις.</p></div>';
return h;
}

p.id='rhSoundPanel';p.className='gear-panel rh-snd';
p.innerHTML='<div class="rh-snd-head"><strong>Ήχος &amp; ειδοποιήσεις</strong></div>'
+'<div class="setting-row"><div><strong>Ειδοποιήσεις</strong><span class="muted">Εμφάνιση στη μπάρα του κινητού.</span></div>'
+'<button type="button" class="switch" id="rhSwNotif" onclick="rhSndNotif()"></button></div>'
+'<div class="setting-row"><div><strong>Ήχος</strong><span class="muted">Σήμα σε όρια, διαλείμματα και ολοκληρώσεις.</span></div>'
+'<button type="button" class="switch" id="rhSwSound" onclick="rhSndSound()"></button></div>'
+'<div class="rh-snd-act"><button type="button" onclick="rhTestSound()">Δοκιμή ήχου</button></div>'
+'<p class="rh-snd-note" id="rhSndHint"></p>';
document.body.appendChild(p);
return p;
}
function rhSndSync(){
var n=document.getElementById('rhSwNotif'),s=document.getElementById('rhSwSound'),b=document.getElementById('rhNoteBtn');
if(n)n.classList.toggle('on',!!state.settings.notifications);
if(s)s.classList.toggle('on',!!state.settings.sound);
if(b)b.classList.toggle('live',!!state.settings.sound||!!state.settings.notifications);
var h=document.getElementById('rhSndHint');
if(h){
if(!('Notification' in window))h.textContent='Η συσκευή δεν υποστηρίζει ειδοποιήσεις συστήματος. Ο ήχος και οι ειδοποιήσεις μέσα στην εφαρμογή δουλεύουν κανονικά.';
else if(Notification.permission==='denied')h.textContent='Οι ειδοποιήσεις έχουν αποκλειστεί από τον browser για αυτή τη σελίδα. Άλλαξέ το από τις ρυθμίσεις του site.';
else if(Notification.permission!=='granted')h.textContent='Ενεργοποιώντας τις ειδοποιήσεις, ο browser θα ζητήσει άδεια.';
else h.textContent='Οι ειδοποιήσεις συστήματος είναι ενεργές. Ο συναγερμός διαλείμματος ηχεί και δονεί για 7 δευτερόλεπτα.';
}
}
function rhSndClose(){var p=document.getElementById('rhSoundPanel');if(p)p.classList.remove('open');}
function rhSndPanelToggle(){
var b=document.getElementById('rhNoteBtn');if(!b)return;
var p=rhSndPanel();
if(p.classList.contains('open')){rhSndClose();return;}
if(typeof window.gpClose==='function')window.gpClose();
rhSndSync();
var r=b.getBoundingClientRect(),pw=p.offsetWidth||310;
p.style.left=Math.max(12,Math.min(window.innerWidth-pw-12,r.right-pw))+'px';
p.style.top=(r.bottom+8)+'px';
p.classList.add('open');
}
function rhSndNotif(){
var r=(typeof toggleNotifications==='function')?toggleNotifications():null;
if(r&&r.then)r.then(rhSndSync);
rhSndSync();setTimeout(rhSndSync,350);setTimeout(rhSndSync,1200);
}
function rhSndSound(){
state.settings.sound=!state.settings.sound;saveState();
if(typeof render==='function')render();
rhNoteBtn();rhSndSync();
if(state.settings.sound)rhTestSound();else showToast('Ήχος ανενεργός.');
}
function rhTestSound(){
if(!state.settings.sound){showToast('Ο ήχος είναι ανενεργός.');return;}
try{if(typeof beep==='function')beep();}catch(e){}
var b=document.getElementById('rhNoteBtn');
if(b){b.classList.remove('ping');void b.offsetWidth;b.classList.add('ping');setTimeout(function(){b.classList.remove('ping');},400);}
showToast('Έτσι ακούγεται το σήμα.');
}
rhLightInit();
rhNoteBtn();
rhPomoFrame();
rhStripRepo();
if(!window.__rhLightV4){
window.__rhLightV4=true;
var hdr=document.querySelector('header')||document.querySelector('.header');
if(hdr&&typeof MutationObserver==='function')new MutationObserver(function(){rhNoteBtn();}).observe(hdr,{childList:true,subtree:true});
var ov=document.getElementById('modalOverlay');
if(ov&&typeof MutationObserver==='function')new MutationObserver(function(){rhStripRepo();}).observe(ov,{childList:true,subtree:true});
document.addEventListener('click',function(ev){
var p=document.getElementById('rhSoundPanel');
if(!p||!p.classList.contains('open'))return;
var b=document.getElementById('rhNoteBtn');
if(p.contains(ev.target)||(b&&b.contains(ev.target)))return;
rhSndClose();
});
var sndGuard=function(ev){
var p=document.getElementById('rhSoundPanel');
if(p&&p.classList.contains('open'))ev.stopImmediatePropagation();
};
window.addEventListener('scroll',sndGuard,true);
document.addEventListener('scroll',sndGuard,true);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')rhSndClose();});
window.addEventListener('resize',function(){rhSndClose();var b=document.getElementById('rhNoteBtn');if(b)rhSndSync();});
}

</script>

<script>
/* ===== ΡΥΘΜΟΣ v5: ΥΠΝΟΣ + AUDIT + ΤΡΙΑ ΝΟΥΜΕΡΑ + ΕΦΙΚΤΟΤΗΤΑ + ΚΑΤΑΓΡΑΦΗ + NOTES ===== */
function rhHM2(v){var p=String(v||'0:0').split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0);}
function rhLoggedAt(type,id,a,b){
var m=0;
state.logs.forEach(function(l){if(l.type===type&&l.id===id)m+=overlap(l.start,l.end,a,b)/60000;});
var ac=state.active;
if(ac&&ac.type===type&&ac.id===id)m+=overlap(ac.start,ac.pausedAt||Date.now(),a,b)/60000;
return m;
}

/* ---------- ΥΠΝΟΣ: ΜΙΑ ΠΗΓΗ ---------- */
function rhSleepList(k){
var w=(state.sleep&&state.sleep.windows)?state.sleep.windows[k]:null;
if(!w)return [];
if(Array.isArray(w))return w.filter(function(x){return x&&x.end>x.start;});
if(w.start&&w.end&&w.end>w.start)return [{start:w.start,end:w.end}];
return [];
}
function rhSleepSet(k,arr){
state.sleep.windows=state.sleep.windows||{};
state.sleep.hours=state.sleep.hours||{};
if(!arr.length){delete state.sleep.windows[k];delete state.sleep.hours[k];return;}
arr.sort(function(a,b){return a.start-b.start;});
state.sleep.windows[k]=arr;
var ms=0;arr.forEach(function(x){ms+=x.end-x.start;});
state.sleep.hours[k]=ms/3600000;
}
function rhSleepNorm(){
if(!state.sleep)return;
state.sleep.windows=state.sleep.windows||{};
Object.keys(state.sleep.windows).forEach(function(k){rhSleepSet(k,rhSleepList(k));});
}
function sleepTodayMin(){
var k=getDailyPlanKey(),s=startOfDay(),e=startOfNextDay(),now=Date.now(),ms=0;
rhSleepList(k).forEach(function(w){ms+=Math.max(0,Math.min(w.end,e,now)-Math.max(w.start,s));});
if(state.sleep&&state.sleep.asleep&&state.sleep.startedAt){
var a=Math.max(state.sleep.startedAt,s),b=Math.min(now,e);
if(b>a)ms+=b-a;
}
return Math.round(ms/60000);
}
var rhWakeOrig=(typeof window.sleepWake==='function')?window.sleepWake:null;
window.sleepWake=function(){
var k=getDailyPlanKey(),before=rhSleepList(k).slice();
var r=rhWakeOrig?rhWakeOrig.apply(this,arguments):null;
var raw=state.sleep.windows?state.sleep.windows[k]:null;
var list=before.slice();
if(raw&&!Array.isArray(raw)&&raw.start&&raw.end>raw.start)list.push({start:raw.start,end:raw.end});
rhSleepSet(k,list);saveState();
return r;
};
var rhManOrig=(typeof window.sleepManual==='function')?window.sleepManual:null;
window.sleepManual=function(){
var r=rhManOrig?rhManOrig.apply(this,arguments):null;
rhSleepNorm();saveState();render();
return r;
};

/* ---------- AUDIT: ΗΜΕΡΑ ΓΙΑ ΘΕΣΕΙΣ, ΕΒΔΟΜΑΔΑ ΓΙΑ ΜΕΛΕΤΗ ---------- */
function dayAudit(ts){
var s=startOfDay(ts),e=startOfNextDay(s),now=Date.now(),checks=[];
var logged=allTotalMin(s,e);
if(logged<=0)return {empty:true,checks:[],score:0,ok:false,logged:0};
FIXED_DEFS.forEach(function(d){
var m=totalMin('fixed',d.id,s,e);
if(m<=0&&!d.hard&&!d.target)return;
var rest=(typeof isRestorative==='function')?isRestorative(d):(d.categoryId==='recover');
var cap=rest?(d.weekly/7):d.daily;
var ok=rest?(typeof rhRestorativeOk==='function'?rhRestorativeOk(d,s):m<=cap*2+0.5):(m<=cap+0.5);
checks.push({label:d.name+' — όριο',ok:ok,detail:fmtHM(m)+' / '+fmtHM(cap)});
});
if(typeof scheduleGetDay==='function'&&typeof mondayIndex==='function'){
var slots=scheduleGetDay(mondayIndex(s)),want=0,got=0;
slots.forEach(function(sl){
var eff=(typeof slotEff==='function')?slotEff(sl):sl;
var a=s+rhHM2(eff.start)*60000,b=s+rhHM2(eff.end)*60000;
if(b>Math.min(now,e))return;
var parts=(typeof slotActivityParts==='function')?slotActivityParts(sl):{type:'fixed',id:''};
want+=(b-a)/60000;got+=rhLoggedAt(parts.type,parts.id,a,b);
});
if(want>0)checks.push({label:'Θέσεις ημέρας',ok:got>=want*0.9-0.5,detail:fmtHM(got)+' / '+fmtHM(want)});
}
var target=state.courses.filter(function(c){return c.active&&c.hours>0;}).reduce(function(a,c){return a+c.hours*60;},0);
if(target>0){
var from=s-6*86400000,study=0;
state.courses.forEach(function(c){if(c.active&&c.hours>0)study+=totalMin('course',c.id,from,e);});
var first=state.logs.length?state.logs.reduce(function(a,l){return Math.min(a,l.start);},now):now;
var span=Math.max(1,Math.min(7,Math.floor((e-Math.max(first,from))/86400000)+1));
var want2=target*span/7;
checks.push({label:'Μελέτη '+span+' ημερών',ok:study>=want2*0.9-0.5,detail:fmtHM(study)+' / '+fmtHM(want2)});
}
var sl=(state.sleep&&state.sleep.hours)?(state.sleep.hours[getDailyPlanKey(s)]||0):0;
if(sl>0){var tg=state.settings.sleepHours*60;checks.push({label:'Ύπνος',ok:sl*60>=tg*0.85,detail:fmtHM(sl*60)+' / '+fmtHM(tg)});}
var pass=checks.filter(function(c){return c.ok;}).length;
return {empty:checks.length===0,checks:checks,score:checks.length?pass/checks.length*100:0,ok:checks.length>0&&pass===checks.length,logged:logged};
}
function dayAuditCardHTML(){
var a=dayAudit(Date.now());
var h='<div class="card"><h3>Έλεγχος σημερινής ημέρας</h3>';
if(a.empty)return h+'<p class="note">Καμία υποχρέωση για σήμερα ή καμία καταγραφή ακόμα. Η ημέρα δεν μετράει στο Compliance.</p></div>';
h+='<div class="stack" style="margin-top:10px">';
a.checks.forEach(function(c){
h+='<div class="list-row"><div class="list-left"><strong>'+esc(c.label)+'</strong><span class="muted" style="font-size:.74rem">'+esc(c.detail)+'</span></div><span class="pill '+(c.ok?'success':'danger')+'">'+(c.ok?'Τηρήθηκε':'Όχι')+'</span></div>';
});
h+='</div><div class="plan-row" style="margin-top:10px"><span>Σκορ ημέρας</span><strong class="'+(a.ok?'text-success':'text-warn')+'">'+Math.round(a.score)+'%</strong></div>';
h+='<p class="note">Τα όρια και οι θέσεις κρίνονται στη ημέρα. Η μελέτη κρίνεται σε κυλιόμενο επταήμερο, όχι ως ημερήσιο μερίδιο — δεν απαιτείται διάβασμα κάθε μέρα για να περάσει η ημέρα.</p></div>';
return h;
}

/* ---------- ΤΡΙΑ ΑΛΗΘΗ ΝΟΥΜΕΡΑ ---------- */
function rhTodayNums(){
var s=startOfDay(),e=startOfNextDay();
var awake=(typeof todayAwakeMin==='function')?todayAwakeMin():(1440-state.settings.sleepHours*60);
var logged=allTotalMin(s,e),planned=0;
if(typeof scheduleGetDay==='function'&&typeof mondayIndex==='function'){
scheduleGetDay(mondayIndex()).forEach(function(sl){
var eff=(typeof slotEff==='function')?slotEff(sl):sl;
planned+=Math.max(0,rhHM2(eff.end)-rhHM2(eff.start));
});
}
return {awake:awake,planned:planned,logged:logged,free:awake-logged};
}
function rhNumsCardHTML(){
var n=rhTodayNums();
return '<div class="card"><h3>Σήμερα</h3><div class="rh-num">'
+'<div class="stat-box"><span>Ξύπνιος χρόνος</span><strong>'+fmtHM(n.awake)+'</strong></div>'
+'<div class="stat-box"><span>Προγραμματισμένα</span><strong>'+fmtHM(n.planned)+'</strong></div>'
+'<div class="stat-box"><span>Καταγεγραμμένα</span><strong>'+fmtHM(n.logged)+'</strong></div>'
+'<div class="stat-box"><span>Απομένουν</span><strong class="'+(n.free<0?'text-danger':'text-success')+'">'+fmtHM(n.free)+'</strong></div>'
+'</div><p class="note">Ξύπνιος από πραγματικό ύπνο, προγραμματισμένα από τις θέσεις της ημέρας, καταγεγραμμένα από το ημερολόγιο. Κανένα εκτιμώμενο εβδομαδιαίο μερίδιο.</p></div>';
}

/* ---------- ΕΦΙΚΤΟΤΗΤΑ ΕΞΕΤΑΣΤΙΚΗΣ ---------- */
function rhFeasibility(){
var awake=(typeof todayAwakeMin==='function')?todayAwakeMin():(1440-state.settings.sleepHours*60);
var courses=state.courses.filter(function(c){return c.active&&c.hours>0;});
var need=courses.reduce(function(a,c){return a+c.hours*60/7;},0);
var slots=(state.schedule&&state.schedule.slots)||[];
var fixedDaily,src;
if(slots.length){
var tot=0;
slots.forEach(function(s){if(String(s.activityId||'').indexOf('fixed:')===0)tot+=Math.max(0,rhHM2(s.end)-rhHM2(s.start));});
fixedDaily=tot/7;src='από τις θέσεις σου';
}else{
fixedDaily=FIXED_DEFS.reduce(function(a,d){return a+(d.weekly||0)/7;},0);src='εκτίμηση από τα εβδομαδιαία όρια';
}
return {awake:awake,need:need,fixed:fixedDaily,src:src,free:awake-fixedDaily,ok:need<=awake-fixedDaily,courses:courses};
}
function rhFeasCardHTML(){
var f=rhFeasibility();
if(!f.courses.length)return '';
var h='<div class="card"><h3>Βγαίνει η εξεταστική;</h3>'
+'<div class="rh-fs-row"><div><b>Διαθέσιμο για μελέτη</b><small>'+fmtHM(f.awake)+' ξύπνιος μείον '+fmtHM(f.fixed)+' σταθερές ('+f.src+')</small></div><strong>'+fmtHM(f.free)+'</strong></div>'
+'<div class="rh-fs-row"><div><b>Απαιτούμενη μελέτη</b><small>Άθροισμα εβδομαδιαίων στόχων διά 7</small></div><strong>'+fmtHM(f.need)+'</strong></div>'
+'<div class="rh-fs-row"><div><b>'+(f.ok?'Βγαίνει':'Δεν βγαίνει')+'</b><small>'+(f.ok?'Περισσεύουν '+fmtHM(f.free-f.need)+' την ημέρα.':'Λείπουν '+fmtHM(f.need-f.free)+' την ημέρα. Κόψε στόχο ή σταθερές, αλλιώς θα το ανακαλύψεις την τελευταία εβδομάδα.')+'</small></div><span class="pill '+(f.ok?'success':'danger')+'">'+(f.ok?'Εφικτό':'Έλλειμμα')+'</span></div>';
h+='<div class="rh-tl-label" style="margin-top:12px">Ανά μάθημα</div>';
f.courses.forEach(function(c){
var per=c.hours*60/7,ex='';
if(c.examDate){
var dd=Math.round((startOfDay(new Date(c.examDate+'T12:00:00').getTime())-startOfDay())/86400000);
if(dd>=0)ex=dd+' ημέρες έως την εξέταση';else ex='η εξέταση πέρασε';
}
h+='<div class="rh-fs-row"><div><b style="color:'+c.color+'">'+esc(c.name)+'</b><small>'+(ex||'χωρίς ημερομηνία εξέτασης')+'</small></div><strong>'+fmtHM(per)+'/ημέρα</strong></div>';
});
return h+'</div>';
}

/* ---------- ΧΕΙΡΟΚΙΝΗΤΗ ΚΑΤΑΓΡΑΦΗ ---------- */
function rhAddLog(){
var opts='<optgroup label="Μαθήματα">'+state.courses.filter(function(c){return c.active;}).map(function(c){return '<option value="course:'+c.id+'">'+esc(c.name)+'</option>';}).join('')+'</optgroup>'
+'<optgroup label="Δραστηριότητες">'+FIXED_DEFS.map(function(d){return '<option value="fixed:'+d.id+'">'+esc(d.name)+'</option>';}).join('')+'</optgroup>';
var now=new Date(),pad=function(n){return (n<10?'0':'')+n;};
var endT=pad(now.getHours())+':'+pad(now.getMinutes());
var st=new Date(now.getTime()-3600000);
var startT=pad(st.getHours())+':'+pad(st.getMinutes());
var body='<div class="field"><label>Τι έκανες</label><select id="alAct">'+opts+'</select></div>'
+'<div class="field"><label>Ημερομηνία</label><input type="date" id="alDate" value="'+getDailyPlanKey()+'"></div>'
+'<div class="field" style="display:flex;gap:8px"><div style="flex:1"><label>Από</label><input type="time" id="alStart" value="'+startT+'"></div>'
+'<div style="flex:1"><label>Έως</label><input type="time" id="alEnd" value="'+endT+'"></div></div>'
+'<p class="note">Για δουλειά που ξέχασες να καταγράψεις. Αν η λήξη είναι πριν την έναρξη, περνάει στα μεσάνυχτα της επόμενης ημέρας.</p>'
+'<div id="alErr" class="form-error"></div>';
openModal({title:'Νέα καταγραφή',body:body,buttons:[{text:'Άκυρο',class:'btn-ghost'},{text:'Καταχώρηση',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet'),err=sh.querySelector('#alErr');
var v=sh.querySelector('#alAct').value,dv=sh.querySelector('#alDate').value;
var sv=sh.querySelector('#alStart').value,ev=sh.querySelector('#alEnd').value;
if(!v||!dv||!sv||!ev){err.textContent='Συμπλήρωσε όλα τα πεδία.';err.classList.add('show');return false;}
var base=startOfDay(new Date(dv+'T12:00:00').getTime());
if(!isFinite(base)){err.textContent='Λάθος ημερομηνία.';err.classList.add('show');return false;}
var a=base+rhHM2(sv)*60000,b=base+rhHM2(ev)*60000;
if(b<=a)b+=86400000;
var mins=(b-a)/60000;
if(mins<1||mins>960){err.textContent='Διάρκεια εκτός ορίων (1 λεπτό έως 16 ώρες).';err.classList.add('show');return false;}
if(b>Date.now()+60000){err.textContent='Δεν γίνεται καταγραφή στο μέλλον.';err.classList.add('show');return false;}
var p=v.split(':'),type=p[0],id=p.slice(1).join(':');
addLogSplit(type,id,a,b);
saveState();closeModal();render();showToast('Καταγράφηκε '+fmtHM(mins)+'.');
}}]});
}

/* ---------- FEEDBACK & DEV NOTES ---------- */
var RH_DEV_SEED=[
{t:'Σύνδεση διαλειμμάτων Pomodoro με Ευεξία',d:'Τα διαλείμματα του pomodoro να μετράνε ως διάλειμμα ματιών και σηκώματος. Τώρα ο μετρητής μηδενίζει σε κάθε κύκλο και με 25/5 η ευεξία δεν χτυπάει ποτέ.',done:false},
{t:'Ενιαίο πέρασμα render',d:'Κατάργηση των mounts που σβήνουν κάρτες μετά το render. Μία δηλωμένη λίστα καρτών, ένα πέρασμα.',done:false},
{t:'Θέματα ως μεταβλητές',d:'Δύο βασικά σχήματα και accent ως μεταβλητή, αντί για επτά πλήρη σετ overrides που σπάνε σε κάθε νέο στοιχείο.',done:false}
];
function rhNotesInit(){
if(!Array.isArray(state.devNotes))state.devNotes=RH_DEV_SEED.map(function(x){return {t:x.t,d:x.d,done:x.done,ts:Date.now()};});
if(!Array.isArray(state.feedback))state.feedback=[];
if(typeof state.feedbackDraft!=='string')state.feedbackDraft='';
if(!state.feedbackKind)state.feedbackKind='Ιδέα';
}
function rhDnAdd(){
var el=document.getElementById('rhDnInput');if(!el)return;
var v=(el.value||'').trim();if(!v){showToast('Γράψε κάτι πρώτα.');return;}
state.devNotes.unshift({t:v,d:'',done:false,ts:Date.now()});
