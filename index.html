<script>
/* ===== UX v1: ΕΝΑ ΣΥΝΟΛΟ + ΙΕΡΑΡΧΙΑ + ΙΣΤΟΡΙΚΟ + STEPPERS ===== */
var rhHistOff=0;
function rhHistStart(){return startOfDay(Date.now()-rhHistOff*86400000);}
function rhHistGo(d){
rhHistOff=Math.max(0,Math.min(365,rhHistOff+d));
var w=document.getElementById('rh-hist-card');
if(w)w.innerHTML=rhHistCardHTML();

function rhHistName(type,id){
if(typeof rhActName==='function')return rhActName(type,id);
if(type==='course'){var c=state.courses.find(function(x){return x.id===id;});return c?c.name:'Μάθημα';}
var d=FIXED_DEFS.find(function(x){return x.id===id;});return d?d.name:'Δραστηριότητα';
}
function rhSteppers(main){
Array.prototype.slice.call(main.querySelectorAll('.field input[type="number"]')).forEach(function(inp){
if(inp.getAttribute('data-rh-step'))return;
inp.setAttribute('data-rh-step','1');
var wrap=document.createElement('div');wrap.className='rh-step';
inp.parentNode.insertBefore(wrap,inp);
wrap.appendChild(inp);
var step=parseFloat(inp.getAttribute('step'))||1;
var mk=function(txt,dir){
var b=document.createElement('button');
b.type='button';b.className='rh-step-btn';b.textContent=txt;
b.setAttribute('aria-label',dir>0?'Αύξηση':'Μείωση');
b.onclick=function(){
var v=parseFloat(inp.value)||0,nv=v+dir*step;
var mn=parseFloat(inp.getAttribute('min')),mx=parseFloat(inp.getAttribute('max'));
if(isFinite(mn))nv=Math.max(mn,nv);
if(isFinite(mx))nv=Math.min(mx,nv);
inp.value=nv;
inp.dispatchEvent(new Event('input',{bubbles:true}));
inp.dispatchEvent(new Event('change',{bubbles:true}));
};
return b;
};
wrap.insertBefore(mk('−',-1),inp);
wrap.appendChild(mk('+',1));
});
}
function rhUxPass(){

}

}
}
if(label.indexOf('Ρυθμίσεις')>=0)rhSteppers(main);
if(label.indexOf('Ανάλυση')>=0&&!document.getElementById('rh-hist-card')){
var w=document.createElement('div');w.id='rh-hist-card';w.innerHTML=rhHistCardHTML();

Array.prototype.slice.call(main.querySelectorAll('.card')).forEach(function(c){

c.classList.toggle('rh-urgent',u);

});
}

/* ===== ΤΕΛΟΣ UX v1 ===== */
</script>

<script>
/* ===== ΜΑΘΗΜΑΤΑ v1: ΚΑΤΗΓΟΡΙΑ ΜΕΛΕΤΗΣ + ΕΜΒΟΛΙΜΕΣ + ΜΗΝΙΑΙΑ CRUD ===== */
(function(){
if(!ACT_CATS.some(function(c){return c.id==='study';})){
ACT_CATS.splice(1,0,{id:'study',name:'Μαθήματα',color:'#4f46e5',color2:'#7c3aed'});
}
})();
var RH_SEED_IDS=['osy','qm1','mech1','comp','elec','makeup1','makeup2'];
function rhCourseLogged(id){
var t=0;state.logs.forEach(function(l){if(l.type==='course'&&l.id===id)t+=(l.dur||0);});
return t;
}
function mergeCourses(saved){
var arr=Array.isArray(saved)?saved:[];
return arr.map(function(c){
return Object.assign({hours:0,totalHours:0,off:[],type:'core',active:false,color:'#6366f1',color2:'#8b5cf6',short:(c.name||'Μ').charAt(0)},c,{off:[]});
});
}
function rhStudyInit(){
if(typeof state.settings.showMakeup==='undefined')state.settings.showMakeup=true;
if(!state.__studyMigrated){
state.__studyMigrated=true;
var keep=[];
state.courses.forEach(function(c){
if(RH_SEED_IDS.indexOf(c.id)>=0&&rhCourseLogged(c.id)<=0.01)return;
keep.push(c);
});
state.courses=keep;
if(!state.courses.some(function(c){return c.type==='makeup';})){
for(var i=1;i<=2;i++){
state.courses.push({id:'mk'+i,name:'Εμβόλιμη θέση '+i,short:'Ε'+i,hours:0,totalHours:0,off:[],type:'makeup',active:false,color:'#0ea5e9',color2:'#0284c7',examDate:''});
}
}
saveState();
}
state.courses.forEach(function(c){
if(typeof c.totalHours==='undefined')c.totalHours=0;
if(!c.short)c.short=(c.name||'Μ').charAt(0);
if(!Array.isArray(c.off))c.off=[];
});
}
function rhMakeupAdd(){
var n=state.courses.filter(function(c){return c.type==='makeup';}).length+1;
var id='mk'+Date.now();
state.courses.push({id:id,name:'Εμβόλιμη θέση '+n,short:'Ε'+n,hours:0,totalHours:0,off:[],type:'makeup',active:false,color:'#0ea5e9',color2:'#0284c7',examDate:''});
saveState();render();rhStudyEditor(id);
}
function rhMakeupTrim(){
var mk=state.courses.filter(function(c){return c.type==='makeup';});
for(var i=mk.length-1;i>=0;i--){
if(rhCourseLogged(mk[i].id)<=0.01){
state.courses=state.courses.filter(function(c){return c.id!==mk[i].id;});
saveState();render();showToast('Αφαιρέθηκε κενή εμβόλιμη.');return;
}
}
showToast('Όλες οι εμβόλιμες έχουν καταγραφές.');
}
function rhToggleMakeup(){
state.settings.showMakeup=!state.settings.showMakeup;
saveState();render();
}
function rhCourseDel(id){
var c=state.courses.find(function(x){return x.id===id;});if(!c)return;
var mins=rhCourseLogged(id);
confirmModal('Διαγραφή','«'+c.name+'»'+(mins>0.01?' και '+fmtHM(mins)+' καταγραφές':'')+'. Οριστικό.',function(){
if(state.active&&state.active.type==='course'&&state.active.id===id)endSession(true);
state.courses=state.courses.filter(function(x){return x.id!==id;});
state.logs=state.logs.filter(function(l){return !(l.type==='course'&&l.id===id);});
if(state.schedule&&state.schedule.slots)state.schedule.slots=state.schedule.slots.filter(function(s){return s.activityId!=='course:'+id;});
saveState();closeModal();render();showToast('Διαγράφηκε.');
},'Διαγραφή');
}
function rhStudyCard(c,i){
var info=courseInfo(c);
var isActive=state.active&&state.active.type==='course'&&state.active.id===c.id;
var other=state.active&&!isActive;
var wk=info.targetMin||0;
var wp=wk?clamp(info.weekMin/wk*100,0,100):0;
var tot=(c.totalHours||0)*60;
var done=totalMin('course',c.id,state.semesterStart||0,Date.now()+86400000);
var tp=tot?clamp(done/tot*100,0,100):0;
var ex='—',exSub='χωρίς ημερομηνία';
if(c.examDate){
var dd=Math.round((startOfDay(new Date(c.examDate+'T12:00:00').getTime())-startOfDay())/86400000);
if(dd>=0){ex=dd+' ημ.';exSub='έως την εξέταση';}else{ex='Πέρασε';exSub='η εξέταση';}
}
var sc='info',st='Εντός';
if(!c.active){sc='info';st='Ανενεργό';}
else if(wk&&info.weekMin>=wk-0.5){sc='success';st='Στόχος';}
else if(wp>=80){sc='warn';st='Οριακά';}
else if(c.examDate&&ex!=='Πέρασε'&&parseInt(ex,10)<=7){sc='danger';st='Κοντά εξέταση';}
var btn;
if(isActive)btn='<button class="btn btn-stop" onclick="stopActive()">Διακοπή</button>';
else if(other)btn='<button class="btn btn-primary" disabled>Τρέχει άλλο</button>';
else if(!c.active)btn='<button class="btn btn-primary" disabled>Ανενεργό</button>';
else btn='<button class="btn btn-primary" onclick="startCourse(\''+c.id+'\')">Έναρξη</button>';
return '<article class="card activity '+(isActive?'running':'')+'" style="--accent:'+c.color+';--accent2:'+(c.color2||c.color)+';animation-delay:'+(i*0.03)+'s">'
+'<div class="activity-head"><div class="icon">'+esc(c.short||c.name.charAt(0))+'</div>'
+'<div class="activity-title"><h3>'+esc(c.name)+'</h3><p class="muted">'+(c.type==='makeup'?'Εμβόλιμη · ':'')+(wk?fmtHM(wk)+' / εβδομάδα':'χωρίς εβδομαδιαίο στόχο')+'</p></div>'
+'<span class="pill '+sc+'">'+st+'</span></div>'
+'<div class="metrics">'
+'<div class="metric"><span>Εβδομάδα</span><strong>'+(wk?fmtHM(Math.max(0,wk-info.weekMin)):'—')+'</strong><div class="progress"><span style="width:'+wp+'%"></span></div><small>'+fmtHM(info.weekMin)+(wk?' / '+fmtHM(wk):'')+'</small></div>'
+'<div class="metric"><span>Συνολικός στόχος</span><strong>'+(tot?fmtHM(Math.max(0,tot-done)):'—')+'</strong><div class="progress '+(tot&&done>=tot?'':'')+'"><span style="width:'+tp+'%"></span></div><small>'+fmtHM(done)+(tot?' / '+fmtHM(tot)+' · '+Math.round(tp)+'%':' · χωρίς στόχο')+'</small></div>'
+'<div class="metric"><span>Εξέταση</span><strong>'+ex+'</strong><small>'+exSub+'</small></div>'
+'</div>'
+'<div class="actions">'+btn
+'<button class="btn btn-ghost" onclick="rhStudyEditor(\''+c.id+'\')">✎</button>'
+'<button class="btn btn-ghost-danger" onclick="rhCourseDel(\''+c.id+'\')">✕</button>'
+'</div></article>';
}
function renderActivities(){
var html='<div class="actions" style="margin:0 0 12px"><button class="btn btn-primary" onclick="openFixedEditor(null)">+ Νέα δραστηριότητα</button>'
+'<button class="btn btn-ghost" onclick="rhStudyEditor(null)">+ Νέο μάθημα</button></div>';
if(!FIXED_DEFS.length&&!state.courses.length){
html+='<div class="rh-empty">Καμία δραστηριότητα ακόμα. Φτιάξε μία και διάλεξε κατηγορία — τα μαθήματα πάνε στην κατηγορία «Μαθήματα».</div>';
}
ACT_CATS.forEach(function(cat){
if(cat.id==='study')return;
var list=FIXED_DEFS.filter(function(d){return (d.categoryId||'organize')===cat.id;});
if(!list.length)return;

<script>
/* ===== POLISH v1: ΤΑΥΤΟΤΗΤΑ ΧΡΩΜΑΤΟΣ + ΕΥΘΥΓΡΑΜΜΙΣΗ + ΦΙΛΤΡΑ ===== */
var RH_SWATCHES=['#6366f1','#0ea5e9','#06b6d4','#10b981','#84cc16','#f59e0b','#f97316','#ef4444','#ec4899','#a855f7','#8b5cf6','#64748b'];
function rhHex2Rgb(h){
h=String(h||'').replace('#','');
if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
if(h.length!==6)return {r:99,g:102,b:241};
return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
}
function rhRgb2Hex(r,g,b){
var f=function(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16);};
return '#'+f(r)+f(g)+f(b);
}
function rhShade(hex,amt){
var c=rhHex2Rgb(hex),t=amt<0?0:255,p=Math.abs(amt)/100;
return rhRgb2Hex(c.r+(t-c.r)*p,c.g+(t-c.g)*p,c.b+(t-c.b)*p);
}
function rhLum(hex){var c=rhHex2Rgb(hex);return (0.2126*c.r+0.7152*c.g+0.0722*c.b)/255;}
function rhPair(hex){var l=rhLum(hex);return {a:hex,b:l<0.28?rhShade(hex,28):rhShade(hex,-26)};}
function rhPickColor(){
var used={};
FIXED_DEFS.forEach(function(d){used[String(d.color||'').toLowerCase()]=1;});
state.courses.forEach(function(c){used[String(c.color||'').toLowerCase()]=1;});
for(var i=0;i<RH_SWATCHES.length;i++){if(!used[RH_SWATCHES[i]])return RH_SWATCHES[i];}
return RH_SWATCHES[Math.floor(Math.random()*RH_SWATCHES.length)];
}
function rhColorInit(){
FIXED_DEFS.forEach(function(d){
if(!d.color)d.color=rhPickColor();
if(!d.color2||String(d.color2).toLowerCase()===String(d.color).toLowerCase())d.color2=rhPair(d.color).b;
});
state.courses.forEach(function(c){
if(!c.color)c.color=rhPickColor();
if(!c.color2||String(c.color2).toLowerCase()===String(c.color).toLowerCase())c.color2=rhPair(c.color).b;
});
}
function rhActColor(type,id){
if(type==='course'){var c=state.courses.find(function(x){return x.id===id;});return c?c.color:'#64748b';}
var d=FIXED_DEFS.find(function(x){return x.id===id;});
return d?(d.color||'#64748b'):'#64748b';
}
function unplacedBadgesMount(){}
function rhSwatchRow(inputId,cur){
var h='<div class="rh-sw-row">';
RH_SWATCHES.forEach(function(c){
h+='<button type="button" class="rh-sw-btn'+(c.toLowerCase()===String(cur).toLowerCase()?' on':'')+'" data-col="'+c+'" style="background:'+c+'" onclick="rhPickSwatch(this,\''+inputId+'\')" aria-label="Χρώμα '+c+'"></button>';
});
h+='<label class="rh-sw-custom" title="Προσαρμοσμένο χρώμα"><input type="color" id="'+inputId+'" value="'+cur+'" oninput="rhSwatchSync(\''+inputId+'\')"><span>+</span></label></div>'
+'<div class="rh-sw-prev"><span class="rh-sw-icon" id="'+inputId+'Prev"></span><b id="'+inputId+'Name">Προεπισκόπηση</b></div>';
return h;
}
function rhPickSwatch(btn,inputId){
var inp=document.getElementById(inputId);if(!inp)return;
inp.value=btn.getAttribute('data-col');
rhSwatchSync(inputId);
}
function rhSwatchSync(inputId){
var inp=document.getElementById(inputId);if(!inp)return;
var col=inp.value,row=inp.closest('.rh-sw-row');
if(row)Array.prototype.forEach.call(row.querySelectorAll('.rh-sw-btn'),function(b){b.classList.toggle('on',String(b.getAttribute('data-col')).toLowerCase()===col.toLowerCase());});
var p=document.getElementById(inputId+'Prev');
if(p){var pr=rhPair(col);p.style.background='linear-gradient(140deg,'+pr.a+','+pr.b+')';p.style.color=rhInk(col);}
}
function rhNamePrev(nameId,inputId){
var n=document.getElementById(nameId),p=document.getElementById(inputId+'Prev'),t=document.getElementById(inputId+'Name');
var v=n?n.value.trim():'';
if(p)p.textContent=(v.charAt(0)||'•').toUpperCase();
if(t)t.textContent=v||'Προεπισκόπηση';
}
function fixedCard(def,index){
var info=fixedInfo(def.id);
var rest=(typeof isRestorative==='function')?isRestorative(def):(def.categoryId==='recover');
var isActive=state.active&&state.active.type==='fixed'&&state.active.id===def.id;
var other=state.active&&!isActive;
var pr=rhPair(def.color||'#6366f1');
var dayPct=info.dailyCap?clamp(info.dayMin/info.dailyCap*100,0,100):0;
var weekLimit=rest?info.weeklyMax:info.weeklyCap;
var weekPct=weekLimit?clamp(info.weekMin/weekLimit*100,0,100):0;
var sc='info',st='Εντός';
if(info.weekMin>weekLimit+0.5){sc='danger';st='Υπέρβαση εβδομάδας';}
else if(info.dayMin>info.dailyCap+0.5){sc='danger';st='Υπέρβαση ημέρας';}
else if(rest&&info.weekMin>info.weeklyCap+0.5){sc='warn';st='Υπέρβαση βάσης';}
else if(info.target&&info.occ>info.target){sc='warn';st='Πάνω από στόχο';}
else if(info.target&&info.occ>=info.target){sc='success';st='Στόχος';}
else if(dayPct>=80||weekPct>=80){sc='warn';st='Οριακά';}
var dayText=info.dayRemaining>=0?fmtHM(info.dayRemaining):'+'+fmtHM(info.dayOver);
var weekText=info.weekMin<=weekLimit?fmtHM(weekLimit-info.weekMin):'+'+fmtHM(info.weekMin-weekLimit);
var tl='Στόχος',tv='—',ts='';
if(def.target){tv=info.occ+'/'+def.target;ts='φορές';}
else if(rest){tl='Υπερβάσεις';tv=info.overs+'/'+info.allowed;ts='Διπλό '+fmtPrecise(info.double);}

function rhSWReg(){
if(!('serviceWorker' in navigator))return Promise.resolve(null);
return navigator.serviceWorker.getRegistration().then(function(r){
if(r)return r;
return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.getRegistration();}).catch(function(){return null;});
}).catch(function(){return null;});
}
function rhSWActive(){
return rhSWReg().then(function(r){
if(!r)return null;
if(navigator.serviceWorker.controller)return navigator.serviceWorker.controller;
if(r.active)return r.active;
return new Promise(function(res){
var w=r.waiting||r.installing;
if(!w){res(null);return;}
var t=setTimeout(function(){res(r.active||null);},4500);
w.addEventListener('statechange',function(){
if(w.state==='activated'){clearTimeout(t);res(r.active||w);}
});
});
});
}
function safeCtl(){
if(navigator.serviceWorker&&navigator.serviceWorker.controller)return navigator.serviceWorker.controller;
return null;
}
function safeSetForce(on,then){
rhSWActive().then(function(sw){
if(!sw){if(then)then(false);return;}
var done=false;
function onMsg(e){
if(e.data&&e.data.type==='force-written'){done=true;navigator.serviceWorker.removeEventListener('message',onMsg);if(then)then(true);}
}
navigator.serviceWorker.addEventListener('message',onMsg);
try{sw.postMessage({type:'set-force',on:!!on});}catch(e){}
setTimeout(function(){if(!done){navigator.serviceWorker.removeEventListener('message',onMsg);if(then)then(true);}},1800);
});
}
function rhDirectRollback(){
var paths=['good/index.html.txt','good/index.html','good/index.txt'];
safeToast('Φόρτωση αντιγράφου απευθείας…');
(function next(i){
if(i>=paths.length){safeToast('Δεν βρέθηκε έγκυρο αντίγραφο στον φάκελο good/.');return;}
fetch(paths[i]+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();}).then(function(t){
if(!t||t.length<5000||t.indexOf('app-version')<0)throw 0;
try{sessionStorage.setItem('r-direct-backup',paths[i]);}catch(e){}
document.open();document.write(t);document.close();
}).catch(function(){next(i+1);});
})(0);
}
function safeRollback(){
rhSWActive().then(function(sw){
if(!sw){rhDirectRollback();return;}
safeSetForce(true,function(ok){
if(ok===false){rhDirectRollback();return;}
location.reload();
});
});
}
function safeRetryLatest(){
try{sessionStorage.removeItem('r-direct-backup');}catch(e){}
rhSWActive().then(function(sw){
if(!sw){location.reload();return;}
safeSetForce(false,function(){location.reload();});
});
}

var b=c.querySelector('[onclick*="openFixedEditor"]');
if(b){var m=String(b.getAttribute('onclick')).match(/openFixedEditor\('([^']+)'\)/);if(m)return 'fixed:'+m[1];}
b=c.querySelector('[onclick*="rhStudyEditor"]');
if(b){var n=String(b.getAttribute('onclick')).match(/rhStudyEditor\('([^']+)'\)/);if(n)return 'course:'+n[1];}
return '';
}
function rhOrderInit(){
var s={};
FIXED_DEFS.forEach(function(d){
var g='f:'+(d.categoryId||'organize');
if(typeof d.rhOrder!=='number'){s[g]=(s[g]||0)+1;d.rhOrder=s[g];}else s[g]=Math.max(s[g]||0,d.rhOrder);
});
var c2={};
state.courses.forEach(function(c){
var g='c:'+(c.type==='makeup'?'makeup':'study');
if(typeof c.rhOrder!=='number'){c2[g]=(c2[g]||0)+1;c.rhOrder=c2[g];}else c2[g]=Math.max(c2[g]||0,c.rhOrder);
});
}
function rhGroupsAll(main){
var out=[],cur=null;
Array.prototype.forEach.call(main.children,function(el){
if(el.classList.contains('section-title')||el.classList.contains('rh-study-head')){cur={head:el,cards:[]};out.push(cur);return;}
if(cur&&el.classList.contains('card')&&el.classList.contains('activity'))cur.cards.push(el);
});
return out;
}
function rhApplyOrder(){
var main=document.querySelector('main');if(!main)return;
rhGroupsAll(main).forEach(function(g){
if(g.cards.length<2)return;
var want=g.cards.slice().sort(function(a,b){
var oa=rhActObj(rhCardKey(a)),ob=rhActObj(rhCardKey(b));
return ((oa&&oa.rhOrder)||0)-((ob&&ob.rhOrder)||0);
});
var same=true;
for(var i=0;i<want.length;i++){if(want[i]!==g.cards[i]){same=false;break;}}
if(same)return;
var after=g.cards[g.cards.length-1].nextSibling;
want.forEach(function(c){main.insertBefore(c,after);});
});
}
function rhSortBy(mode){
var groups={};
FIXED_DEFS.forEach(function(d){var g='f:'+(d.categoryId||'organize');(groups[g]=groups[g]||[]).push({o:d,t:'fixed'});});
state.courses.forEach(function(c){var g='c:'+(c.type==='makeup'?'makeup':'study');(groups[g]=groups[g]||[]).push({o:c,t:'course'});});
Object.keys(groups).forEach(function(g){
var arr=groups[g];
arr.sort(function(a,b){
if(mode==='name')return String(a.o.name||'').localeCompare(String(b.o.name||''),'el');
if(mode==='today')return totalMin(b.t,b.o.id,startOfDay(),startOfNextDay())-totalMin(a.t,a.o.id,startOfDay(),startOfNextDay());
if(mode==='week')return totalMin(b.t,b.o.id,startOfWeek(),startOfNextWeek())-totalMin(a.t,a.o.id,startOfWeek(),startOfNextWeek());
var ia=a.t==='course'?courseInfo(a.o):fixedInfo(a.o.id);
var ib=b.t==='course'?courseInfo(b.o):fixedInfo(b.o.id);
var va=a.t==='course'?(ia.remaining||0):Math.max(0,(ia.dayRemaining||0));
var vb=b.t==='course'?(ib.remaining||0):Math.max(0,(ib.dayRemaining||0));
return vb-va;
});
arr.forEach(function(x,i){x.o.rhOrder=i+1;});
});
saveState();rhApplyOrder();
showToast('Ταξινόμηση: '+({name:'όνομα',today:'σήμερα',week:'εβδομάδα',left:'υπόλοιπο'}[mode]||mode)+'.');
}
var rhDrag=null;
function rhGripDown(ev,card){
var main=document.querySelector('main');if(!main)return;
var grp=null;
rhGroupsAll(main).forEach(function(g){if(g.cards.indexOf(card)>=0)grp=g;});
if(!grp||grp.cards.length<2){showToast('Μία μόνο κάρτα σε αυτή την ομάδα.');return;}
ev.preventDefault();
rhDrag={card:card,sibs:grp.cards.filter(function(c){return c!==card;}),grp:grp};
card.classList.add('rh-dragging');
try{ev.currentTarget.setPointerCapture(ev.pointerId);}catch(e){}
document.addEventListener('pointermove',rhGripMove,{passive:false});
document.addEventListener('pointerup',rhGripUp);
document.addEventListener('pointercancel',rhGripUp);
}
function rhGripMove(ev){
if(!rhDrag)return;
ev.preventDefault();
var y=ev.clientY,card=rhDrag.card,main=document.querySelector('main');
for(var i=0;i<rhDrag.sibs.length;i++){
var s=rhDrag.sibs[i];
if(s.style.display==='none')continue;
var r=s.getBoundingClientRect(),mid=r.top+r.height/2;
var rel=s.compareDocumentPosition(card);
if(y<mid&&(rel&Node.DOCUMENT_POSITION_FOLLOWING)){main.insertBefore(card,s);return;}
if(y>mid&&(rel&Node.DOCUMENT_POSITION_PRECEDING)){main.insertBefore(card,s.nextSibling);return;}
}
}
function rhGripUp(){
if(!rhDrag)return;
var card=rhDrag.card,grp=rhDrag.grp;
card.classList.remove('rh-dragging');
var all=grp.cards.slice().sort(function(a,b){
return (a.compareDocumentPosition(b)&Node.DOCUMENT_POSITION_FOLLOWING)?-1:1;
});
all.forEach(function(c,i){var o=rhActObj(rhCardKey(c));if(o)o.rhOrder=i+1;});
saveState();
rhDrag=null;
document.removeEventListener('pointermove',rhGripMove);
document.removeEventListener('pointerup',rhGripUp);
document.removeEventListener('pointercancel',rhGripUp);
showToast('Η σειρά αποθηκεύτηκε.');
}
function rhAddGrips(main){
Array.prototype.forEach.call(main.querySelectorAll('.card.activity'),function(c){
var acts=c.querySelector('.actions');
if(!acts||acts.querySelector('.rh-grip'))return;
var g=document.createElement('span');
g.className='rh-grip';g.textContent='⠿';
g.setAttribute('role','button');
g.setAttribute('tabindex','0');
g.setAttribute('aria-label','Σύρε για αλλαγή σειράς');
g.addEventListener('pointerdown',function(ev){rhGripDown(ev,c);});
acts.insertBefore(g,acts.firstChild);
});
}
function rhSortBar(){
var t=document.getElementById('rhActTools');
if(!t||document.getElementById('rhSortBar'))return;
var d=document.createElement('div');
d.id='rhSortBar';d.className='rh-sortbar';
d.innerHTML='<button type="button" onclick="rhSortBy(\'name\')">Όνομα</button>'
+'<button type="button" onclick="rhSortBy(\'today\')">Σήμερα</button>'
+'<button type="button" onclick="rhSortBy(\'week\')">Εβδομάδα</button>'
+'<button type="button" onclick="rhSortBy(\'left\')">Υπόλοιπο</button>';
t.appendChild(d);
}

/* ---------- ΜΑΖΙΚΕΣ ΚΑΤΑΓΡΑΦΕΣ ---------- */
var rhSel={},rhPendingUndo=null,rhUndoT=0;
function rhLogKey(L){return L.start+'|'+L.type+'|'+L.id;}
function rhSelN(){var n=0;Object.keys(rhSel).forEach(function(k){if(rhSel[k])n++;});return n;}
function rhSelSync(){
var bar=document.getElementById('rhBulkBar');if(!bar)return;
var n=rhSelN();
bar.style.display=n?'flex':'none';
var t=document.getElementById('rhBulkN');if(t)t.textContent=n+' επιλεγμένες';
}
function rhSelToggle(k,on){if(on)rhSel[k]=1;else delete rhSel[k];rhSelSync();}
function rhSelAll(on){
var s=rhHistStart(),e=startOfNextDay(s);
state.logs.forEach(function(L){if(L.end>s&&L.start<e){var k=rhLogKey(L);if(on)rhSel[k]=1;else delete rhSel[k];}});
var w=document.getElementById('rh-hist-card');if(w)w.innerHTML=rhHistCardHTML();
}
function rhSelKeys(){return Object.keys(rhSel).filter(function(k){return rhSel[k];});}
function rhUndoOffer(msg,fn){
rhPendingUndo={msg:msg,fn:fn,until:Date.now()+9000};
var w=document.getElementById('rh-hist-card');if(w)w.innerHTML=rhHistCardHTML();
clearTimeout(rhUndoT);
rhUndoT=setTimeout(function(){rhPendingUndo=null;var x=document.getElementById('rh-hist-card');if(x)x.innerHTML=rhHistCardHTML();},9000);
}
function rhUndoRun(){
if(!rhPendingUndo)return;
var f=rhPendingUndo.fn;rhPendingUndo=null;clearTimeout(rhUndoT);
f();saveState();render();showToast('Αναιρέθηκε.');
}
function rhBulkReassign(){
var keys=rhSelKeys();
if(!keys.length){showToast('Διάλεξε καταγραφές πρώτα.');return;}
var opts='<optgroup label="Μαθήματα">'+state.courses.map(function(c){return '<option value="course:'+c.id+'">'+esc(c.name)+'</option>';}).join('')+'</optgroup>'
+'<optgroup label="Δραστηριότητες">'+FIXED_DEFS.map(function(d){return '<option value="fixed:'+d.id+'">'+esc(d.name)+'</option>';}).join('')+'</optgroup>';
openModal({title:'Μεταφορά καταγραφών',body:'<p class="note">'+keys.length+' καταγραφές θα αλλάξουν δραστηριότητα. Ο χρόνος και οι ώρες μένουν ίδια.</p>'
+'<div class="field"><label>Νέα δραστηριότητα ή μάθημα</label><select id="brAct">'+opts+'</select></div>',
buttons:[{text:'Άκυρο',class:'btn-ghost'},{text:'Μεταφορά',class:'btn-primary',close:false,onClick:function(){
var sh=document.querySelector('#modalOverlay .sheet');
var v=sh.querySelector('#brAct').value;
var p=v.split(':'),nt=p[0],nid=p.slice(1).join(':');
var before=[];
state.logs.forEach(function(L){
var k=rhLogKey(L);
if(rhSel[k]){before.push({L:L,type:L.type,id:L.id});L.type=nt;L.id=nid;}
});
rhSel={};saveState();closeModal();render();
rhUndoOffer('Μεταφέρθηκαν '+before.length+' καταγραφές.',function(){
before.forEach(function(b){b.L.type=b.type;b.L.id=b.id;});
});
}}]});
}
function rhBulkDelete(){
var keys=rhSelKeys();
if(!keys.length){showToast('Διάλεξε καταγραφές πρώτα.');return;}
confirmModal('Διαγραφή',keys.length+' καταγραφές. Μπορείς να αναιρέσεις αμέσως μετά.',function(){
var removed=[];
state.logs=state.logs.filter(function(L){
if(rhSel[rhLogKey(L)]){removed.push(L);return false;}
return true;
});
rhSel={};saveState();closeModal();render();
rhUndoOffer('Διαγράφηκαν '+removed.length+' καταγραφές.',function(){
removed.forEach(function(L){state.logs.push(L);});
state.logs.sort(function(a,b){return a.start-b.start;});
});
},'Διαγραφή');
}
function rhHistCardHTML(){
var s=rhHistStart(),e=startOfNextDay(s),idx=[];
state.logs.forEach(function(L,i){if(L.end>s&&L.start<e)idx.push(i);});
var tot=allTotalMin(s,e);
var lbl=new Date(s).toLocaleDateString('el-GR',{weekday:'short',day:'numeric',month:'short'});
if(rhHistOff===0)lbl='Σήμερα';else if(rhHistOff===1)lbl='Χθες';
var h='<div class="card"><h3>Ιστορικό καταγραφών</h3>'
+'<div class="rh-hist-nav"><button type="button" class="btn btn-ghost" onclick="rhHistGo(1)" aria-label="Προηγούμενη ημέρα">‹</button>'
+'<div><strong>'+esc(lbl)+'</strong><small>'+fmtHM(tot)+' σύνολο · '+idx.length+' καταγραφές</small></div>'
+'<button type="button" class="btn btn-ghost" onclick="rhHistGo(-1)"'+(rhHistOff<=0?' disabled':'')+' aria-label="Επόμενη ημέρα">›</button></div>'
+'<div class="rh-hist-jump"><input type="date" value="'+getDailyPlanKey(s)+'" max="'+getDailyPlanKey()+'" onchange="rhHistSetDate(this.value)" aria-label="Μετάβαση σε ημερομηνία">'
+'<button type="button" onclick="rhHistGo(7)">−7</button>'
+'<button type="button" onclick="rhHistSetDate(\''+getDailyPlanKey()+'\')">Σήμερα</button></div>';
if(rhPendingUndo&&Date.now()<rhPendingUndo.until){
h+='<div class="rh-undo-row"><span>'+esc(rhPendingUndo.msg)+'</span><button type="button" onclick="rhUndoRun()">Αναίρεση</button></div>';
}
if(!idx.length)return h+'<p class="note">Καμία καταγραφή αυτή την ημέρα.</p></div>';
var allOn=idx.every(function(i){return !!rhSel[rhLogKey(state.logs[i])];});
h+='<div class="rh-bulk-head"><label class="rh-cb"><input type="checkbox"'+(allOn?' checked':'')+' onchange="rhSelAll(this.checked)"><span>Επιλογή όλων</span></label></div>'
+'<div id="rhBulkBar" class="rh-bulk-bar" style="display:'+(rhSelN()?'flex':'none')+'">'
+'<span id="rhBulkN">'+rhSelN()+' επιλεγμένες</span>'
+'<button type="button" onclick="rhBulkReassign()">Μεταφορά σε…</button>'
+'<button type="button" class="d" onclick="rhBulkDelete()">Διαγραφή</button></div>'
+'<div class="stack" style="margin-top:10px">';
idx.forEach(function(i){
var L=state.logs[i],k=rhLogKey(L);
h+='<div class="list-row rh-log-row"><label class="rh-cb"><input type="checkbox"'+(rhSel[k]?' checked':'')+' onchange="rhSelToggle(\''+k+'\',this.checked)" aria-label="Επιλογή καταγραφής"></label>'
+'<div class="list-left"><strong>'+esc(rhHistName(L.type,L.id))+'</strong>'
+'<span class="muted">'+fmtAbs(L.start)+' – '+fmtAbs(L.end)+'</span></div>'
+'<div class="list-value">'+fmtHM(L.dur)+'</div>'
+'<button class="btn btn-ghost" onclick="logEdit('+i+')" aria-label="Επεξεργασία">✎</button>'
+'<button class="btn btn-ghost-danger" onclick="logDel('+i+')" aria-label="Διαγραφή">✕</button></div>';
});
return h+'</div></div>';
}
function rhV6Pass(){
var main=document.querySelector('main');if(!main)return;
Array.prototype.forEach.call(main.querySelectorAll('.card.activity'),function(c){
var a=(c.style.getPropertyValue('--accent')||'').trim();
if(a){c.style.setProperty('--ink',rhInk(a));c.style.setProperty('--ink-sh',rhInkSh(a));}

var act=document.querySelector('.nav-btn.active');
if(act&&act.textContent.indexOf('Δραστηριότητες')>=0){
rhAddGrips(main);
rhSortBar();
rhApplyOrder();
}
}
rhOrderInit();
saveState();
/* ===== ΤΕΛΟΣ ΡΥΘΜΟΥ v6 ===== */

<script>
/* ===== POMODORO v3: ΡΥΘΜΙΖΟΜΕΝΟΙ ΚΥΚΛΟΙ + ΜΗ ΔΙΠΛΟΤΥΠΑ ΚΟΥΜΠΙΑ ===== */
var rhPomoOpts=[],rhPomoSelIdx=0,rhPomoModeVal='pomo';
function rhCycles(){var pm=PM();return clamp(parseInt(pm.cyclesBeforeLong,10)||4,1,12);}
function rhPhaseName(x){return x==='focus'?'Focus':x==='break'?'Διάλειμμα':x==='longbreak'?'Μεγάλο διάλειμμα':'Αναμονή νέου κύκλου';}
function rhPomoRepair(){
var pm=PM(),ch=false;
if(typeof pm.cyclesBeforeLong==='undefined'){pm.cyclesBeforeLong=4;ch=true;}
if(!state.__pomoRestored){state.__pomoRestored=true;if(state.settings.pomodoroEnabled===false){state.settings.pomodoroEnabled=true;ch=true;}}

}
function rhBuildOpts(){
var out=[],p=P(),seen={};
function addC(c){
var k='course:'+c.id;if(seen[k])return;seen[k]=1;
var i=courseInfo(c);
out.push({type:'course',id:c.id,name:c.name,color:c.color||'#6366f1',sub:'Μάθημα · απομένουν '+fmtHM(Math.max(0,i.remaining||0))+' αυτή την εβδομάδα'});
}
function addF(d){
var k='fixed:'+d.id;if(seen[k])return;seen[k]=1;
var i=fixedInfo(d.id);
out.push({type:'fixed',id:d.id,name:d.name,color:d.color||'#6366f1',sub:'Δραστηριότητα · σήμερα '+fmtHM(i.dayMin)+' / '+fmtHM(i.dailyCap)});
}
if(p.lastActivity&&p.lastActivity.type){
if(p.lastActivity.type==='course'){var c0=state.courses.find(function(x){return x.id===p.lastActivity.id;});if(c0)addC(c0);}
else{var d0=FIXED_DEFS.find(function(x){return x.id===p.lastActivity.id;});if(d0)addF(d0);}
}
state.courses.filter(function(c){return c.active&&c.hours>0;}).sort(function(a,b){return (courseInfo(b).remaining||0)-(courseInfo(a).remaining||0);}).forEach(addC);
FIXED_DEFS.forEach(addF);
out.push({type:null,id:null,name:'Ελεύθερο focus',color:'var(--muted)',sub:'Χωρίς καταγραφή χρόνου'});
return out;
}
function rhOptsHTML(){

}).join('');
}
function rhPomoPick(i){rhPomoSelIdx=i;var w=document.getElementById('rhOpts');if(w)w.innerHTML=rhOptsHTML();}
function rhPomoMode(m){
rhPomoModeVal=m;
var a=document.getElementById('rhModeP'),b=document.getElementById('rhModeS');
if(a)a.classList.toggle('on',m==='pomo');
if(b)b.classList.toggle('on',m==='plain');
var w=document.getElementById('rhPomoCfgWrap');if(w)w.style.display=m==='pomo'?'block':'none';

if(btn)btn.textContent=m==='plain'?'Έναρξη συνεδρίας':'Έναρξη κύκλου';
}
function rhPomoSetVal(kind,val){
var pm=PM(),v=parseInt(val,10);
if(kind==='focus')pm.focusMin=clamp(isNaN(v)?25:v,5,120);
else if(kind==='break')pm.breakMin=clamp(isNaN(v)?5:v,1,30);
else if(kind==='long')pm.longBreakMin=clamp(isNaN(v)?20:v,5,60);
else if(kind==='cycles')pm.cyclesBeforeLong=clamp(isNaN(v)?4:v,1,12);
saveState();rhPomoSyncInputs();rhPomoPreview();
}
function rhPomoAdj(kind,d){
var pm=PM();
var cur=kind==='focus'?pm.focusMin:kind==='break'?pm.breakMin:kind==='long'?pm.longBreakMin:rhCycles();
rhPomoSetVal(kind,cur+d);
}
function rhPomoCardAdj(kind,d){rhPomoAdj(kind,d);rhPomoCardPass(true);}
function rhPomoPreset(f,b,l,c){
var pm=PM();pm.focusMin=f;pm.breakMin=b;pm.longBreakMin=l;pm.cyclesBeforeLong=c;
saveState();rhPomoSyncInputs();rhPomoPreview();rhPomoCardPass(true);
}
function rhPomoSyncInputs(){
var pm=PM();
var a=document.getElementById('rhPFocus'),b=document.getElementById('rhPBreak'),c=document.getElementById('rhPLong'),d=document.getElementById('rhPCyc');
if(a)a.value=pm.focusMin;if(b)b.value=pm.breakMin;if(c)c.value=pm.longBreakMin;
if(d)d.textContent=rhCycles();
var pr=document.getElementById('rhPresets');if(pr)pr.innerHTML=rhPresetsHTML();
}
function rhPresetsHTML(){
var pm=PM(),n=rhCycles();
var list=[{n:'25/5 · 4',f:25,b:5,l:20,c:4},{n:'50/10 · 3',f:50,b:10,l:25,c:3},{n:'90/15 · 2',f:90,b:15,l:30,c:2},{n:'15/3 · 6',f:15,b:3,l:15,c:6}];
return list.map(function(x){
var on=pm.focusMin===x.f&&pm.breakMin===x.b&&pm.longBreakMin===x.l&&n===x.c;
return '<button type="button" class="'+(on?'on':'')+'" onclick="rhPomoPreset('+x.f+','+x.b+','+x.l+','+x.c+')">'+x.n+'</button>';
}).join('');
}
function rhStep(k,label,val,min,max,st){
var id=k==='focus'?'rhPFocus':k==='break'?'rhPBreak':'rhPLong';
return '<div class="f"><label>'+label+'</label><div class="rh-stp">'
+'<button type="button" onclick="rhPomoAdj(\''+k+'\',-'+st+')" aria-label="Μείωση">−</button>'
+'<input id="'+id+'" type="number" min="'+min+'" max="'+max+'" step="'+st+'" value="'+val+'" onchange="rhPomoSetVal(\''+k+'\',this.value)">'
+'<button type="button" onclick="rhPomoAdj(\''+k+'\','+st+')" aria-label="Αύξηση">+</button></div></div>';
}
function rhPomoPreview(){
var el=document.getElementById('rhPrev');if(!el)return;
var pm=PM(),n=rhCycles(),seq=[],i;
for(i=0;i<n;i++){
seq.push({m:pm.focusMin,c:'linear-gradient(180deg,var(--primary),var(--primary2))'});
seq.push({m:i===n-1?pm.longBreakMin:pm.breakMin,c:i===n-1?'#0ea5e9':'var(--success)'});
}
var tot=seq.reduce(function(a,s){return a+s.m;},0);
el.innerHTML=seq.map(function(s){return '<i style="flex:'+s.m+';background:'+s.c+'" title="'+s.m+' λεπτά"></i>';}).join('');
var lb=document.getElementById('rhPrevLbl');
if(lb)lb.innerHTML='<span>'+n+' '+(n===1?'κύκλος':'κύκλοι')+' focus</span><span>'+fmtHM(tot)+' συνολικά</span>';
}
function rhPomoBody(){
var pm=PM(),p=P(),n=rhCycles(),h='';
if(p.phase){
h+='<div class="rh-runbar"><span>Τρέχει κύκλος σε φάση <b>'+rhPhaseName(p.phase)+'</b>. Αν ξεκινήσεις νέο, ο τρέχων τερματίζεται και ο χρόνος του καταγράφεται κανονικά.</span>'
+'<button type="button" onclick="closeModal();openFocusOverlay()">Οθόνη</button>'
+'<button type="button" onclick="abortPomodoro();closeModal();openPomodoroSetup()">Τερματισμός</button></div>';
}
h+='<div class="rh-mode"><button type="button" id="rhModeP" class="'+(rhPomoModeVal==='pomo'?'on':'')+'" onclick="rhPomoMode(\'pomo\')">Pomodoro · κύκλοι</button>'
+'<button type="button" id="rhModeS" class="'+(rhPomoModeVal==='plain'?'on':'')+'" onclick="rhPomoMode(\'plain\')">Απλή συνεδρία</button></div>'
+'<div class="field"><label>Τι θα δουλέψεις</label><div class="rh-opts" id="rhOpts">'+rhOptsHTML()+'</div></div>'
+'<div id="rhPomoCfgWrap" style="display:'+(rhPomoModeVal==='pomo'?'block':'none')+'">'
+'<div class="field"><label>Προεπιλογές focus / διάλειμμα / κύκλοι</label><div class="rh-presets" id="rhPresets">'+rhPresetsHTML()+'</div></div>'
+'<div class="rh-step3">'+rhStep('focus','Focus',pm.focusMin,5,120,5)+rhStep('break','Διάλειμμα',pm.breakMin,1,30,1)+rhStep('long','Μεγάλο',pm.longBreakMin,5,60,5)+'</div>'
+'<div class="rh-cyc-row"><div class="lb"><b>Κύκλοι πριν το μεγάλο</b>Πόσα focus ολοκληρώνεις πριν τη μεγάλη ξεκούραση</div>'
+'<div class="rh-cyc-ctl"><button type="button" onclick="rhPomoAdj(\'cycles\',-1)" aria-label="Λιγότεροι κύκλοι">−</button><b id="rhPCyc">'+n+'</b><button type="button" onclick="rhPomoAdj(\'cycles\',1)" aria-label="Περισσότεροι κύκλοι">+</button></div></div>'
+'<div class="field" style="margin-top:12px"><label>Προεπισκόπηση</label><div class="rh-prev" id="rhPrev"></div><div class="rh-prev-lbl" id="rhPrevLbl"></div></div>'
+'<p class="note">Μετά από '+n+' '+(n===1?'κύκλο':'κύκλους')+' focus έρχεται το μεγάλο διάλειμμα των '+pm.longBreakMin+'λ. Ο χρόνος καταγράφεται αυτόματα σε ό,τι διάλεξες.</p></div>';
return h;
}
function openPomodoroSetup(tab){
rhPomoOpts=rhBuildOpts();
rhPomoSelIdx=0;
if(tab==='settings')rhPomoModeVal='pomo';
openModal({title:'Pomodoro',body:rhPomoBody(),buttons:[
{text:'Άκυρο',class:'btn-ghost'},
{text:rhPomoModeVal==='plain'?'Έναρξη συνεδρίας':'Έναρξη κύκλου',class:'btn-primary',close:false,onClick:function(){rhPomoGo();}}
],onMount:function(){rhPomoSyncInputs();rhPomoPreview();}});
if(tab==='settings'){setTimeout(function(){var w=document.getElementById('rhPomoCfgWrap');if(w)w.scrollIntoView({block:'nearest',behavior:'smooth'});},140);}
}
function rhPomoGo(){
var o=rhPomoOpts[rhPomoSelIdx];
if(!o){showToast('Διάλεξε τι θα δουλέψεις.');return;}
state.settings.pomodoroEnabled=true;
if(P().phase){try{abortPomodoro(true);}catch(e){}}
if(rhPomoModeVal==='plain'){
if(!o.type){showToast('Η απλή συνεδρία χρειάζεται μάθημα ή δραστηριότητα.');return;}
if(state.active)endSession(true);
closeModal();doStart(o.type,o.id);saveState();render();showToast('Ξεκίνησε απλή συνεδρία.');return;
}
try{pomoSel={type:o.type,id:o.id};}catch(e){}
saveState();closeModal();
var ok=false;
try{if(typeof startPomodoro==='function'){startPomodoro();ok=true;}}catch(e){ok=false;}
if(!ok){
var p=P();
if(state.active)endSession(true);
p.activityType=o.type;p.activityId=o.id;p.lastActivity={type:o.type,id:o.id};
p.cycleCount=0;p.phase='focus';p.phaseEndsAt=Date.now()+PM().focusMin*60000;
if(o.type)doStart(o.type,o.id);
saveState();render();openFocusOverlay();
}
rhPomoCardPass(true);
}
function rhCardStep(k,label,val,st){
return '<div class="rh-pstep"><span>'+label+'</span><div class="row">'
+'<button type="button" onclick="rhPomoCardAdj(\''+k+'\',-'+st+')" aria-label="Μείωση '+label+'">−</button>'
+'<b>'+val+'</b>'
+'<button type="button" onclick="rhPomoCardAdj(\''+k+'\','+st+')" aria-label="Αύξηση '+label+'">+</button>'
+'</div></div>';
}
function rhPomoCardHTML(){
var pm=PM(),p=P(),n=rhCycles(),off=state.settings.pomodoroEnabled===false;
if(off){
return '<div class="rh-pomo-head"><div class="rh-pomo-badge" style="filter:grayscale(1);opacity:.55">🍅</div>'
+'<div><h3>Pomodoro</h3><p>Ανενεργό — οι θέσεις ξεκινούν απλή συνεδρία</p></div></div>'
+'<div class="actions"><button class="btn btn-primary" onclick="rhTogglePomodoro(true)">Ενεργοποίηση</button></div>';
}
var ph=p.phase;
var pill=ph==='focus'?'<span class="pill success">Focus</span>':ph==='break'?'<span class="pill info">Διάλειμμα</span>':ph==='longbreak'?'<span class="pill info">Μεγάλο</span>':ph==='proposal'?'<span class="pill warn">Νέος κύκλος;</span>':'<span class="pill info">Έτοιμο</span>';
var last='';
if(p.lastActivity&&p.lastActivity.type){
var nm=p.lastActivity.type==='course'?((state.courses.find(function(x){return x.id===p.lastActivity.id;})||{}).name):((FIXED_DEFS.find(function(x){return x.id===p.lastActivity.id;})||{}).name);
if(nm)last='<div class="rh-pomo-last">Τελευταίο: <b>'+esc(nm)+'</b> · κύκλος '+((p.cycleCount||0)%n+1)+'/'+n+'</div>';
}
var acts='<button class="btn btn-primary" onclick="openPomodoroSetup(\'start\')">'+(ph?'Νέος κύκλος':'Έναρξη κύκλου')+'</button>';
if(ph)acts+='<button class="btn btn-ghost" onclick="openFocusOverlay()">Οθόνη</button>';
return '<div class="rh-pomo-head"><div class="rh-pomo-badge">🍅</div>'
+'<div><h3>Pomodoro</h3><p>Άλλαξε τις τιμές επιτόπου · έναρξη από το κουμπί κάτω</p></div>'+pill+'</div>'
+'<div class="rh-pomo-stats">'+rhCardStep('focus','Focus',pm.focusMin,5)+rhCardStep('break','Διάλειμμα',pm.breakMin,1)+rhCardStep('long','Μεγάλο',pm.longBreakMin,5)+'</div>'
+'<div class="rh-cyc-row"><div class="lb"><b>Κύκλοι πριν το μεγάλο</b>Τώρα: '+n+' '+(n===1?'κύκλος':'κύκλοι')+'</div>'
+'<div class="rh-cyc-ctl"><button type="button" onclick="rhPomoCardAdj(\'cycles\',-1)" aria-label="Λιγότεροι κύκλοι">−</button><b>'+n+'</b><button type="button" onclick="rhPomoCardAdj(\'cycles\',1)" aria-label="Περισσότεροι κύκλοι">+</button></div></div>'
+last+'<div class="actions" style="margin-top:12px">'+acts+'</div>';
}
function rhPomoCardPass(force){
var main=document.querySelector('main');if(!main)return;
var act=document.querySelector('.nav-btn.active');
if(!act||act.textContent.indexOf('Ημέρα')<0)return;
var card=null;
Array.prototype.forEach.call(main.querySelectorAll('.card'),function(c){
var h=c.querySelector('h3');
if(h&&h.textContent.toLowerCase().indexOf('pomodoro')>=0)card=c;
});
if(!card)return;
var pm=PM(),p=P();
var sig=[pm.focusMin,pm.breakMin,pm.longBreakMin,rhCycles(),p.phase||'-',p.activityId||'-',p.cycleCount,state.settings.pomodoroEnabled===false?0:1].join('|');
if(!force&&card.dataset.rhPomo===sig)return;
card.dataset.rhPomo=sig;
card.innerHTML=rhPomoCardHTML();
}
function rhPomoGear(){
var f=document.getElementById('gpPomo');if(!f)return;
if(!document.getElementById('gpPomoCfg')){
var b=document.createElement('button');
b.type='button';b.id='gpPomoCfg';b.className='rh-icon-btn';b.textContent='⚙';
b.setAttribute('aria-label','Ρυθμίσεις κύκλου');
b.onclick=function(){if(typeof window.gpClose==='function')window.gpClose();openPomodoroSetup('settings');};
var sw=f.querySelector('.switch');
if(sw)f.insertBefore(b,sw);else f.appendChild(b);
}
var lb=f.querySelector('small');
if(lb&&lb.textContent.indexOf('Ρυθμίσεις')<0)lb.textContent='Κύκλοι μελέτης · Ρυθμίσεις από το ⚙';
}
var rhCFOrig=(typeof window.completeFocus==='function')?window.completeFocus:null;
window.completeFocus=function(){
var p=P(),pm=PM(),before=p.cycleCount||0;
if(rhCFOrig){rhCFOrig.apply(this,arguments);}
else{
if(state.active)endSession(true);
p.cycleCount=before+1;
p.phase='break';p.phaseEndsAt=Date.now()+pm.breakMin*60000;
saveState();
pushAlert({title:'Κύκλος ολοκληρώθηκε',message:'Διάλειμμα '+pm.breakMin+'λ.',buttons:[{text:'Εντάξει',class:'btn-primary'},{text:'Παράλειψη',class:'btn-ghost',onClick:function(){startNextCycle();}}]});
render();try{updateFocusOverlay(true);}catch(e){}
}
var n=rhCycles(),cc=P().cycleCount||before+1;
if(P().phase==='break'||P().phase==='longbreak'){
var isLong=(cc%n===0),want=isLong?'longbreak':'break';
var mins=isLong?PM().longBreakMin:PM().breakMin;
if(P().phase!==want){
P().phase=want;P().phaseEndsAt=Date.now()+mins*60000;saveState();
var lbl=(isLong?'Μεγάλο διάλειμμα ':'Διάλειμμα ')+mins+'λ. Κύκλος '+cc+' από '+n+'.';
var sh=document.querySelector('#modalOverlay .sheet');
if(sh){var m=sh.querySelector('.modal-message')||sh.querySelector('p');if(m&&/διάλειμμα/i.test(m.textContent))m.textContent=lbl;}
try{if(typeof alertQueue!=='undefined'&&alertQueue.length){var last=alertQueue[alertQueue.length-1];if(last&&last.message&&/διάλειμμα/i.test(last.message))last.message=lbl;}}catch(e){}
try{updateFocusOverlay(true);}catch(e){}
try{render();}catch(e){}
}
}
rhPomoCardPass(true);
};
var rhUFOOrig=(typeof window.updateFocusOverlay==='function')?window.updateFocusOverlay:null;
window.updateFocusOverlay=function(){
var r=rhUFOOrig?rhUFOOrig.apply(this,arguments):null;
try{
var d=document.querySelector('#focusOverlay .fo-dots');
if(d){
var n=rhCycles(),done=(P().cycleCount||0)%n;
if(d.dataset.n!==String(n)||d.dataset.done!==String(done)){
d.dataset.n=String(n);d.dataset.done=String(done);
var h='';for(var i=0;i<n;i++)h+='<span class="'+(i<done?'on':'')+'"></span>';
d.innerHTML=h;
}
}
}catch(e){}
return r;
};
rhPomoRepair();
rhPomoCardPass(true);
rhPomoGear();
setTimeout(rhPomoGear,400);
setTimeout(rhPomoGear,1500);
setTimeout(function(){rhPomoCardPass(true);rhPomoGear();},3200);
/* ===== ΤΕΛΟΣ POMODORO v3 ===== */
</script>

<script>
/* ===== ΚΑΘΑΡΗ ΕΚΚΙΝΗΣΗ v2 + ONBOARDING FIX ===== */
function rhUserMade(id){
var s=String(id||'');
return /^act_\d/.test(s)||/^crs_\d/.test(s)||/^mk\d{10,}$/.test(s)||/^mo_\d/.test(s);
}
function rhIsVirgin(){
if(state.__rhCleanV2)return false;
if(Array.isArray(state.logs)&&state.logs.length>0)return false;
if(Array.isArray(state.feedback)&&state.feedback.length>0)return false;
if(state.schedule&&state.schedule.slots&&state.schedule.slots.length>0)return false;
if(FIXED_DEFS.some(function(d){return rhUserMade(d.id);}))return false;
if(state.courses.some(function(c){return rhUserMade(c.id);}))return false;
if(Array.isArray(state.devNotes)&&state.devNotes.some(function(n){return n&&n.userMade;}))return false;
return true;
}
function rhCleanSlate(){
try{FIXED_DEFS.length=0;state.fixedDefs=FIXED_DEFS;}catch(e){state.fixedDefs=[];}
state.courses.length=0;
try{if(typeof MONTHLY_DEFS!=='undefined'&&MONTHLY_DEFS)MONTHLY_DEFS.length=0;}catch(e){}
if(Array.isArray(state.monthlyDefs))state.monthlyDefs.length=0;
if(state.monthly)state.monthly.items={};
if(Array.isArray(state.devNotes))state.devNotes.length=0;
if(Array.isArray(state.feedback))state.feedback.length=0;
if(Array.isArray(state.weeklyReviews))state.weeklyReviews.length=0;
if(state.schedule)state.schedule.slots=[];
state.reviews={};state.reviewNotes={};state.dayClose={};state.carry={};
state.settings.showMakeup=false;
state.feedbackDraft='';
}
function rhWelcomeHTML(){
return '<button type="button" class="rh-w-x" onclick="rhWelcomeOff()" aria-label="Κλείσιμο">✕</button>'
+'<div class="rh-w-head"><div class="rh-w-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>'
+'<div><h3>Ο δικός σου ρυθμός, από το μηδέν</h3><p>Δεν υπάρχει τίποτα προκαθορισμένο. Ό,τι βλέπεις από εδώ και πέρα το ορίζεις εσύ.</p></div></div>'
+'<div class="rh-w-steps">'
+'<div class="rh-w-step"><i>1</i><span>Φτιάξε μια <b>δραστηριότητα</b> — ύπνος, γυμναστήριο, φαγητό, ό,τι θες — με ημερήσιο ή εβδομαδιαίο όριο και κατηγορία.</span></div>'
+'<div class="rh-w-step"><i>2</i><span>Όρισε τα <b>μαθήματά</b> σου με εβδομαδιαίο και συνολικό στόχο, και ημερομηνία εξέτασης αν την ξέρεις.</span></div>'
+'<div class="rh-w-step"><i>3</i><span>Βάλε <b>θέσεις</b> στο εβδομαδιαίο πρόγραμμα και ξεκίνα καταγραφή. Οι στόχοι, η πρόοδος και οι αναφορές γεμίζουν μόνα τους.</span></div>'
+'</div>'
+'<div class="rh-w-acts"><button type="button" class="btn btn-primary" onclick="openFixedEditor(null)">+ Δραστηριότητα</button>'
+'<button type="button" class="btn btn-ghost" onclick="rhStudyEditor(null)">+ Μάθημα</button></div>';
}
function rhWelcomeOff(){

function rhHideCard(main,needle,when){

if(c.id==='rhWelcome'||c.closest('#rhWelcome'))return;

});
}
function rhEmptyPass(){
var main=document.querySelector('main');if(!main)return;

Array.prototype.slice.call(main.querySelectorAll('.card')).forEach(function(c){

});

}
if(label.indexOf('Ανάλυση')>=0){

}

});
var mo=document.getElementById('rh-monthly-card');

/* ---------- ONBOARDING: ΚΑΜΙΑ ΔΙΠΛΗ ΕΠΙΚΑΛΥΨΗ, ΚΑΜΙΑ ΚΛΕΙΔΩΜΕΝΗ ΟΘΟΝΗ ---------- */
function rhObNodes(){
var set=[],guard=['MAIN','HEADER','NAV'];
var hits=document.querySelectorAll('[onclick*="nextOb"],[onclick*="prevOb"],[onclick*="doneOb"],[onclick*="skipOb"]');
Array.prototype.forEach.call(hits,function(h){
var n=h;
while(n&&n.parentElement&&n.parentElement!==document.body)n=n.parentElement;
if(!n||n.parentElement!==document.body)return;
if(guard.indexOf(n.tagName)>=0)return;
if(n.id==='app'||n.id==='modalOverlay'||n.id==='safePanel'||n.id==='gearPanel'||n.id==='focusOverlay')return;
if(set.indexOf(n)<0)set.push(n);
});
return set;
}
function rhObUnlock(){
document.body.style.overflow='';
document.body.style.position='';
document.body.style.touchAction='';
document.body.style.pointerEvents='';
document.documentElement.style.overflow='';
['ob-open','no-scroll','modal-open','locked','ob-active'].forEach(function(c){document.body.classList.remove(c);document.documentElement.classList.remove(c);});
}
function rhObFinish(){
state.onboardingComplete=true;saveState();
rhObNodes().forEach(function(n){try{n.remove();}catch(e){}});
rhObUnlock();
try{render();}catch(e){}
try{showToast('Καλώς ήρθες!');}catch(e){}
}
window.doneOb=rhObFinish;
window.skipOb=rhObFinish;
function rhObGuard(){
var nodes=rhObNodes();
if(!nodes.length)return;
if(state.onboardingComplete){
nodes.forEach(function(n){try{n.remove();}catch(e){}});
rhObUnlock();
return;
}
if(nodes.length>1){
for(var i=0;i<nodes.length-1;i++){try{nodes[i].remove();}catch(e){}}
}
}
(function(){
var virgin=rhIsVirgin();
if(virgin)rhCleanSlate();
state.__rhCleanV2=true;
state.__rhInitAt=state.__rhInitAt||Date.now();
saveState();
})();
if(state.onboardingComplete){rhObNodes().forEach(function(n){try{n.remove();}catch(e){}});rhObUnlock();}
document.addEventListener('keydown',function(ev){
if(ev.key==='Escape'&&rhObNodes().length)rhObFinish();
});
/* ===== ΤΕΛΟΣ ΚΑΘΑΡΗΣ ΕΚΚΙΝΗΣΗΣ v2 ===== */

var rhFbFiles=[];
function rhFbSize(b){
if(b<1024)return b+' B';
if(b<1048576)return (b/1024).toFixed(0)+' KB';
return (b/1048576).toFixed(1)+' MB';
}
function rhFbKindSet(k){
state.feedbackKind=k;saveState();
Array.prototype.forEach.call(document.querySelectorAll('[data-fbkind]'),function(b){
b.classList.toggle('on',b.getAttribute('data-fbkind')===k);
});
}
function rhFbFilesAdd(list){
var arr=Array.prototype.slice.call(list||[]),added=0;
arr.forEach(function(f){
if(rhFbFiles.length>=6){return;}
if(f.size>8*1048576){showToast('Το «'+f.name+'» είναι πάνω από 8 MB.');return;}
rhFbFiles.push({name:f.name,size:f.size,type:f.type||''});added++;
});
if(arr.length&&!added)showToast('Όριο 6 αρχείων.');
rhFbFilesRender();
}
function rhFbFileDel(i){rhFbFiles.splice(i,1);rhFbFilesRender();}

w.innerHTML=rhFbFiles.map(function(f,i){

+'<button type="button" onclick="rhFbFileDel('+i+')" aria-label="Αφαίρεση '+esc(f.name)+'">✕</button></span>';
}).join('');
}
function rhFbSave(status){
var ta=document.getElementById('rhFbText');
var v=ta?(ta.value||'').trim():'';
if(v.length<3){showToast('Γράψε δυο λόγια παραπάνω.');return;}
state.feedback.unshift({
kind:state.feedbackKind||'Ιδέα',text:v,ts:Date.now(),
ver:(typeof APP_VERSION!=='undefined'?APP_VERSION:''),
status:status,files:rhFbFiles.slice()

if(ta)ta.value='';

showToast(status==='queued'?'Μπήκε στην ουρά αποστολής.':'Αποθηκεύτηκε προσωρινά στη συσκευή.');

function rhRoadmap(){
var items=Array.isArray(state.devNotes)?state.devNotes:[];
var h='<div class="card"><div class="rh-rm-top"><h3 style="margin:0">Τι ετοιμάζεται</h3>'

h+='<p class="note">Δεν υπάρχει ανακοινωμένο πλάνο αυτή τη στιγμή.</p>';

items.forEach(function(n,i){

function draw2d(eye,look,pal){

var f=m4persp(1.02,w/h,.35,240),v=m4look(eye,look,[0,1,0]),pv=m4mul(f,v);
function prj(p){var x=pv[0]*p[0]+pv[4]*p[1]+pv[8]*p[2]+pv[12],y=pv[1]*p[0]+pv[5]*p[1]+pv[9]*p[2]+pv[13],ww=pv[3]*p[0]+pv[7]*p[1]+pv[11]*p[2]+pv[15];
if(ww<=.05)return null;return [(x/ww*.5+.5)*w,(.5-y/ww*.5)*h,ww];}
var list=[];
OBJ.forEach(function(o){
 if(Math.abs(o.pos[0]-W.cam)>SP*1.35&&o.scale[0]<100)return;
 var pp=prj(o.pos);if(!pp)return;
 list.push({o:o,p:pp});
});
list.sort(function(a,b){return b.p[2]-a.p[2];});
list.forEach(function(it){
 var o=it.o,pp=it.p;
 var sx=Math.max(2,o.scale[0]/pp[2]*h*.55),sy=Math.max(2,o.scale[1]/pp[2]*h*.55);
 var col=o.base.map(function(v,i){return Math.round(cl(v*(.55+o.ek*.7)+o.emis[i]*o.ek*.5,0,1)*255);});
 c.fillStyle='rgb('+col.join(',')+')';
 if(o.g==='sphere'||o.g==='torus'){c.beginPath();c.ellipse(pp[0],pp[1],sx*.5,sy*.5,0,0,6.2832);c.fill();}
 else c.fillRect(pp[0]-sx*.5,pp[1]-sy*.5,sx,sy);
});
c.globalCompositeOperation='lighter';
GLOW.forEach(function(gg){
 if(Math.abs(gg.pos[0]-W.cam)>SP*1.35||gg.k<=.01)return;
 var pp=prj(gg.pos);if(!pp)return;
 var r=Math.max(3,gg.size[0]/pp[2]*h*.5);
 var rg=c.createRadialGradient(pp[0],pp[1],0,pp[0],pp[1],r);
 var cc=gg.col.map(function(v){return Math.round(cl(v,0,1)*255);});
 rg.addColorStop(0,'rgba('+cc.join(',')+','+cl(gg.k*.5,0,1)+')');
 rg.addColorStop(1,'rgba('+cc.join(',')+',0)');
 c.fillStyle=rg;c.beginPath();c.arc(pp[0],pp[1],r,0,6.2832);c.fill();
});
c.globalCompositeOperation='source-over';
}

 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.36);

function gestures(){
var main=document.querySelector('main');if(!main)return;
var s=null;
main.addEventListener('pointerdown',function(e){
 if(!W.on||e.target.closest('input,select,textarea,button,.w3d-strip,.rh-grip'))return;
 s={x:e.clientX,y:e.clientY,dx:0,mode:0,id:e.pointerId};
},{passive:true});
main.addEventListener('pointermove',function(e){
 if(!W.on||!s||e.pointerId!==s.id)return;
 var dx=e.clientX-s.x,dy=e.clientY-s.y;
 if(!s.mode){
  if(Math.abs(dx)>16&&Math.abs(dx)>Math.abs(dy)*1.35){
   s.mode=1;W.drag={base:W.cam,dx:0};
   try{main.setPointerCapture(e.pointerId);}catch(err){}
   document.documentElement.style.userSelect='none';
  }else if(Math.abs(dy)>14){s.mode=2;}

 if(s.mode===1){
  W.drag.dx=dx;
  var pr=cl(-dx/Math.max(1,innerWidth),-.6,.6);
  main.style.transform='translateX('+(-dx*.34)+'px)';
  main.style.opacity=String(cl(1-Math.abs(pr)*1.1,.25,1));
  if(e.cancelable)e.preventDefault();
 }
},{passive:false});
function end(e){
 if(!s)return;
 var wasDrag=s.mode===1,dx=s.dx||(e&&e.clientX!=null?e.clientX-s.x:0);

 if(v<-.16)to=from+1;else if(v>.16)to=from-1;

 if(!W.on)return;

 W.orbitT.y=cl((e.clientY/Math.max(1,innerHeight)-.5)*-2,-1,1)*.35;
},{passive:true});
window.addEventListener('wheel',function(e){
 if(!W.on)return;
 if(Math.abs(e.deltaX)>Math.abs(e.deltaY)*1.3&&Math.abs(e.deltaX)>18){
  if(W.wheelLock)return;W.wheelLock=true;setTimeout(function(){W.wheelLock=false;},420);
  wGo(curIdx()+(e.deltaX>0?1:-1));
 }else if(e.ctrlKey){W.dist=cl(W.dist+(e.deltaY>0?.08:-.08),.6,1.7);if(e.cancelable)e.preventDefault();}
},{passive:false});

function initGL(){
W.cv=document.createElement('canvas');W.cv.id='w3d';document.body.appendChild(W.cv);
var gl=null;
try{gl=W.cv.getContext('webgl',{antialias:false,alpha:false,depth:true,powerPreference:'high-performance',preserveDrawingBuffer:false})||W.cv.getContext('experimental-webgl');}catch(e){}

try{

 PROG.bright=mkProg(QVS,BRTFS);PROG.blur=mkProg(QVS,BLRFS);PROG.cmp=mkProg(QVS,CMPFS);
 GEO.box=geoBox();GEO.sphere=geoSphere(22,14);GEO.torus=geoTorus(1,.16,44,10);GEO.cyl=geoCyl(22);GEO.plane=geoPlane();
 var qb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,qb);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 GEO.quad=qb;
}catch(e){fallback=true;ctx2=W.cv.getContext('2d');}
W.cv.addEventListener('webglcontextlost',function(e){e.preventDefault();W.lost=true;if(W.raf){cancelAnimationFrame(W.raf);W.raf=0;}},false);
W.cv.addEventListener('webglcontextrestored',function(){
 W.lost=false;FB={};GEO={};PROG={};
 try{
  PROG.scene=mkProg(VS,FS);PROG.glow=mkProg(GVS,GFS);PROG.sky=mkProg(QVS,SKYFS);
  PROG.bright=mkProg(QVS,BRTFS);PROG.blur=mkProg(QVS,BLRFS);PROG.cmp=mkProg(QVS,CMPFS);
  GEO.box=geoBox();GEO.sphere=geoSphere(22,14);GEO.torus=geoTorus(1,.16,44,10);GEO.cyl=geoCyl(22);GEO.plane=geoPlane();
  var qb=W.gl.createBuffer();W.gl.bindBuffer(W.gl.ARRAY_BUFFER,qb);
  W.gl.bufferData(W.gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),W.gl.STATIC_DRAW);GEO.quad=qb;
  W.cv.width=0;resize();W_SIG=worldSig();buildWorld();W.last=0;if(W.on&&!W.raf)W.raf=requestAnimationFrame(frame);
 }catch(e){}
},false);
return true;
}
function start(){

document.documentElement.classList.toggle('rail-on',q('w3dRail').classList.contains('open'));
strip();chrome();
if(!fallback&&W.gl&&W.gl.isContextLost&&W.gl.isContextLost()){
W.lost=true;
if(W_LOSE){try{W_LOSE.restoreContext();}catch(e){}}
return;
}

W_SIG=worldSig();buildWorld();resize();
W.last=0;if(!W.raf)W.raf=requestAnimationFrame(frame);
}
var W_LOSE=null;
function releaseGL(){
if(!W.gl||fallback)return;
try{
delFBO(FB.scene);delFBO(FB.a);delFBO(FB.b);
Object.keys(GEO).forEach(function(k){
var g=GEO[k];if(!g)return;

}
  
function stop(){

else stop();

if(typeof RH_THEMES!=='undefined'&&!RH_THEMES.some(function(t){return t.id==='world3d';})){
RH_THEMES.splice(4,0,{id:'world3d',n:'Κόσμος',s:'3D βάθος',a:'#22d3ee',b:'#0a0e24'});
var gb=document.getElementById('gpThemesBody');
if(gb){var gs=gb.querySelectorAll('.gp-grid');if(gs.length)gs[gs.length-1].removeAttribute('data-rh');}

var _rta=(typeof window.rhThemeApply==='function')?window.rhThemeApply:null;

var _st=(typeof window.setTheme==='function')?window.setTheme:null;
window.setTheme=function(v){if(_st)_st.apply(this,arguments);sync();};
var _stb=(typeof window.setTab==='function')?window.setTab:null;
window.setTab=function(id){
var from=curIdx();
if(_stb)_stb.apply(this,arguments);
else if(typeof currentTab!=='undefined'){currentTab=id;if(typeof render==='function')render();}
if(!W.on)return;
var to=curIdx();
if(to!==from){

 var main=document.querySelector('main');
 if(main){main.classList.remove('w3d-r','w3d-l');void main.offsetWidth;main.classList.add(to>from?'w3d-r':'w3d-l');}
 var f=q('w3dFly');

 whoosh();
}
strip();chrome();
};
if(!window.__w3d1){
window.__w3d1=true;
gestures();
window.addEventListener('resize',function(){if(W.on){resize();strip();chrome();}});
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(W.raf){cancelAnimationFrame(W.raf);W.raf=0;}}
 else if(W.on&&!W.lost&&!W.raf){W.last=0;W.raf=requestAnimationFrame(frame);}
});
setInterval(function(){

 var fo=document.getElementById('focusOverlay');
 var busy=fo&&!fo.classList.contains('hidden');
 if(busy){if(W.raf){cancelAnimationFrame(W.raf);W.raf=0;}}
 else if(!document.hidden&&!W.lost&&!W.raf){W.last=0;W.raf=requestAnimationFrame(frame);}
 strip();chrome();
},1200);
setInterval(function(){
if(!W.on||W.drag)return;
var s=worldSig();
if(s===W_SIG)return;
W_SIG=s;buildWorld();
},6000);
}
sync();
})();

<script>
/* ===== ΚΟΣΜΟΣ PREVIEW v1 ===== */
(function(){
var api=window.w3dApi;if(!api)return;
var on=false,g=null;
function cl(v,a,b){return v<a?a:v>b?b:v;}
var EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>';
function injectEye(){
var card=document.querySelector('#gearPanel [data-gp-theme="world3d"]');
if(!card)return;
card.classList.add('bf-card');
if(card.querySelector('.w3d-eye'))return;
var s=document.createElement('span');
s.className='bf-cog w3d-eye';
s.setAttribute('role','button');s.tabIndex=0;
s.setAttribute('aria-label','Προεπισκόπηση κόσμου χωρίς πλαίσια');
s.title='Προεπισκόπηση';
s.innerHTML=EYE;
s.onclick=function(e){e.stopPropagation();enter();};
s.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();enter();}};
card.appendChild(s);
}
function hud(){
if(document.getElementById('w3dHud'))return;
var h=document.createElement('div');h.id='w3dHud';
h.innerHTML='<div class="w3d-hud-pill"><b id="w3dHudName">Ημέρα</b><span class="w3d-hud-dots" id="w3dHudDots"></span></div>'
+'<button type="button" class="w3d-hud-exit" onclick="w3dPreviewExit()" aria-label="Έξοδος από προεπισκόπηση">'+EYEOFF+'Έξοδος</button>';
document.body.appendChild(h);
var d=h.querySelector('#w3dHudDots');
d.innerHTML=api.tabs().map(function(t,i){return '<button type="button" data-i="'+i+'" aria-label="'+t.label+'" onclick="w3dApi.go('+i+')"></button>';}).join('');
}
function syncHud(){
if(!on)return;
var i=api.cur(),n=document.getElementById('w3dHudName'),d=document.getElementById('w3dHudDots');
if(n)n.textContent=(api.tabs()[i]||{}).label||'';
if(d)Array.prototype.forEach.call(d.children,function(b,k){b.classList.toggle('on',k===i);});
}
function enter(){
if(state.settings.theme!=='world3d'&&typeof setTheme==='function')setTheme('world3d');
if(typeof window.gpClose==='function')window.gpClose();
if(typeof closeModal==='function')closeModal();
on=true;
document.documentElement.classList.add('w3d-preview');
var r=document.getElementById('w3dRail');if(r)r.classList.add('open');
document.documentElement.classList.add('rail-on');
hud();syncHud();
showToast('Προεπισκόπηση: σύρε οριζόντια για ταξίδι, κάθετα για βλέμμα, τροχός για ζουμ. Esc για έξοδο.');
}
function exit(){
on=false;g=null;api.W.drag=null;
document.documentElement.classList.remove('w3d-preview');
}
window.w3dPreview=enter;
window.w3dPreviewExit=exit;
var cv=document.getElementById('w3d');
if(cv){
cv.addEventListener('pointerdown',function(e){
if(!on)return;
g={x:e.clientX,y:e.clientY,mode:0,base:api.W.cam};
try{cv.setPointerCapture(e.pointerId);}catch(err){}
});
cv.addEventListener('pointermove',function(e){
if(!on||!g)return;
var dx=e.clientX-g.x,dy=e.clientY-g.y;
if(!g.mode){
if(Math.abs(dx)>14&&Math.abs(dx)>Math.abs(dy))g.mode=1;
else if(Math.abs(dy)>14)g.mode=2;
}
if(g.mode===1){api.W.drag={base:g.base,dx:dx};}
else if(g.mode===2){
api.W.orbitT.y=cl(-dy/240,-1,1)*.6;
api.W.orbitT.x=cl(dx/400,-1,1)*.4;
}
});
function up(){
if(!g)return;
var mode=g.mode,dx=api.W.drag?api.W.drag.dx:0;
g=null;api.W.drag=null;
if(mode===1){
var v=dx/Math.max(1,innerWidth),from=api.cur(),to=from;
if(v<-.14)to=from+1;else if(v>.14)to=from-1;
to=cl(to,0,api.tabs().length-1);
if(to!==from)api.go(to);else api.W.target=from;
}
syncHud();
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){
if(!on)return;
if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
api.W.dist=cl(api.W.dist+(e.deltaY>0?.07:-.07),.6,1.7);
if(e.cancelable)e.preventDefault();
}
},{passive:false});
}
document.addEventListener('keydown',function(e){
if(e.key==='Escape'&&on)exit();
});
if(!window.__w3dPrev1){
window.__w3dPrev1=true;
injectEye();
var gp=document.getElementById('gearPanel');
if(gp&&typeof MutationObserver==='function')new MutationObserver(injectEye).observe(gp,{childList:true,subtree:true});
setInterval(function(){injectEye();syncHud();},1200);
}
})();
/* ===== ΤΕΛΟΣ ΚΟΣΜΟΥ PREVIEW v1 ===== */
</script>

});

else if(e.key==='ArrowDown'){CAM.elT=cl(CAM.elT-.10,-1.1,1.1);CAM.idle=0;}

function start(){

},1200);
}
sync();
})();

<script>

}catch(e){}
}

try{

}
var SIMPLE=[
{id:'ditono',n:'Δίτονο',d:'Δύο καθαροί τόνοι, ουδέτερο. Σαν το κλασικό Tri-tone του iPhone.',f:function(c,t,g,L){tone(c,t,'sine',760,.14,g,0,L);tone(c,t+.16,'sine',1040,.20,g,0,L);}},
{id:'arpa',n:'Άρπα',d:'Πλεγμένη χορδή που σβήνει απαλά. Σαν την Άρπα της Samsung.',f:function(c,t,g,L){tone(c,t,'triangle',880,.50,g*.9,0,L);tone(c,t,'triangle',1760,.35,g*.35,0,L);tone(c,t,'triangle',2640,.22,g*.14,0,L);}},

{id:'krystallo',n:'Κρύσταλλο',d:'Ψηλοί κρύσταλλοι με αντήχηση. Σαν το Crystals των σημείων ειδοποίησης.',f:function(c,t,g,L){tone(c,t,'sine',1560,.60,g*.7,0,L);tone(c,t+.03,'sine',2080,.50,g*.4,0,L);tone(c,t+.06,'sine',3120,.35,g*.2,0,L);}},

inject();sync();
}catch(e){}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,0);});

<script>
/* ===== ΑΥΤΟ-ΕΛΕΓΧΟΣ v1 ===== */
function rhA11yPass(){
try{
var sw=document.querySelectorAll('.switch'),i;
for(i=0;i<sw.length;i++){
var b=sw[i];
if(b.getAttribute('role')!=='switch')b.setAttribute('role','switch');
var v=b.classList.contains('on')?'true':'false';
if(b.getAttribute('aria-checked')!==v)b.setAttribute('aria-checked',v);
if(!b.getAttribute('aria-label')){
var row=b.closest('.setting-row')||b.closest('.gp-flat')||b.closest('.rh-mk-bar')||b.closest('.gp-check');
var t=row?row.querySelector('strong'):null;
if(t)b.setAttribute('aria-label',t.textContent.trim());
}
}
var ic=document.querySelectorAll('.activity .icon');
for(i=0;i<ic.length;i++)if(ic[i].getAttribute('aria-hidden')!=='true')ic[i].setAttribute('aria-hidden','true');
}catch(e){}
}
function rhFixPass(){
try{
var main=document.querySelector('main');
if(main){
var cs=main.querySelectorAll('.card.activity'),i;
for(i=0;i<cs.length;i++){
var c=cs[i],a=(c.style.getPropertyValue('--accent')||'').trim();
if(!a)continue;
var ink=(typeof rhInk==='function')?rhInk(a):'#fff';
if(c.style.getPropertyValue('--ink')!==ink)c.style.setProperty('--ink',ink);
}
}
rhA11yPass();
}catch(e){}
}
function rhAudit(){
var L=[],scripts=[].slice.call(document.scripts),styles=[].slice.call(document.querySelectorAll('style')),i,t,m;
var defs={},blocks=[],total=0,obs=0,timers=0;
for(i=0;i<scripts.length;i++){
t=scripts[i].textContent||'';
if(!t.trim())continue;
total+=t.length;
m=t.match(/\/\* ===== ([^=]+?) =====/);
var nm=m?m[1].trim():('inline #'+i);
blocks.push({n:nm,b:t.length});
var re=/function\s+([A-Za-z_$][\w$]*)\s*\(/g,mm;
while((mm=re.exec(t))){(defs[mm[1]]=defs[mm[1]]||[]).push(nm);}
var re2=/window\.([A-Za-z_$][\w$]*)\s*=\s*function/g;
while((mm=re2.exec(t))){(defs[mm[1]]=defs[mm[1]]||[]).push(nm+' [assign]');}
obs+=(t.match(/new MutationObserver/g)||[]).length;
timers+=(t.match(/setInterval\(/g)||[]).length;
}
var css=0;for(i=0;i<styles.length;i++)css+=(styles[i].textContent||'').length;
L.push('ΣΥΝΟΛΟ: '+scripts.length+' scripts · '+Math.round(total/1024)+' KB JS · '+styles.length+' styles · '+Math.round(css/1024)+' KB CSS');
L.push('MutationObservers: '+obs+' · setInterval: '+timers);
L.push('');
L.push('— ΒΑΡΟΣ ΑΝΑ ΜΠΛΟΚ (bytes, φθίνουσα) —');
blocks.slice().sort(function(a,b){return b.b-a.b;}).forEach(function(x){L.push(String(x.b).padStart(7)+'  '+x.n);});
L.push('');
var watch=['openFixedEditor','rhStudyEditor','renderActivities','fixedCard','rhActColor','rhInk','rhActFilter','rhHistCardHTML','rhNotesCardHTML','rhFbAdd','dayAudit','dayAuditCardHTML','streakCount','sleepTodayMin','sleepMinForDay','processAlertQueue','buildFixedAlerts','healthApplies','budgetSnapshotExact','budgetBad','budgetPanelHTML','logEdit','logsTodayHTML','scheduleAdd','getSmartSuggestions','sleepExtrasMount','rhGoalsCardHTML','unplacedBadgesMount','deleteCourse','safeRollback','safeRetryLatest','safeSetForce','safeCtl','openPomodoroSetup','startPomodoro','rhSoundStart','rhSoundStop','beep','rhSndSync','setTheme','rhThemeApply','rhDomPass'];
L.push('— ΠΑΡΑΚΟΛΟΥΘΗΣΗ ΓΝΩΣΤΩΝ ΑΝΤΙΚΑΤΑΣΤΑΣΕΩΝ —');
watch.forEach(function(n){
var d=defs[n]||[];
L.push((d.length>1?'[ΔΙΠΛΟ] ':'[ok]    ')+n+' ×'+d.length+(d.length?'  → '+d.join(' | '):'  → δεν υπάρχει'));
});
L.push('');
L.push('— ΟΛΟΙ ΟΙ ΠΟΛΛΑΠΛΟΙ ΟΡΙΣΜΟΙ (περιλαμβάνονται και εμφωλευμένοι) —');
Object.keys(defs).filter(function(n){return defs[n].length>1;}).sort(function(a,b){return defs[b].length-defs[a].length;}).forEach(function(n){
L.push(n+' ×'+defs[n].length+'  → '+defs[n].join(' | '));
});
L.push('');
L.push('— ΠΙΘΑΝΑ ΟΡΦΑΝΑ CSS CLASSES —');
var hay='';for(i=0;i<scripts.length;i++)hay+=(scripts[i].textContent||'');
var app=document.querySelector('.app');if(app)hay+=app.outerHTML;
var seen={},orph=[];
for(i=0;i<styles.length;i++){
var ct=styles[i].textContent||'',rc=/\.((?:rh|bf|w3d|bh|gp|qs|aud|fo|rh)-[a-zA-Z0-9_-]+)/g,mc;
while((mc=rc.exec(ct))){
var cl=mc[1];
if(seen[cl])continue;seen[cl]=1;
if(hay.indexOf(cl)<0)orph.push(cl);
}
}
L.push(orph.length?orph.join(', '):'κανένα');
L.push('');
L.push('— ΝΕΚΡΑ ΣΗΜΕΙΑ (πρέπει να είναι 0) —');
['rhApplyNature','rhEnsureNatureChoice','rhThemeClasses','rhSafeDiag','rhSafeAugment','sleepMinForDay','studyDailyMaxHours','TAB_TITLES','noiseStart','PAUSE_RESET','__rhNatureV1','__rhThemesV2','__rhThemesV3','__rhSndV3','__rhSndV4'].forEach(function(n){
var c=0;for(i=0;i<scripts.length;i++){var tt=scripts[i].textContent||'';c+=(tt.split(n).length-1);}
L.push((c?'[ΜΕΝΕΙ] ':'[ok]    ')+n+' ×'+c);
});
return L.join('\n');
}
function rhAuditDownload(){
try{
var txt=rhAudit();
var b=new Blob([txt],{type:'text/plain;charset=utf-8'});
var u=URL.createObjectURL(b),a=document.createElement('a');
a.href=u;a.download='rhythmos-audit-'+new Date().toISOString().slice(0,10)+'.txt';
document.body.appendChild(a);a.click();a.remove();
setTimeout(function(){URL.revokeObjectURL(u);},2500);
if(typeof showToast==='function')showToast('Η αναφορά κατέβηκε.');
}catch(e){}
}
if(!window.__rhAudit1){
window.__rhAudit1=true;
setTimeout(function(){
try{
var s=rhAudit();
console.log(s);
var dup=(s.match(/\[ΔΙΠΛΟ\]/g)||[]).length,left=(s.match(/\[ΜΕΝΕΙ\]/g)||[]).length;
console.log('ΠΕΡΙΛΗΨΗ: '+dup+' γνωστά διπλότυπα, '+left+' νεκρά σημεία που μένουν. Πλήρης αναφορά: rhAudit() · λήψη: rhAuditDownload()');
}catch(e){}
},1800);
}
/* ===== ΤΕΛΟΣ ΑΥΤΟ-ΕΛΕΓΧΟΥ v1 ===== */
</script>

<script>
/* ===== ΠΥΡΗΝΑΣ ΧΡΟΝΙΣΜΟΥ & RENDER v1 ===== */

/* ---- 1. ΕΝΙΑΙΟ ΠΕΡΑΣΜΑ ΜΕΤΑ ΤΟ RENDER ---- */
var rhPassBusy=false;
function rhPostRender(){
  if(rhPassBusy||window.__rhBooting)return;
  if(!document.querySelector('main'))return;
  rhPassBusy=true;
  try{
    declutterMount();
    sleepExtrasMount();
    scheduleMount();
    nextSlotMount();
    rhDomPass();
    rhPass2();
    rhUxPass();
    rhPolishPass();
    rhV6Pass();
    rhEmptyPass();
    rhHelpPass();
    rhFixPass();
  }catch(e){}
  rhPassBusy=false;
}

/* ---- 2. ΑΠΟΛΟΓΙΣΜΟΣ ΗΜΕΡΑΣ (το setInterval 60 s που σβήστηκε) ---- */
function rhReviewAsk(){
  var h=new Date().getHours(),key=getDailyPlanKey();
  if(h<21||state.reviews[key]||state.reviewAsk===key||modalOpen)return;
  state.reviewAsk=key;saveState();
  var logged=allTotalMin(startOfDay(),startOfNextDay());
  openModal({title:'Απολογισμός ημέρας',
    body:'<p class="muted">Καταγραφή: '+fmtHM(logged)+'</p>'
        +'<p class="muted">Ύπνος: '+fmtHM(sleepTodayMin())+'</p>'
        +'<p class="muted" style="margin:10px 0 6px">Βαθμολόγησε τη μέρα:</p>'
        +'<div class="actions">'+[1,2,3,4,5].map(function(r){
            return '<button class="btn btn-ghost" onclick="rateDay('+r+')">'+r+'</button>';
          }).join('')+'</div>',
    buttons:[{text:'Παράλειψη',class:'btn-ghost'}]});
}

/* ---- 3. ΕΝΑΣ ΧΡΟΝΟΜΕΤΡΗΤΗΣ ΓΙΑ ΟΛΑ ---- */
var RH_JOBS=[];
function rhJob(fn,ms,bg){RH_JOBS.push({f:fn,ms:ms,last:0,bg:!!bg});}
function rhDispatch(){
  var now=Date.now(),hid=document.hidden;
  for(var i=0;i<RH_JOBS.length;i++){
    var j=RH_JOBS[i];
    if(hid&&!j.bg)continue;
    if(now-j.last<j.ms)continue;
    j.last=now;
    try{j.f();}catch(e){}
  }
}
function rhJobsInit(){
  /* 250 ms — μόνο η μπάρα ήχου */
  rhJob(function(){if(state.audio&&state.audio.playing&&!audDragging)audUpdateSeek();},250,false);

  /* 1 s — πυρήνας, τρέχει και στο παρασκήνιο */
  rhJob(tick,1000,true);
  rhJob(function(){if(state.healthBreak)healthBreakFrame();},1000,true);
  rhJob(function(){if(state.settings.theme==='butterflies')rhBfGate();},1000,false);

  /* 5 s */
  rhJob(slotUpdateOvertimeUI,5000,false);
  rhJob(notifBadgeUpdate,5000,false);

  /* 15 s */
  rhJob(slotTick,15000,true);
  rhJob(healthTick,15000,true);
  rhJob(function(){var el=document.getElementById('rhNowLine');
    if(el&&typeof rhPct==='function')el.style.left=rhPct(rhMinOfDay(Date.now()))+'%';},15000,false);
  rhJob(function(){if(!rhDrag)rhV6Pass();},15000,false);
  rhJob(rhPolishPass,15000,false);
  rhJob(rhHelpPass,15000,false);
  rhJob(rhFixPass,15000,false);

  /* 30 s */
  rhJob(nextSlotMount,30000,false);
  rhJob(function(){var el=document.getElementById('goals-card-extra');if(!el)return;
    var a=document.querySelector('.nav-btn.active');
    if(a&&a.textContent.indexOf('Ημέρα')>=0)el.innerHTML=rhGoalsCardHTML();},30000,false);
  rhJob(function(){var el=document.getElementById('rhPlannedStat');if(!el)return;
    var a=document.querySelector('.nav-btn.active');
    if(a&&a.textContent.indexOf('Ημέρα')>=0){var st=el.querySelector('strong');
      if(st)st.textContent=fmtHM(rhTodayNums().planned);}},30000,false);
  rhJob(function(){rhLightInit();rhColorInit();rhNoteBtn();rhPomoFrame();rhPomoGear();rhSndSync();},30000,false);
  rhJob(function(){rhThemeApply();rhThemeGrid();bfCfgNode();},30000,false);
  rhJob(function(){rhEmptyPass();rhObGuard();},30000,false);

  /* 60 s */
  rhJob(rhReviewAsk,60000,true);
  rhJob(function(){var el=document.getElementById('rh-hour-card');if(!el)return;
    var a=document.querySelector('.nav-btn.active');
    if(a&&a.textContent.indexOf('Ανάλυση')>=0)el.innerHTML=rhHourCardHTML();},60000,false);
}

/* ---- 4. ΕΚΚΙΝΗΣΗ: το ΜΟΝΟ render της φόρτωσης ---- */
function rhBoot(){
  if(window.__rhBooted)return;
  window.__rhBooted=true;
  try{applyUi();}catch(e){}
  try{gpBuildPanel();}catch(e){}
  try{rhThemeApply();}catch(e){}
  try{rhThemeGrid();rhPanelScrollFix();}catch(e){}
  try{rhNoteBtn();rhPomoFrame();rhPomoGear();}catch(e){}
  window.__rhBooting=false;
  render();
  rhJobsInit();
  setInterval(rhDispatch,250);
  try{rhObGuard();}catch(e){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',rhBoot);
else setTimeout(rhBoot,0);
/* ===== ΤΕΛΟΣ ΠΥΡΗΝΑ ===== */
</script>
